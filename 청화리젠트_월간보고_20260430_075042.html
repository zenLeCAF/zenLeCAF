// 퇴실자 관리 전용 패널
function openMoveOutInfo(){
    const panel = document.getElementById('moveOutPanel');
    if(panel.style.display === 'block'){ closeAllPanels(); return; }
    closeAllPanels();

    const moveOuts = [];
    ROOMS.forEach(r => {
        r.tenants.forEach(t => {
            if(t.isPast){
                moveOuts.push({room:r.room, floor:r.floor, roomObj:r, _tenantRef: t, ...t});
            }
        });
    });

    const totalMoveOut = moveOuts.length;
    const totalDeposit = moveOuts.reduce((s,t)=>s+(Number(t.deposit)||0),0);
    const now = new Date();
    const sixMonthsAgo = new Date(now.getFullYear(), now.getMonth()-6, 1);
    const recentMoveOuts = moveOuts.filter(t => {
        const d = t.moveOutDate || t.contractEnd;
        if(!d) return false;
        const dt = new Date(d.replace(/\./g,'-'));
        return !isNaN(dt) && dt >= sixMonthsAgo;
    });

    // ===== 퇴실자별 미납 계산 =====
    let pastRentSum = 0, pastElecSum = 0;
    const pastUnpaidMap = new Map();
    moveOuts.forEach(t => {
        const u = pastTenantUnpaid(t.roomObj, t._tenantRef || t);
        pastRentSum += u.rent;
        pastElecSum += u.elec;
        pastUnpaidMap.set(t.room + '|' + t.tenant, u);
    });

    // ===== 방별 미납 집계 (현재 입주자 + 퇴실자) — 분리 표시 =====
    const byRoomCurrent = [];   // 현재 입주자별 미납
    const byRoomPast = [];      // 퇴실자별 미납
    let byRoomCurRent=0, byRoomCurElec=0, byRoomPastRent=0, byRoomPastElec=0;
    ROOMS.forEach(r => {
        // ---- 현재 입주자 미수 (월별 상세) ----
        const cur = currentTenant(r);
        if(cur && !cur.isPast){
            const monthlyTotal = cur.monthlyTotal || ((Number(cur.rent)||0) + (Number(cur.mgmtNum)||0) + (Number(cur.parkingNum)||0));
            const csKey = cur.contractStart ? cur.contractStart.replace(/\./g,'-').slice(0,7) : null;
            const rentDetails = [];
            let curRent = 0, curElec = 0;
            extMonthsForTenant(cur).forEach(m => {
                if(csKey && m < csKey) return;
                if(rentPayStatus(cur, m).cls === 'unpaid'){
                    rentDetails.push({m, amount: monthlyTotal, isOld: isOldRentMonth(m)});
                    curRent += monthlyTotal;
                }
            });
            const elecDetails = [];
            if(r.elec){
                Object.entries(r.elec).forEach(([m, e]) => {
                    if(!e) return;
                    if(_resolveBillTenant(r, m, e) !== cur) return;
                    const bill = Number(e.bill) || 0;
                    if(bill <= 0) return;
                    if(!_elecHasPaidInput(e)) return; // 사용자 룰: 입금 정보 미입력은 미납 X
                    const paid = elecPaidOf(e);
                    const diff = bill - paid;
                    if(diff > 0){
                        elecDetails.push({m, diff});
                        curElec += diff;
                    }
                });
            }
            const total = curRent + curElec;
            // 모든 현재 입주자 표시 (완납 포함). 합계 누적은 미납 있을 때만.
            byRoomCurrent.push({
                room: r.room, floor: r.floor,
                tenant: cur.tenant || '-',
                phone: cur.phone || '',
                contractStart: cur.contractStart || '',
                contractEnd: cur.contractEnd || '',
                rentDetails, elecDetails,
                rentTotal: curRent, elecTotal: curElec, total,
                isPaid: total === 0
            });
            if(total > 0){
                byRoomCurRent += curRent;
                byRoomCurElec += curElec;
            }
        }
        // ---- 퇴실자 (모든 퇴실자 표시, 미수 0이면 정산완료 배지) ----
        pastTenants(r).forEach(pt => {
            const u = pastTenantUnpaid(r, pt);
            const monthlyTotal = pt.monthlyTotal || ((Number(pt.rent)||0) + (Number(pt.mgmtNum)||0) + (Number(pt.parkingNum)||0));
            const rentDetails = (u.rentMonths || []).map(m => ({m, amount: monthlyTotal}));
            const elecDetails = (u.elecDetails || []).map(d => ({m: d.month, diff: d.diff}));
            const total = (u.rent || 0) + (u.elec || 0);
            byRoomPast.push({
                room: r.room, floor: r.floor,
                tenant: pt.tenant || '-',
                phone: pt.phone || '',
                contractStart: pt.contractStart || '',
                contractEnd: pt.contractEnd || '',
                moveOutDate: pt.moveOutDate || '',
                rentDetails, elecDetails,
                rentTotal: u.rent || 0, elecTotal: u.elec || 0, total,
                isPaid: total === 0
            });
            if(total > 0){
                byRoomPastRent += (u.rent || 0);
                byRoomPastElec += (u.elec || 0);
            }
        });
    });
    // 방번호 정렬
    byRoomCurrent.sort((a,b) => String(a.room).localeCompare(String(b.room), 'ko', {numeric:true}));
    byRoomPast.sort((a,b) => String(a.room).localeCompare(String(b.room), 'ko', {numeric:true}));
    const byRoomGrandTotal = byRoomCurRent + byRoomCurElec + byRoomPastRent + byRoomPastElec;

    // ===== 월별 미납 집계 =====
    const byMonth = {}; // m -> {rent, elec, rentRows:[], elecRows:[], isOld}
    ROOMS.forEach(r => {
        // 현재 입주자 고정비
        const cur = currentTenant(r);
        if(cur && !cur.isPast){
            const monthlyTotal = cur.monthlyTotal || ((Number(cur.rent)||0) + (Number(cur.mgmtNum)||0) + (Number(cur.parkingNum)||0));
            const csKey = cur.contractStart ? cur.contractStart.replace(/\./g,'-').slice(0,7) : null;
            extMonthsForTenant(cur).forEach(m => {
                if(csKey && m < csKey) return;
                if(rentPayStatus(cur, m).cls === 'unpaid'){
                    if(!byMonth[m]) byMonth[m] = {rent:0, elec:0, rentRows:[], elecRows:[], isOld: isOldRentMonth(m)};
                    byMonth[m].rent += monthlyTotal;
                    byMonth[m].rentRows.push({
                        room: r.room, tenant: cur.tenant, phone: cur.phone||'',
                        contractStart: cur.contractStart||'', contractEnd: cur.contractEnd||'',
                        moveOutDate: '', isPast: false,
                        rent: Number(cur.rent)||0, mgmtNum: Number(cur.mgmtNum)||0, parkingNum: Number(cur.parkingNum)||0,
                        monthlyTotal: monthlyTotal
                    });
                }
            });
        }
        // 퇴실자 고정비
        pastTenants(r).forEach(pt => {
            const csKey = pt.contractStart ? pt.contractStart.replace(/\./g,'-').slice(0,7) : null;
            const endSrc = pt.moveOutDate || pt.contractEnd || '';
            const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
            const monthlyTotal = pt.monthlyTotal || ((Number(pt.rent)||0) + (Number(pt.mgmtNum)||0) + (Number(pt.parkingNum)||0));
            extMonthsForTenant(pt).forEach(m => {
                if(csKey && m < csKey) return;
                if(ceKey && m > ceKey) return;
                if(rentPayStatus(pt, m).cls === 'unpaid'){
                    if(!byMonth[m]) byMonth[m] = {rent:0, elec:0, rentRows:[], elecRows:[], isOld: isOldRentMonth(m)};
                    byMonth[m].rent += monthlyTotal;
                    byMonth[m].rentRows.push({
                        room: r.room, tenant: pt.tenant, phone: pt.phone||'',
                        contractStart: pt.contractStart||'', contractEnd: pt.contractEnd||'',
                        moveOutDate: pt.moveOutDate||'', isPast: true,
                        rent: Number(pt.rent)||0, mgmtNum: Number(pt.mgmtNum)||0, parkingNum: Number(pt.parkingNum)||0,
                        monthlyTotal: monthlyTotal
                    });
                }
            });
        });
        // 전기세 미수 - 룰: 부과>0 + 입금 정보 명시 입력 + 입금 < 부과 = 미납
        if(r.elec){
            Object.entries(r.elec).forEach(([m, e]) => {
                if(!e) return;
                const bill = Number(e.bill) || 0;
                if(bill <= 0) return;
                if(!_elecHasPaidInput(e)) return; // 입금 미입력은 미납 X
                const paid = elecPaidOf(e);
                const diff = bill - paid;
                if(diff > 0){
                    if(!byMonth[m]) byMonth[m] = {rent:0, elec:0, rentRows:[], elecRows:[], isOld: isOldElecMonth(m)};
                    byMonth[m].elec += diff;
                    byMonth[m].elecRows.push({
                        room: r.room, name: e.name||'(미지정)', bill: bill, paid: paid, diff: diff
                    });
                }
            });
        }
    });
    const monthKeys = Object.keys(byMonth).sort().reverse();
    let monthGrandRent = 0, monthGrandElec = 0;
    monthKeys.forEach(m => { monthGrandRent += byMonth[m].rent; monthGrandElec += byMonth[m].elec; });

    // ===== HTML =====
    let html = `<div class="panelHead">
        <h2>🚪 퇴실자 관리 <span class="phPill-warn">미납 정산 현황</span></h2>
        <button class="csvBtn" onclick="downloadPanelCSV('moveOutPanel','퇴실자관리')">📥 CSV 다운로드</button>
    </div>`;

    html += `<div class="moveOutSummary">
        <div class="pill">총 퇴실 이력 <b>${totalMoveOut}건</b></div>
        <div class="pill info">최근 6개월 퇴실 <b>${recentMoveOuts.length}건</b></div>
        <div class="pill warn">총 보증금 규모 <b>${fmt(totalDeposit)}원</b></div>
        <div class="pill danger">퇴실자 미수 고정비 <b>${fmt(pastRentSum)}원</b></div>
        <div class="pill danger">퇴실자 미수 전기 <b>${fmt(pastElecSum)}원</b></div>
        <div class="pill danger"><b style="font-size:15px">퇴실자 미수 합계 ${fmt(pastRentSum+pastElecSum)}원</b></div>
    </div>`;

    // ---- 섹션 1: 퇴실자별 미납 상세 ----
    html += `<h3 style="margin:18px 0 8px 0;color:#b91c1c;font-size:15px">① 퇴실자별 미납 내역</h3>`;
    html += `<div class="filterBar">
        <input id="moveOutFilter" placeholder="이름/호실/연락처 검색" oninput="filterMoveOuts()">
        <select id="moveOutPeriod" onchange="filterMoveOuts()">
            <option value="all">전체 기간</option>
            <option value="6m">최근 6개월</option>
            <option value="1y">최근 1년</option>
        </select>
    </div>`;
    html += `<table class="reportTable" id="moveOutTable"><thead><tr>
        <th>호실</th><th>이름</th><th>연락처</th>
        <th>계약시작</th><th>계약만기</th><th>퇴실일</th>
        <th class="num">보증금</th>
        <th class="num">월세</th>
        <th class="num">관리비</th>
        <th class="num">주차비</th>
        <th class="num" style="background:#f1f5f9">고정합계</th>
        <th class="num" style="background:#cbd5e1">미수<br>고정비</th>
        <th class="num" style="background:#cbd5e1">미수<br>전기</th>
        <th class="num" style="background:#94a3b8">미수합계</th>
        <th style="min-width:180px">미납 상세</th>
        <th>정산상태</th>
    </tr></thead><tbody>`;

    // 방번호 정렬 (자연 정렬: B01, 101, 102 ...)
    moveOuts.sort((a,b) => String(a.room).localeCompare(String(b.room), 'ko', {numeric:true}));

    moveOuts.forEach(t => {
        const moveDate = t.moveOutDate || t.contractEnd || '-';
        const settle = t.settlementStatus || '<span class="badge-none">미정</span>';
        const dt = new Date((moveDate||'').replace(/\./g,'-'));
        let periodTag = 'old';
        if(!isNaN(dt)){
            const mm = (now.getFullYear()-dt.getFullYear())*12 + (now.getMonth()-dt.getMonth());
            if(mm <= 6) periodTag = 'recent6m';
            else if(mm <= 12) periodTag = 'recent1y';
        }
        const u = pastUnpaidMap.get(t.room + '|' + t.tenant) || {rent:0, elec:0, total:0, rentMonths:[], elecDetails:[]};
        const rowCls = '';
        const tMonthly = t.monthlyTotal || ((Number(t.rent)||0) + (Number(t.mgmtNum)||0) + (Number(t.parkingNum)||0));
        let detailBadges = [];
        u.rentMonths.forEach(m => {
            detailBadges.push(`<span style="display:inline-block;background:#e2e8f0;color:#1e293b;padding:1px 6px;border-radius:4px;margin:1px 2px;font-size:11px;border:1px solid #cbd5e1">${m.slice(2)} 고정 ${fmt(tMonthly)}</span>`);

            <td>${settle}</td></tr>`;
    });
    // 합계 행 (필터 적용된 행만 합산 — filterMoveOuts 호출 시 갱신)
    html += `<tr id="moveOutTotalRow" style="background:#fef3c7;font-weight:800;border-top:2px solid #b45309">
        <td colspan="6">합계 <span id="moveOutFilterCnt" style="color:#1e293b;font-weight:700">(전체 ${moveOuts.length}건)</span> <span style="font-size:11px;font-weight:500;color:#64748b">※ 검색·기간 필터 적용 시 자동 갱신</span></td>
        <td class="num" id="moSumDeposit" style="background:#e0f2fe;color:#075985">-</td>
        <td class="num" id="moSumRent">-</td>
        <td class="num" id="moSumMgmt">-</td>
        <td class="num" id="moSumPark">-</td>
        <td class="num" id="moSumFixed" style="background:#f8fafc">-</td>
        <td class="num" id="moSumRentArr" style="color:#b91c1c">-</td>
        <td class="num" id="moSumElecArr" style="color:#b91c1c">-</td>
        <td class="num" id="moSumTotArr" style="color:#b91c1c;font-size:14px;background:#fecaca">-</td>
        <td colspan="2">-</td>
    </tr>`;
    html += `</tbody></table>`;

function filterMoveOuts(){
    const q = (document.getElementById('moveOutFilter').value||'').toLowerCase();
    const period = document.getElementById('moveOutPeriod').value;
    const rows = document.querySelectorAll('#moveOutTable tbody tr');
    let visible = 0;
    let sums = {deposit:0, rent:0, mgmt:0, park:0, fixed:0, rentArr:0, elecArr:0, totArr:0};
    rows.forEach(tr => {
        if(tr.id === 'moveOutTotalRow') return; // 합계 행 skip
        const matchQ = !q || (tr.dataset.search||'').includes(q);
        const p = tr.dataset.period;
        const matchP = period==='all' || (period==='6m' && p==='recent6m') || (period==='1y' && (p==='recent6m'||p==='recent1y'));
        const show = matchQ && matchP;
        tr.style.display = show ? '' : 'none';
        if(show){
            visible++;
            sums.deposit += Number(tr.dataset.deposit) || 0;
            sums.rent    += Number(tr.dataset.rent)    || 0;
            sums.mgmt    += Number(tr.dataset.mgmt)    || 0;
            sums.park    += Number(tr.dataset.park)    || 0;
            sums.fixed   += Number(tr.dataset.fixed)   || 0;
            sums.rentArr += Number(tr.dataset.rentarr) || 0;
            sums.elecArr += Number(tr.dataset.elecarr) || 0;
            sums.totArr  += Number(tr.dataset.totarr)  || 0;
        }
    });
    function _fs(n){ return n > 0 ? n.toLocaleString('ko-KR') : '-'; }
    var pairs = [['moSumDeposit', sums.deposit], ['moSumRent', sums.rent], ['moSumMgmt', sums.mgmt],
                 ['moSumPark', sums.park], ['moSumFixed', sums.fixed], ['moSumRentArr', sums.rentArr],
                 ['moSumElecArr', sums.elecArr], ['moSumTotArr', sums.totArr]];
    pairs.forEach(p => { var el = document.getElementById(p[0]); if(el) el.textContent = _fs(p[1]); });
    var cntEl = document.getElementById('moveOutFilterCnt');
    if(cntEl) cntEl.textContent = '(필터 적용 ' + visible + '건)';
}

function renderMonthlyUnpaid(){
    const panel = document.getElementById('monthlyUnpaidPanel');
    if(!panel) return;
    // 월별 집계: m -> { rentRows:[{room,tenant,amount,phone,isPast,moveOutDate}], elecRows:[{room,name,bill,paid,diff}] }
    const byMonth = {};
    ROOMS.forEach(r => {
        (r.tenants||[]).forEach(t => {
            const monthlyTotal = t.monthlyTotal || ((Number(t.rent)||0) + (Number(t.mgmtNum)||0) + (Number(t.parkingNum)||0));
            if(!monthlyTotal) return;
            const csKey = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
            const endSrc = t.moveOutDate || t.contractEnd || '';
            const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
            extMonthsForTenant(t).forEach(m => {
                if(csKey && m < csKey) return;
                if(ceKey && m > ceKey) return;
                if(rentPayStatus(t, m).cls === 'unpaid'){
                    if(!byMonth[m]) byMonth[m] = {rentRows:[], elecRows:[], isOld: isOldRentMonth(m)};
                    byMonth[m].rentRows.push({
                        room: r.room, tenant: t.tenant, amount: monthlyTotal,
                        phone: t.phone||'', isPast: !!t.isPast, moveOutDate: t.moveOutDate||'',
                        contractStart: t.contractStart||'', contractEnd: t.contractEnd||'',
                        rent: Number(t.rent)||0, mgmtNum: Number(t.mgmtNum)||0, parkingNum: Number(t.parkingNum)||0
                    });
                }
            });
        });
        if(r.elec){
            Object.entries(r.elec).forEach(([m,e]) => {
                if(!e) return;
                const bill = Number(e.bill) || 0;
                if(bill <= 0) return;
                const paid = elecPaidOf(e);
                const diff = bill - paid;
                if(diff > 0){
                    if(!byMonth[m]) byMonth[m] = {rentRows:[], elecRows:[], isOld: isOldElecMonth(m)};
                    byMonth[m].elecRows.push({
                        room: r.room, name: e.name||'(미지정)', bill, paid, diff
                    });
                }
            });
        }
    });
    const months = Object.keys(byMonth).sort().reverse();
    let grandRent = 0, grandElec = 0, totalRoomsSet = new Set();
    months.forEach(m => {
        byMonth[m].rentRows.forEach(x => { grandRent += x.amount; totalRoomsSet.add(x.room); });
        byMonth[m].elecRows.forEach(x => { grandElec += x.diff; totalRoomsSet.add(x.room); });
    });
    const grandTotal = grandRent + grandElec;
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const nowStr = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

    let html = '';
    html += '<div class="muHeader">';
    html += '<h2>📊 전체 월별 미납현황</h2>';
    html += `<span class="muSub">전체 ${ROOMS.length}개 방 · 미납 발생 ${totalRoomsSet.size}개 방 · 미납 발생 ${months.length}개월 · 기준: ${nowStr}</span>`;
    html += '<div class="muTopActions">';
    html += '<button class="csvBtn" onclick="downloadPanelCSV(\'monthlyUnpaidPanel\',\'전체월별미납\')">📥 CSV 저장</button>';
    html += '<button class="closeBtn" onclick="closeAllPanels()">✕ 닫기</button>';
    html += '</div></div>';

    // 요약 카드 4개
    html += '<div class="muSummary">';
    html += `<div class="muSumCard danger"><div class="cLabel">총 미납 합계</div><div class="cValue" style="color:#991b1b">${fmt(grandTotal)}원</div></div>`;
    html += `<div class="muSumCard warn"><div class="cLabel">고정비 미납 (월세+관리+주차)</div><div class="cValue" style="color:#b45309">${fmt(grandRent)}원</div></div>`;
    html += `<div class="muSumCard"><div class="cLabel">전기세 미수 (부과-입금)</div><div class="cValue" style="color:#92400e">${fmt(grandElec)}원</div></div>`;
    html += `<div class="muSumCard ${months.length===0?'ok':''}"><div class="cLabel">미납 발생 개월수 / 방수</div><div class="cValue" style="color:${months.length===0?'#15803d':'#0f172a'}">${months.length}개월 / ${totalRoomsSet.size}개 방</div></div>`;
    html += '</div>';

    if(months.length === 0){
        html += '<div style="padding:40px;text-align:center;background:#f0fdf4;border:2px dashed #86efac;border-radius:12px;color:#15803d;font-weight:800;font-size:16px">✅ 전 방 · 전 기간 미납 없음</div>';
        panel.innerHTML = html;
        return;
    }

    // 월별 블록 (최신 월부터)
    months.forEach(m => {
        const data = byMonth[m];
        const rentSum = data.rentRows.reduce((s,x)=>s+x.amount, 0);
        const elecSum = data.elecRows.reduce((s,x)=>s+x.diff, 0);
        const monthTotal = rentSum + elecSum;
        const roomCount = new Set([...data.rentRows.map(x=>x.room), ...data.elecRows.map(x=>x.room)]).size;
        // 호실별로 합산: room -> {tenant, rent, elec}
        const byRoom = {};
        data.rentRows.forEach(x => {
            if(!byRoom[x.room]) byRoom[x.room] = {
                room:x.room, tenant:x.tenant, phone:x.phone, isPast:x.isPast, moveOutDate:x.moveOutDate,
                contractStart:x.contractStart||'', contractEnd:x.contractEnd||'',
                rent:0, elec:0, elecName:'',
                mRent:x.rent||0, mMgmt:x.mgmtNum||0, mPark:x.parkingNum||0
            };
            byRoom[x.room].rent += x.amount;
            // 계약 정보가 비어있으면 보완
            if(!byRoom[x.room].contractStart) byRoom[x.room].contractStart = x.contractStart||'';
            if(!byRoom[x.room].contractEnd) byRoom[x.room].contractEnd = x.contractEnd||'';
        });
        data.elecRows.forEach(x => {
            if(!byRoom[x.room]) byRoom[x.room] = {
                room:x.room, tenant:x.name, phone:'', isPast:false, moveOutDate:'',
                contractStart:'', contractEnd:'',
                rent:0, elec:0, elecName:x.name,
                mRent:0, mMgmt:0, mPark:0
            };
            byRoom[x.room].elec += x.diff;
            byRoom[x.room].elecName = x.name;
        });
        const sortedRooms = Object.values(byRoom).sort((a,b) => String(a.room).localeCompare(String(b.room)));
        html += '<div class="muMonthBlock">';
        html += '<div class="muMonthHead">';
        html += `<h3>${monthLabel(m)}</h3>`;
        html += `<span class="muRoomCount">${roomCount}개 방 미납</span>`;
        html += `<span class="muTotal">월 합계 ${fmt(monthTotal)}원</span>`;
        html += '</div>';
        html += '<table class="muTable"><thead><tr>';
        html += '<th style="width:60px">호실</th>';
        html += '<th style="min-width:100px">입주자</th>';
        html += '<th style="min-width:110px">연락처</th>';
        html += '<th style="min-width:165px;font-size:10.5px">계약기간</th>';
        html += '<th class="num" style="min-width:70px;font-size:10.5px">월세</th>';
        html += '<th class="num" style="min-width:60px;font-size:10.5px">관리</th>';
        html += '<th class="num" style="min-width:55px;font-size:10.5px">주차</th>';
        html += '<th class="num" style="min-width:110px;background:#fef2f2">고정비 미납</th>';
        html += '<th class="num" style="min-width:110px;background:#fef2f2">전기세 미수</th>';
        html += '<th class="num" style="min-width:120px;background:#fef3c7">합계</th>';
        html += '</tr></thead><tbody>';
        sortedRooms.forEach(rr => {
            const tot = rr.rent + rr.elec;
            const pastTag = rr.isPast ? `<span style="display:inline-block;background:#fee2e2;color:#991b1b;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:4px">퇴실${rr.moveOutDate?' '+rr.moveOutDate:''}</span>` : '';
            const cs = rr.contractStart || '-';
            const ce = rr.moveOutDate || rr.contractEnd || '-';
            const periodTxt = (cs==='-' && ce==='-') ? '<span style="color:#9ca3af">-</span>' : `${cs} ~ ${ce}`;
            html += `<tr>
                <td style="font-weight:900;font-size:14px;color:#0f172a">${rr.room}</td>
                <td style="font-weight:700">${rr.tenant||'-'}${pastTag}</td>
                <td style="color:#475569;font-size:11.5px">${rr.phone||'-'}</td>
                <td style="color:#475569;font-size:10.5px;line-height:1.3">${periodTxt}</td>
                <td class="num" style="font-size:11px;color:${rr.mRent>0?'#0f172a':'#9ca3af'}">${rr.mRent>0?fmt(rr.mRent):'-'}</td>
                <td class="num" style="font-size:11px;color:${rr.mMgmt>0?'#0f172a':'#9ca3af'}">${rr.mMgmt>0?fmt(rr.mMgmt):'-'}</td>
                <td class="num" style="font-size:11px;color:${rr.mPark>0?'#0f172a':'#9ca3af'}">${rr.mPark>0?fmt(rr.mPark):'-'}</td>
                <td class="num" style="color:${rr.rent>0?'#991b1b':'#9ca3af'};font-weight:${rr.rent>0?'800':'500'}">${rr.rent>0?fmt(rr.rent)+'원':'-'}</td>
                <td class="num" style="color:${rr.elec>0?'#475569':'#9ca3af'};font-weight:${rr.elec>0?'800':'500'}">${rr.elec>0?fmt(rr.elec)+'원':'-'}</td>
                <td class="num" style="color:#1e293b;background:#e2e8f0;font-weight:900">${fmt(tot)}원</td>
            </tr>`;
        });
        html += `<tr class="muSubTotal">
            <td colspan="7" style="text-align:right">소계 (${roomCount}개 방)</td>
            <td class="num" style="color:#991b1b">${rentSum>0?fmt(rentSum)+'원':'-'}</td>
            <td class="num" style="color:#b45309">${elecSum>0?fmt(elecSum)+'원':'-'}</td>
            <td class="num" style="color:#7c2d12;background:#fde68a">${fmt(monthTotal)}원</td>
        </tr>`;
        html += '</tbody></table>';
        html += '</div>';
    });

    html += '<div style="font-size:11px;color:#94a3b8;margin-top:14px;padding:10px 14px;background:#f8fafc;border-radius:8px">';
    html += '※ <b>고정비 미납</b> = 해당 월 월세+관리비+주차 통합 입금이 없거나 부족한 경우 (현재 입주자 + 퇴실자 모두 포함, 계약기간 내 월만 집계)<br>';
    html += '※ <b>전기세 미수</b> = 해당 월 부과금 - 입금액 (양수만 표시)<br>';
    html += '※ 표는 미납이 발생한 월만 표시 (최신 월이 위)';
    html += '</div>';

    panel.innerHTML = html;
}

// 데이터 입력 (매월 입금/부과 데이터 편집) — localStorage 저장
// =================================================================
const DE_STORAGE_KEY = 'cheonghwa_regent_overrides_v1';
window._deCurrentRoom = null;
window._deActiveTab = 'payments'; // 'payments' | 'replace'
window._deDirty = {}; // {roomKey: {payments:{m:{field:val}}, elec:{m:{field:val}}}}

function deLoadOverrides(){
    try{ return JSON.parse(localStorage.getItem(DE_STORAGE_KEY) || '{}'); }
    catch(err){ console.error('override load error', err); return {}; }
}
function deSaveOverrides(obj){
    localStorage.setItem(DE_STORAGE_KEY, JSON.stringify(obj));
}

// ROOMS 원본은 그대로 두고, 사본을 만들어 오버라이드 적용
function deApplyOverridesToRooms(){
    // 입주자 edits 먼저 적용 (mgmtNum/parkingNum/rent 등 기본 정보 보호)
    try { if(typeof applyTenantEditsToRooms === 'function') applyTenantEditsToRooms(); } catch(_){}
    const ov = deLoadOverrides();
    // 701호는 이전 입주자 기록 영구 차단 — 무조건 _tenantReplacements 무시
    if(ov['701'] && ov['701']._tenantReplacements){
        delete ov['701']._tenantReplacements;
    }
    Object.entries(ov).forEach(([roomKey, roomOv]) => {
        const r = ROOMS.find(x => x.room === roomKey);
        if(!r) return;
        // payments: 현재 입주자에게만 적용
        if(roomOv.payments){
            const t = r.tenants.find(tt => !tt.isPast);
            if(t){
                if(!t.payments) t.payments = {};
                Object.entries(roomOv.payments).forEach(([m, v]) => {
                    if(!t.payments[m]) t.payments[m] = {name: t.tenant};
                    Object.entries(v).forEach(([k, val]) => {
                        if(val === '' || val === undefined) return;
                        t.payments[m][k] = val;
                    });
                });
                // 파생 필드 재계산
                t.monthlyTotal = (Number(t.rent)||0) + (Number(t.mgmtNum)||0) + (Number(t.parkingNum)||0);
            }
        }
        // elec
        if(roomOv.elec){
            if(!r.elec) r.elec = {};
            Object.entries(roomOv.elec).forEach(([m, v]) => {
                if(!r.elec[m]) r.elec[m] = {name:null,bill:null,paidAmount:null,received:null};
                Object.entries(v).forEach(([k, val]) => {
                    if(val === '' || val === undefined) return;
                    r.elec[m][k] = val;
                });
            });
        }
        // 입주자 교체 이력 반영: 현재 입주자를 isPast 처리 + 신규 입주자 append (idempotent)
        if(Array.isArray(roomOv._tenantReplacements)){
            roomOv._tenantReplacements.forEach(rec => {
                // 퇴실 처리 — outTenantName 엄격 매칭 (재실행 안전)
                if(rec.moveOutDate && rec.outTenantName){
                    const outT = r.tenants.find(tt => !tt.isPast && tt.tenant === rec.outTenantName);
                    if(outT){
                        outT.isPast = true;
                        outT.moveOutDate = rec.moveOutDate;
                        // 계약만기가 없거나 이전이면 퇴실일로 맞춤 (퇴실자관리 기간 표시용)
                        if(!outT.contractEnd || outT.contractEnd < rec.moveOutDate){
                            outT.contractEnd = rec.moveOutDate;
                        }
                        if(rec.settlementStatus) outT.settlementStatus = rec.settlementStatus;
                        if(rec.refundAmount !== null && rec.refundAmount !== undefined) outT.refundAmount = rec.refundAmount;
                        // 퇴실메모 누적 (중복 방지)
                        if(rec.outNote){
                            const addNote = String(rec.outNote);
                            if(!outT.moveOut){
                                outT.moveOut = addNote;
                            } else if(outT.moveOut.indexOf(addNote) < 0){
                                outT.moveOut = outT.moveOut + ' / ' + addNote;
                            }
                        }
                    }
                }
                // 신규 입주 처리 — 동일 이름+계약시작 중복 방지
                if(rec.newTenant){
                    const exists = r.tenants.some(tt => tt.tenant === rec.newTenant.tenant && tt.contractStart === rec.newTenant.contractStart);
                    if(!exists){
                        r.tenants.push(JSON.parse(JSON.stringify(rec.newTenant)));
                    }
                }
            });
        }
    });
}

function openDataEntry(){

// === 전기료 원장관리 - 방별·월별 조회 (read-only) ===
function openElecLedger(){
    try {
        var panel = document.getElementById('elecLedgerPanel');
        if(!panel){ alert('전기료 원장관리 패널 요소 없음 (elecLedgerPanel)'); return; }
        if(panel.style.display === 'block'){ closeAllPanels(); return; }
        closeAllPanels();
        renderElecLedger();
        panel.style.display = 'block';
    } catch(err){
        console.error('openElecLedger error:', err);
        alert('전기료 원장관리 에러: ' + err.message + '\n\nF12 콘솔에서 확인하세요.');
    }
}

function renderElecLedger(){
    var panel = document.getElementById('elecLedgerPanel');
    if(!panel) return;

    // 모든 elec 데이터에서 월 키 추출
    var allMonthSet = {};
    ELEC_MONTHS.forEach(function(m){ allMonthSet[m] = true; });
    ROOMS.forEach(function(r){
        if(r.elec) Object.keys(r.elec).forEach(function(m){ allMonthSet[m] = true; });
    });
    var months = Object.keys(allMonthSet).sort().reverse();

    // 행 수집: 같은 호실의 다른 이름 그룹 → 시간 역순. gIdx>0이면 퇴실
    var rows = [];
    ROOMS.forEach(function(r){
        if(!r.elec || Object.keys(r.elec).length === 0){
            var cur = (r.tenants||[]).find(function(t){ return t && !t.isPast; });
            var nm = cur ? cur.tenant : '(이력 없음)';
            rows.push({room: r.room, name: nm, isEmpty: true, isPast: false, data: {}});
            return;
        }
        var byName = {};
        Object.keys(r.elec).forEach(function(m){
            var d = r.elec[m] || {};
            var nm = d.name || '(이름없음)';
            if(!byName[nm]) byName[nm] = {name: nm, latestMonth: '', data: {}};
            byName[nm].data[m] = d;
            if(m > byName[nm].latestMonth) byName[nm].latestMonth = m;
        });
        var groups = Object.keys(byName).map(function(k){ return byName[k]; }).sort(function(a, b){
            return (b.latestMonth||'').localeCompare(a.latestMonth||'');
        });
        groups.forEach(function(g, gIdx){
            rows.push({room: r.room, name: g.name, data: g.data, isEmpty: false, isPast: gIdx > 0});
        });
    });

    var fmtN = function(n){
        if(n == null || n === '') return '';
        var x = Number(n);
        if(isNaN(x) || x === 0) return '';
        return x.toLocaleString();
    };

    // === HTML 빌드 ===
    var html = '<div class="de-header" style="border-left-color:#475569">'
        + '<h2 style="color:#1e293b;font-size:20px;margin:0">⚡ 전기 부과자료</h2>'
        + '<span style="font-size:14px;color:#64748b;margin-left:10px;align-self:center">방별 · 월별 부과서 원장 (검침 / 사용량 / 산출요금 / 미납요금 / 부과요금 / 비고)</span>'
        + '<div class="de-actions">'
        + '<span style="font-size:14px;color:#475569;margin-right:10px">행: <b>' + rows.length + '</b> · 월: <b>' + months.length + '</b></span>'
        + '<button onclick="closeAllPanels()" style="background:#fff;color:#475569">✕ 닫기</button>'
        + '</div></div>';

    // === 월별 부과서 메타 정보 카드 ===
    var metaMonths = months.slice();
    var metaTbl = '<div style="margin:10px 0 16px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden">';
    metaTbl += '<div style="padding:8px 14px;background:#f1f5f9;border-bottom:1px solid #cbd5e1;font-size:15px;font-weight:800;color:#1e293b">📅 월별 부과서 메타 정보 <span style="font-size:13px;font-weight:600;color:#64748b;margin-left:8px">검침일자 / 한전확인일자 / 단가 / 자체+공용 사용량/금액 / 합계 / 세대당공용요금 / 세대수</span></div>';
    metaTbl += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;font-family:\'Malgun Gothic\',sans-serif">';
    metaTbl += '<thead><tr style="background:#334155;color:#fff;font-weight:700">';
    var headers = ['월','검침일자','한전확인일자','계량기번호','단가<br>(원/Kw)','자체<br>사용량(Kw)','자체<br>금액(검)','자체<br>금액(한전)','공용<br>사용량(Kw)','공용<br>금액(검)','공용<br>금액(한전)','합계<br>사용량','합계<br>금액','세대당<br>공용요금','세대수'];
    headers.forEach(function(h){
        metaTbl += '<th style="padding:5px 6px;border:1px solid #475569;font-size:12.5px;text-align:center">' + h + '</th>';
    });
    metaTbl += '</tr></thead><tbody>';
    var fmtAmt = function(v){ return (v == null || v === '') ? '-' : Number(v).toLocaleString(); };
    metaMonths.forEach(function(m){
        var meta = (typeof ELEC_MONTH_META !== 'undefined' && ELEC_MONTH_META[m]) || {};
        metaTbl += '<tr style="border-bottom:1px solid #e5e7eb">';
        metaTbl += '<td style="padding:4px 6px;text-align:center;font-weight:800;background:#f8fafc;color:#0f172a">' + m + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:center;color:#475569">' + (meta.meterDate||'-') + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:center;color:#475569">' + (meta.kepcoDate||'-') + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:center;font-family:monospace;font-size:12.5px;color:#475569">' + (meta.meterNo||'-') + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;font-weight:800;color:#1e293b;background:#fef3c7">' + (meta.unitPrice||'-') + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;color:#1e293b">' + fmtAmt(meta.ownUsage) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;color:#475569">' + fmtAmt(meta.ownAmount) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;color:#475569">' + fmtAmt(meta.ownAmount2) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;color:#1e293b">' + fmtAmt(meta.commonUsage) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;color:#475569">' + fmtAmt(meta.commonAmount) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;color:#475569">' + fmtAmt(meta.commonAmount2) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;font-weight:700;color:#1e293b;background:#f8fafc">' + fmtAmt(meta.totalUsage) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;font-weight:800;color:#0f172a;background:#e2e8f0">' + fmtAmt(meta.totalAmount) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:right;color:#1e293b;background:#fef3c7;font-weight:700">' + fmtAmt(meta.commonPerHousehold) + '</td>';
        metaTbl += '<td style="padding:4px 6px;text-align:center;color:#1e293b;font-weight:700">' + (meta.householdCount||'-') + '세대</td>';
        metaTbl += '</tr>';
    });
    metaTbl += '</tbody></table></div></div>';
    html += metaTbl;

    html += '<div class="de-rentGridWrap"><table class="de-rentGrid"><thead>';
    // 1행: 좌측 정보 + 월별 그룹
    html += '<tr>';
    html += '<th class="de-stickyHead" rowspan="2" style="top:0 !important;height:62px;z-index:6;background:#334155;color:#fff;min-width:62px !important;width:62px !important;max-width:75px !important">호실</th>';
    html += '<th rowspan="2" style="background:#334155;color:#fff;min-width:130px;top:0;height:62px;z-index:5;font-size:13px">입주자<br>(부과서)</th>';
    html += '<th rowspan="2" style="background:#475569;color:#fff;min-width:60px;top:0;height:62px;z-index:5;font-size:12.5px;border-right:2px solid #94a3b8">구분</th>';
    months.forEach(function(m){
        html += '<th class="de-monthHead" colspan="10">' + m + '<br><span style="font-size:11.5px;font-weight:600;opacity:.75">부과서 + 입금</span></th>';
    });
    html += '<th rowspan="2" style="background:#0f172a;color:#fff;min-width:96px;top:0;height:62px;z-index:5;border-left:3px solid #94a3b8;font-size:13px">합계<br>부과</th>';
    html += '<th rowspan="2" style="background:#1e3a8a;color:#fff;min-width:96px;top:0;height:62px;z-index:5;font-size:13px">합계<br>입금</th>';
    html += '<th rowspan="2" style="background:#7c2d12;color:#fff;min-width:96px;top:0;height:62px;z-index:5;font-size:13px">합계<br>미수</th>';
    html += '</tr>';
    // 2행: 부과서 sub 컬럼
    html += '<tr>';
    months.forEach(function(m){
        // 월 m 기준: 이전월 검침 / 이번월(m+1) 검침 / 사용량 / 산출요금 / 미납요금 / 부과요금 / 비고
        // 컬럼명에 월 일부 표시
        var mNum = parseInt(m.split('-')[1], 10);
        var prevLabel = mNum + '월<br>검침';
        var nextMNum = mNum === 12 ? 1 : mNum + 1;
        var currLabel = nextMNum + '월<br>검침';
        html += '<th class="de-fieldHead" style="background:#52525b;font-size:12px;min-width:70px">' + prevLabel + '</th>';
        html += '<th class="de-fieldHead" style="background:#52525b;font-size:12px;min-width:70px">' + currLabel + '</th>';
        html += '<th class="de-fieldHead" style="background:#71717a;font-size:12px;min-width:58px">사용량<br>(Kw)</th>';
        html += '<th class="de-fieldHead" style="background:#52525b;font-size:12px;min-width:78px">산출<br>요금</th>';
        html += '<th class="de-fieldHead" style="background:#3f3f46;font-size:12px;min-width:80px">부과<br>요금</th>';
        html += '<th class="de-fieldHead" style="background:#1e3a8a;color:#fff;font-size:12px;min-width:78px">입금<br>금액</th>';
        html += '<th class="de-fieldHead" style="background:#1e3a8a;color:#fff;font-size:11.5px;min-width:60px">받은<br>방번호</th>';
        html += '<th class="de-fieldHead" style="background:#1e3a8a;color:#fff;font-size:11.5px;min-width:80px">받은<br>입실자</th>';
        html += '<th class="de-fieldHead" style="background:#52525b;font-size:12px;min-width:72px">미납<br>요금</th>';
        html += '<th class="de-fieldHead" style="background:#71717a;font-size:12px;min-width:64px">비고</th>';
    });
    html += '</tr></thead><tbody>';

    rows.forEach(function(row){
        var bg = row.isEmpty ? 'background:#fef9c3' : (row.isPast ? 'background:#f1f5f9' : '');
        var stickyBg = row.isEmpty ? '#fef9c3' : (row.isPast ? '#e2e8f0' : '#f8fafc');
        var nameColor = row.isPast ? '#475569' : '#1e293b';
        html += '<tr style="' + bg + '">';
        html += '<td class="de-stickyL" style="text-align:center;background:' + stickyBg + ' !important;font-weight:800;font-size:14px;width:62px !important;min-width:62px !important;max-width:75px !important;color:' + (row.isPast?'#475569':'#0f172a') + '">' + row.room + '</td>';
        html += '<td style="text-align:left;padding-left:8px;font-size:13px;color:' + nameColor + ';font-weight:600;background:' + stickyBg + '">' + (row.name||'-') + '</td>';
        if(row.isPast){
            html += '<td style="text-align:center;background:#cbd5e1;border-right:2px solid #94a3b8;font-size:12.5px;color:#1e293b;font-weight:800;padding:2px 6px">퇴실</td>';
        } else {
            html += '<td style="text-align:center;background:' + (row.isEmpty?'#fef9c3':'#f8fafc') + ';border-right:2px solid #94a3b8;font-size:12.5px;color:#cbd5e1">-</td>';
        }

        var rowBill = 0;

        if(row.isEmpty){
            months.forEach(function(_, idx){
                for(var k=0;k<10;k++){
                    html += '<td class="de-disabled' + (idx>0&&k===0?' de-monthSep':'') + '"></td>';
                }
            });
            html += '<td class="de-disabled" style="border-left:3px solid #94a3b8"></td>';
            html += '<td class="de-disabled"></td>';
            html += '<td class="de-disabled"></td>';
            html += '</tr>';
            return;
        }

        var rowPaid = 0;
        months.forEach(function(m, idx){
            var sep = idx > 0 ? ' de-monthSep' : '';
            var d = row.data[m] || {};
            var prev = d.prevReading;
            var curr = d.currReading;
            var usage = d.usage;
            var baseAmt = d.baseAmount;
            var arrear = d.arrearAmount;
            var bill = d.bill;
            var note = d.note || '';
            var billN = (bill != null && bill !== '') ? Number(bill) : 0;
            rowBill += billN;
            // 입금 — 다른 화면과 같은 룰 (elecPaidOf)
            var paidN = elecPaidOf(d);
            rowPaid += paidN;

            var fNum = function(v){ return v == null || v === '' ? '' : Number(v).toLocaleString(); };
            var fMeter = function(v){ return v == null || v === '' ? '' : Number(v).toLocaleString(); };

            html += '<td class="' + sep.replace(/^\s+/,'') + '" style="font-size:12px;text-align:right;padding:3px 4px;color:#475569">' + fMeter(prev) + '</td>';
            html += '<td style="font-size:12px;text-align:right;padding:3px 4px;color:#475569">' + fMeter(curr) + '</td>';
            html += '<td style="font-size:12.5px;text-align:right;padding:3px 4px;color:' + (usage?'#1e293b':'#cbd5e1') + ';font-weight:' + (usage?'700':'400') + ';background:#f8fafc">' + fNum(usage) + '</td>';
            html += '<td style="font-size:12px;text-align:right;padding:3px 4px;color:#475569">' + fNum(baseAmt) + '</td>';
            html += '<td style="font-size:13px;text-align:right;padding:3px 5px;color:' + (billN>0?'#0f172a':'#cbd5e1') + ';font-weight:' + (billN>0?'800':'400') + ';background:#e2e8f0">' + fNum(bill) + '</td>';
            html += '<td style="font-size:12.5px;text-align:right;padding:3px 5px;color:' + (paidN>0?'#1e3a8a':'#cbd5e1') + ';font-weight:' + (paidN>0?'700':'400') + ';background:#eff6ff">' + (paidN>0?paidN.toLocaleString():'-') + '</td>';
            // 받은 자료 (엑셀 원본 ELEC_PATCH)에서 방번호/입실자 추출
            var rawSrc = (window._ELEC_PATCH_RAW && window._ELEC_PATCH_RAW[row.room] && window._ELEC_PATCH_RAW[row.room][m]) || {};
            var rawRoom = rawSrc.bill != null ? row.room : '';
            var rawName = rawSrc.name || '';
            html += '<td style="font-size:12px;text-align:center;padding:3px 4px;color:' + (rawRoom?'#1e3a8a':'#cbd5e1') + ';background:#eff6ff;font-weight:' + (rawRoom?'700':'400') + '">' + (rawRoom||'-') + '</td>';
            html += '<td style="font-size:12px;text-align:center;padding:3px 4px;color:' + (rawName?'#1e3a8a':'#cbd5e1') + ';background:#eff6ff;font-weight:' + (rawName?'700':'400') + '">' + (rawName||'-') + '</td>';
            html += '<td style="font-size:12px;text-align:right;padding:3px 4px;color:' + (arrear?'#991b1b':'#cbd5e1') + '">' + fNum(arrear) + '</td>';
            html += '<td style="font-size:12px;text-align:left;padding:3px 5px;color:#64748b">' + note + '</td>';
        });

        html += '<td style="font-size:13px;text-align:right;padding:3px 8px;font-weight:800;background:#e2e8f0;border-left:3px solid #94a3b8">' + (rowBill>0?rowBill.toLocaleString():'-') + '</td>';
        html += '<td style="font-size:13px;text-align:right;padding:3px 8px;font-weight:800;color:#1e3a8a;background:#dbeafe">' + (rowPaid>0?rowPaid.toLocaleString():'-') + '</td>';
        var rowDue = rowBill - rowPaid;
        html += '<td style="font-size:13px;text-align:right;padding:3px 8px;font-weight:800;color:' + (rowDue>0?'#7c2d12':(rowDue<0?'#92400e':'#0f172a')) + ';background:' + (rowDue>0?'#fee2e2':(rowDue<0?'#fef3c7':'#dcfce7')) + '">' + (rowBill===0&&rowPaid===0?'-':(rowDue===0?'0':(rowDue>0?rowDue.toLocaleString():'+'+(-rowDue).toLocaleString()))) + '</td>';
        html += '</tr>';

        // === 시스템 vs 엑셀 부과서 차이 비교 (같은 입주자 기준) ===
        if(!row.isEmpty){
            var rawPatch = (window._ELEC_PATCH_RAW && window._ELEC_PATCH_RAW[row.room]) || {};
            var diffMonths = {};
            months.forEach(function(m){
                var sys = row.data[m] || {};
                var raw = rawPatch[m] || {};
                if(raw.name && sys.name && raw.name !== sys.name) return;
                if(raw.bill == null || sys.bill == null) return;
                var sysB = Number(sys.bill);
                var rawB = Number(raw.bill);
                if(!isNaN(sysB) && !isNaN(rawB) && sysB !== rawB){
                    diffMonths[m] = {sys: sysB, raw: rawB};
                }
            });
            var diffKeys = Object.keys(diffMonths);
            if(diffKeys.length > 0){
                html += '<tr style="background:#fef3c7;border-top:2px solid #f59e0b">';
                html += '<td class="de-stickyL" style="text-align:center;background:#fef3c7 !important;font-weight:800;font-size:14px;color:#92400e;width:62px !important;min-width:62px !important;max-width:75px !important">' + row.room + '</td>';
                html += '<td style="text-align:left;padding-left:8px;font-size:13px;color:#92400e;font-weight:700;background:#fef3c7">' + (row.name||'-') + ' <span style="font-size:10px;color:#64748b">(전기상세)</span></td>';
                html += '<td style="text-align:center;background:#dc2626;color:#fff;font-weight:800;font-size:13px;padding:3px 6px;border-right:2px solid #94a3b8">상이함</td>';
                months.forEach(function(m, idx){
                    var sep = idx > 0 ? ' de-monthSep' : '';
                    if(diffMonths[m]){
                        var d = diffMonths[m];
                        // 4개 비활성: 검침x2 / 사용량 / 산출
                        for(var k=0; k<4; k++){
                            html += '<td class="de-disabled' + (k===0?sep:'') + '" style="background:#fef3c7"></td>';
                        }
                        // 부과요금 (강조)
                        html += '<td style="background:#fee2e2;color:#dc2626;font-size:13px;font-weight:800;text-align:right;padding:3px 6px;line-height:1.3">' + d.sys.toLocaleString() + '<br><span style="font-size:10px;font-weight:600;color:#991b1b">엑셀 ' + d.raw.toLocaleString() + '</span></td>';
                        // 입금 (비활성)
                        html += '<td class="de-disabled" style="background:#fef3c7"></td>';
                        // 받은 방번호 / 받은 입실자 (비활성)
                        html += '<td class="de-disabled" style="background:#fef3c7"></td>';
                        html += '<td class="de-disabled" style="background:#fef3c7"></td>';
                        // 미납요금 (비활성)
                        html += '<td class="de-disabled" style="background:#fef3c7"></td>';
                        // 비고: 차이 메시지
                        var diff = d.sys - d.raw;
                        var diffSign = diff > 0 ? '+' : '';
                        html += '<td style="background:#fef3c7;color:#92400e;font-size:11px;text-align:left;padding:3px 6px;font-weight:700">차이 ' + diffSign + diff.toLocaleString() + '</td>';
                    } else {
                        for(var k=0; k<10; k++){
                            html += '<td class="de-disabled' + (k===0?sep:'') + '" style="background:#fef3c7"></td>';
                        }
                    }
                });
                html += '<td style="background:#fef3c7"></td>';
                html += '<td style="background:#fef3c7"></td>';
                html += '<td style="background:#fef3c7"></td>';
                html += '</tr>';
            }
        }
    });

    // === 월별 합계 행 (전기요금조회·입력관리2와 동일 룰) ===
    var _totalBill = 0, _totalPaid = 0;
    var _monthTot = {};
    months.forEach(function(m){ _monthTot[m] = {bill:0, paid:0}; });
    rows.forEach(function(row){
        if(row.isEmpty) return;
        months.forEach(function(m){
            var d = row.data[m] || {};
            var b = (d.bill != null && d.bill !== '') ? Number(d.bill) : 0;
            if(isNaN(b)) b = 0;
            var p = elecPaidOf(d);
            _monthTot[m].bill += b;
            _monthTot[m].paid += p;
            _totalBill += b;
            _totalPaid += p;

function _deDateVal(v){
    // "2026.04.23" → "2026-04-23"  /  "2026-04-23" pass / null/undefined → ""
    if(!v || typeof v !== 'string') return '';
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
    const parts = v.replace(/\./g,'-').split('-');
    if(parts.length >= 3) return `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
    return '';
}
function _deDateOut(v){
    // input type=date returns "YYYY-MM-DD" → convert to "YYYY.MM.DD" for data consistency
    if(!v) return null;
    return v.replace(/-/g,'.');
}

        <div class="de-replaceCard in">
            <div class="hd">🎉 신규 입주 (새 입주자)</div>

                <label>이름</label>

    if(replacements.length){
        html += `<div class="de-history"><h4>📜 이 방의 입주자 교체 이력 (${replacements.length}건)</h4>
        <table><thead><tr><th>#</th><th>퇴실일</th><th>퇴실자</th><th>신규 입주자</th><th>신규 계약시작</th><th>공실</th><th>정산</th><th>처리일시</th><th>작업</th></tr></thead><tbody>`;
        replacements.forEach((rp, idx) => {
            const gap = deCalcVacancyDays(rp.moveOutDate, rp.newTenant && rp.newTenant.contractStart);

        });

    html += '<div class="de-status" id="deStatus" style="margin-top:12px"></div>';

        · <b>퇴실만</b>: 신규 입주자 이름을 비워두면 방이 공실 상태로 전환됩니다.<br>
        · <b>신규 입주만</b>: 현재 공실인 방은 퇴실 입력 없이 신규 입주자만 등록하세요.<br>
        · 교체 후에도 퇴실자의 과거 입금/전기 내역은 보존되며 <b>퇴실자관리</b> 메뉴에서 확인할 수 있습니다.<br>
        · 실수로 적용한 교체는 이력 테이블의 <b>↺ 취소</b> 버튼으로 되돌릴 수 있습니다 (페이지 새로고침 필요).
    </div>`;

    // 공실 계산 후속 실행
    setTimeout(deRecalcVacancy, 0);
    return html;
}

function deCalcVacancyDays(moveOut, newStart){
    if(!moveOut || !newStart) return null;
    const norm = s => String(s).replace(/\./g,'-').slice(0,10);
    const a = new Date(norm(moveOut));
    const b = new Date(norm(newStart));
    if(isNaN(a) || isNaN(b)) return null;
    const diff = Math.round((b - a) / 86400000) - 1;
    return diff < 0 ? 0 : diff;
}

function deRecalcVacancy(){
    const out = document.getElementById('deReplOutDate');
    const start = document.getElementById('deReplNewStart');
    const box = document.getElementById('deVacancyBox');
    if(!box) return;
    const outVal = out ? out.value : '';
    const startVal = start ? start.value : '';
    if(!outVal && startVal){
        box.className = 'de-vacancyBox none';
        box.innerHTML = '신규 입주만 등록합니다 · 퇴실 공백 없음';
        return;
    }
    if(outVal && !startVal){
        box.className = 'de-vacancyBox';
        box.innerHTML = '퇴실만 처리 — 이후 공실 상태로 유지됩니다 (신규 입주자 정보 미입력)';
        return;
    }
    if(!outVal && !startVal){
        box.className = 'de-vacancyBox';
        box.innerHTML = '공실 기간을 계산하려면 퇴실일과 계약시작일을 입력하세요.';
        return;
    }
    const days = deCalcVacancyDays(outVal, startVal);
    if(days === null){
        box.className = 'de-vacancyBox';
        box.innerHTML = '날짜를 확인할 수 없습니다.';
    } else if(days === 0){
        box.className = 'de-vacancyBox none';
        box.innerHTML = '✓ 공실 기간 없음 — 즉시 교체';
    } else {
        const months = (days/30).toFixed(1);
        box.className = 'de-vacancyBox';
        box.innerHTML = `공실 기간 <span class="vday">${days}</span>일 (약 ${months}개월) — 이 기간은 별도 입력 없이 자동 공실 처리됩니다`;
    }
}

function deApplyReplacement(){
    const roomKey = window._deCurrentRoom;
    const r = ROOMS.find(x => x.room === roomKey);
    if(!r){ deShowStatus('방을 찾을 수 없습니다', 'err'); return; }
    const curT = r.tenants.find(tt => !tt.isPast);

    const outDate = (document.getElementById('deReplOutDate')||{}).value || '';
    const settle = (document.getElementById('deReplSettle')||{}).value || '';
    const refundV = (document.getElementById('deReplRefund')||{}).value;
    const outNote = (document.getElementById('deReplOutNote')||{}).value || '';

    const newName = ((document.getElementById('deReplNewName')||{}).value || '').trim();
    const newGender = (document.getElementById('deReplNewGender')||{}).value || '';
    const newPhone = ((document.getElementById('deReplNewPhone')||{}).value || '').trim();
    const newEmergency = ((document.getElementById('deReplNewEmergency')||{}).value || '').trim();
    const newStart = (document.getElementById('deReplNewStart')||{}).value || '';
    const newEnd = (document.getElementById('deReplNewEnd')||{}).value || '';
    const newDeposit = (document.getElementById('deReplNewDeposit')||{}).value;
    const newRent = (document.getElementById('deReplNewRent')||{}).value;
    const newMgmt = (document.getElementById('deReplNewMgmt')||{}).value;
    const newPark = (document.getElementById('deReplNewPark')||{}).value;
    const newNote = ((document.getElementById('deReplNewNote')||{}).value || '').trim();

    // 유효성
    if(!outDate && !newName){
        deShowStatus('퇴실일 또는 신규 입주자 이름 중 최소 하나는 입력하세요', 'err'); return;
    }
    if(outDate && !curT){
        deShowStatus('현재 공실이라 퇴실 처리할 대상이 없습니다. 퇴실일을 비우고 신규 입주자만 등록하세요', 'err'); return;
    }
    if(newName && !newStart){
        deShowStatus('신규 입주자의 계약시작일을 입력하세요', 'err'); return;
    }
    if(newName && !newRent){
        if(!confirm('월세가 비어있습니다. 0원으로 진행할까요?')) return;
    }

    const normDate = s => s ? s.replace(/-/g,'.') : '';
    const rec = {
        moveOutDate: normDate(outDate),
        outTenantName: curT ? curT.tenant : '',
        settlementStatus: settle,
        refundAmount: refundV === '' ? null : Number(refundV),
        outNote: outNote,
        newTenant: null,
        timestamp: (new Date()).toISOString().replace('T',' ').slice(0,19)
    };
    if(newName){
        const rentN = newRent === '' ? 0 : Number(newRent);
        const mgmtN = newMgmt === '' ? 0 : Number(newMgmt);
        const parkN = newPark === '' ? 0 : Number(newPark);
        rec.newTenant = {
            tenant: newName,
            gender: newGender,
            phone: newPhone,
            emergency: newEmergency,
            contractStart: normDate(newStart),
            contractEnd: normDate(newEnd),
            deposit: newDeposit === '' ? 0 : Number(newDeposit),
            rent: rentN,
            mgmtNum: mgmtN,
            mgmt: mgmtN > 0 ? String(mgmtN) : 'N/A',
            parkingNum: parkN,
            parking: parkN > 0 ? String(parkN) : '-',
            monthlyTotal: rentN + mgmtN + parkN,
            baseNote: newNote,
            payments: {},
            isPast: false
        };
    }

    // 저장
    const ov = deLoadOverrides();
    if(!ov[roomKey]) ov[roomKey] = {payments:{}, elec:{}};
    if(!ov[roomKey]._tenantReplacements) ov[roomKey]._tenantReplacements = [];
    ov[roomKey]._tenantReplacements.push(rec);
    deSaveOverrides(ov);

    // 즉시 ROOMS에 반영 (idempotent한 _tenantReplacements 처리 덕분에 reload 불필요)
    deApplyOverridesToRooms();
    render(); // 메인 현황판 갱신
    const msg = rec.newTenant
        ? `✓ ${roomKey} 교체 완료 — ${rec.outTenantName||'(공실)'} → ${rec.newTenant.tenant} · 퇴실자관리에 자동 삽입됨`
        : `✓ ${roomKey} 퇴실 처리 완료 — ${rec.outTenantName||'-'} 퇴실자관리에 자동 삽입됨`;
    deShowStatus(msg);
    // 현재 방 상태(공실 여부 등) 갱신을 위해 동일 방 유지하고 탭 재렌더
    renderDataEntry();
}

function deUndoReplacement(idx){
    const roomKey = window._deCurrentRoom;
    if(!confirm(`${roomKey}의 ${idx+1}번째 입주자 교체 기록을 취소하시겠습니까? 원본 상태 복원을 위해 페이지가 새로고침됩니다.`)) return;
    const ov = deLoadOverrides();
    if(ov[roomKey] && ov[roomKey]._tenantReplacements){
        ov[roomKey]._tenantReplacements.splice(idx, 1);
        if(ov[roomKey]._tenantReplacements.length === 0) delete ov[roomKey]._tenantReplacements;
        deSaveOverrides(ov);
    }
    // 취소는 ROOMS에서 직접 되돌리기 어려우므로 reload
    setTimeout(()=>location.reload(), 500);
}

function deChangeRoom(roomKey){
    window._deCurrentRoom = roomKey;
    renderDataEntry();
}

// === 그리드 뷰용: 다중 호실 dirty 추적 + 일괄 저장 ===
function deSetFieldGrid(roomKey, section, month, field, value, inputEl){
    if(!window._deDirty[roomKey]) window._deDirty[roomKey] = {payments:{}, elec:{}};
    if(!window._deDirty[roomKey][section][month]) window._deDirty[roomKey][section][month] = {};
    window._deDirty[roomKey][section][month][field] = value;
    if(inputEl) inputEl.classList.add('dirty');
    deUpdateGridSaveBtn();
}
function deDirtyTotalCount(){
    let n = 0;
    Object.values(window._deDirty || {}).forEach(roomDirty => {
        Object.values(roomDirty || {}).forEach(sec => {
            Object.values(sec || {}).forEach(f => { n += Object.keys(f).length; });
        });
    });
    return n;
}
function deUpdateGridSaveBtn(){
    const btn = document.querySelector('.dataEntryPanel .de-saveAll');
    if(btn) btn.innerHTML = `💾 전체 저장 (${deDirtyTotalCount()}건)`;
    const btn2 = document.querySelector('.dataEntryPanel .de-save');
    if(btn2){
        const cur = window._deCurrentRoom;
        let n = 0;
        Object.values(window._deDirty[cur] || {}).forEach(sec => {
            Object.values(sec).forEach(f => { n += Object.keys(f).length; });
        });
        btn2.innerHTML = `💾 저장 (${n}건)`;
    }
}
function deSaveAll(){
    const totalDirty = deDirtyTotalCount();
    if(totalDirty === 0){ deShowStatus('변경된 내용이 없습니다', 'err'); return; }
    const ov = deLoadOverrides();
    let savedRooms = [];
    Object.entries(window._deDirty).forEach(([roomKey, dirty]) => {
        if(!dirty) return;
        const hasChanges = (dirty.payments && Object.keys(dirty.payments).length) || (dirty.elec && Object.keys(dirty.elec).length);
        if(!hasChanges) return;
        if(!ov[roomKey]) ov[roomKey] = {payments:{}, elec:{}};
        Object.entries(dirty.payments || {}).forEach(([m, fields]) => {
            if(!ov[roomKey].payments[m]) ov[roomKey].payments[m] = {};
            Object.assign(ov[roomKey].payments[m], fields);
        });
        Object.entries(dirty.elec || {}).forEach(([m, fields]) => {
            if(!ov[roomKey].elec[m]) ov[roomKey].elec[m] = {};
            Object.assign(ov[roomKey].elec[m], fields);
        });
        savedRooms.push(roomKey);
        window._deDirty[roomKey] = {payments:{}, elec:{}};
    });
    deSaveOverrides(ov);
    deApplyOverridesToRooms();
    deShowStatus(`✓ ${savedRooms.length}개 호실 저장 완료 (${totalDirty}건) — 메인 화면 반영됨`);
    renderDataEntry();
    render();
}

// === 고정비 입력 그리드 (세로=호실, 가로=월×3필드, 월별 역순) ===
function renderRentInputGrid(){
    const months = [...RENT_MONTHS].reverse(); // 최근 월이 좌측
    const ov = deLoadOverrides();
    let html = '<div class="de-rentGridWrap"><table class="de-rentGrid"><thead>';
    // 1행: 호실 / 입주자 + 월별 그룹 헤더
    html += '<tr><th class="de-stickyHead" rowspan="2">호실</th><th class="de-stickyHead2" rowspan="2">입주자</th>';
    months.forEach(m => {
        html += `<th class="de-monthHead" colspan="3">${m}</th>`;
    });
    html += '</tr>';
    // 2행: 월세 / 관리 / 주차 sub 헤더
    html += '<tr>';
    months.forEach((m, idx) => {
        html += `<th class="de-fieldHead">월세</th><th class="de-fieldHead">관리</th><th class="de-fieldHead">주차</th>`;
    });
    html += '</tr></thead><tbody>';

    // 셀 렌더 헬퍼: 데이터 있으면 input, 없으면 빈 버튼 (클릭 시 input으로 전환)
    function _renderCell(roomKey, m, field, val, available, monthSep){
        const sep = monthSep ? ' de-monthSep' : '';
        if(!available){
            return `<td class="de-disabled${sep}"></td>`;
        }
        // 텍스트 입력 (날짜·금액·메모 자유 입력)
        return `<td class="${sep.trim()}"><input type="text" value="${val||''}" placeholder="YYYY.MM.DD" oninput="deSetFieldGrid('${roomKey}','payments','${m}','${field}', this.value.trim()||null, this)" style="width:100%;font-size:10.5px;text-align:center;padding:2px 3px;border:1px solid #cbd5e1;border-radius:3px;background:#fff;color:#1e293b;font-weight:600"></td>`;
    }

    ROOMS.forEach(r => {
        // 입주자 목록: 현재 + 퇴실자 (시간순, 가장 최근이 위)
        const allTenants = (r.tenants || []).slice().sort((a,b) => {
            const aS = a.contractStart || '';
            const bS = b.contractStart || '';
            return bS.localeCompare(aS);
        });
        if(allTenants.length === 0){
            // 입주자 없음 → 단일 빈 행
            html += `<tr class="de-vacant"><td class="de-stickyL">${r.room}</td><td class="de-stickyL2">(이력 없음)</td>`;
            months.forEach(() => {
                html += `<td class="de-disabled de-monthSep"></td><td class="de-disabled"></td><td class="de-disabled"></td>`;
            });
            html += '</tr>';
            return;
        }
        allTenants.forEach((t, tidx) => {
            const isPast = !!t.isPast;
            const hasMgmt = (Number(t.mgmtNum)||0) > 0;
            const hasPark = (Number(t.parkingNum)||0) > 0;
            const csKey = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
            const endSrc = t.moveOutDate || t.contractEnd || '';
            const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
            // 입주자 라벨 (현재 vs 퇴실)
            const pastBadge = isPast 
                ? ` <span style="background:#cbd5e1;color:#1e293b;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:3px;border:1px solid #94a3b8">퇴실 ${t.moveOutDate||t.contractEnd||'-'}</span>`
                : '';
            const tenantLabel = `${t.tenant||'(이름없음)'}${pastBadge}`;
            const rowCls = isPast ? ' style="background:#f8fafc"' : '';
            const stickyBg = isPast ? 'background:#f1f5f9' : 'background:#f8fafc';
            html += `<tr${rowCls}>
                <td class="de-stickyL" style="${stickyBg}">${r.room}</td>
                <td class="de-stickyL2" style="${stickyBg}">${tenantLabel}</td>`;
            months.forEach((m, idx) => {
                const isFirstMonthCol = idx > 0;
                // 점유 기간 밖이면 비활성
                const beforeContract = csKey && m < csKey;
                const afterEnd = ceKey && m > ceKey;
                if(beforeContract || afterEnd){
                    html += `<td class="de-disabled${idx>0?' de-monthSep':''}"></td><td class="de-disabled"></td><td class="de-disabled"></td>`;
                    return;
                }
                // 퇴실자: 부과서 이름 매칭이 있는 경우만 입력 허용 (없으면 비활성)
                // (현재 입주자는 항상 활성)
                // 단, payments는 입주자별 t.payments에 직접 저장됨
                const ovP = (ov[r.room] && ov[r.room].payments && ov[r.room].payments[m]) || {};
                const dirtyP = (window._deDirty[r.room] && window._deDirty[r.room].payments && window._deDirty[r.room].payments[m]) || {};
                const p = (t.payments && t.payments[m]) || {};
                const rentRaw = (dirtyP.rentPaid !== undefined) ? dirtyP.rentPaid : ((ovP.rentPaid !== undefined && !isPast) ? ovP.rentPaid : p.rentPaid);
                const mgmtRaw = (dirtyP.mgmtPaid !== undefined) ? dirtyP.mgmtPaid : ((ovP.mgmtPaid !== undefined && !isPast) ? ovP.mgmtPaid : p.mgmtPaid);
                const parkRaw = (dirtyP.parkingPaid !== undefined) ? dirtyP.parkingPaid : ((ovP.parkingPaid !== undefined && !isPast) ? ovP.parkingPaid : p.parkingPaid);
                const rentVal = _deDateVal(rentRaw);
                const mgmtVal = (mgmtRaw === 'N/A') ? '' : _deDateVal(mgmtRaw);
                const parkVal = _deDateVal(parkRaw);
                // 퇴실자 행: read-only 표시 (값만 보여주고 편집 불가)
                if(isPast){
                    const cellPast = (val) => `<td class="de-disabled${isFirstMonthCol?' de-monthSep':''}" style="font-size:10px;color:#475569;text-align:center;background:#f1f5f9">${val||'-'}</td>`;
                    html += cellPast(rentVal) + cellPast(mgmtVal) + cellPast(parkVal);
                } else {
                    html += _renderCell(r.room, m, 'rentPaid', rentVal, true, isFirstMonthCol);
                    html += _renderCell(r.room, m, 'mgmtPaid', mgmtVal, hasMgmt, false);
                    html += _renderCell(r.room, m, 'parkingPaid', parkVal, hasPark, false);
                }
            });
            html += '</tr>';
        });
    });
    html += '</tbody></table></div>';
    html += `<div style="font-size:11px;color:#64748b;margin-top:6px;line-height:1.5">
        ※ 좌측이 최근 월. 계약 시작 이전 / 관리비·주차비 미부과 / 공실 칸은 비활성. 변경 시 노란색으로 표시되며 [💾 전체 저장]으로 모든 호실 일괄 저장.<br>
        ※ <b>퇴실자 행</b> (회색 배경 · "퇴실 YYYY.MM.DD" 배지)은 <b>읽기 전용</b>입니다. 수정이 필요하면 [입력] → [입주자 교체] 탭에서 진행하세요.
    </div>`;
    return html;
}

// === 전기세 입력 그리드 (전기상세와 동일 형식: 호실×월×3필드, 입주자별 행 분리) ===
function renderElecInputGrid(){
    const months = [...ELEC_MONTHS].reverse();
    const ov = deLoadOverrides();
    let html = '<div class="de-rentGridWrap"><table class="de-rentGrid"><thead>';
    html += '<tr><th class="de-stickyHead" rowspan="2">호실</th><th class="de-stickyHead2" rowspan="2">입주자</th>';
    months.forEach(m => {
        html += `<th class="de-monthHead" colspan="3">${m}</th>`;
    });
    html += '</tr><tr>';
    months.forEach(() => {
        html += `<th class="de-fieldHead">부과</th><th class="de-fieldHead">입금</th><th class="de-fieldHead">일자</th>`;
    });
    html += '</tr></thead><tbody>';

    ROOMS.forEach(r => {
        const allTenants = (r.tenants || []).slice().sort((a,b) => {
            const aS = a.contractStart || '';
            const bS = b.contractStart || '';
            return bS.localeCompare(aS);
        });
        if(allTenants.length === 0){
            html += `<tr class="de-vacant"><td class="de-stickyL">${r.room}</td><td class="de-stickyL2">(이력 없음)</td>`;
            months.forEach((_,idx) => {
                html += `<td class="de-disabled${idx>0?' de-monthSep':''}"></td><td class="de-disabled"></td><td class="de-disabled"></td>`;
            });
            // 합계 셀 3개 (빈)
            html += `<td class="de-disabled" style="border-left:3px solid #94a3b8"></td><td class="de-disabled"></td><td class="de-disabled"></td>`;
            html += '</tr>';
            return;
        }
        allTenants.forEach(t => {
            const isPast = !!t.isPast;
            const csKey = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
            const endSrc = t.moveOutDate || t.contractEnd || '';
            const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
            const pastBadge = isPast
                ? ` <span style="background:#cbd5e1;color:#1e293b;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:3px;border:1px solid #94a3b8">퇴실 ${t.moveOutDate||t.contractEnd||'-'}</span>`
                : '';
            const tenantLabel = `${t.tenant||'-'}${pastBadge}`;
            const rowCls = isPast ? ' style="background:#f8fafc"' : '';
            const stickyBg = isPast ? 'background:#f1f5f9' : 'background:#f8fafc';
            // 행별 합계 누적 변수
            let _rowBillSum = 0, _rowPaidSum = 0;
            html += `<tr${rowCls}>
                <td class="de-stickyL" style="${stickyBg}">${r.room}</td>
                <td class="de-stickyL2" style="${stickyBg}">${tenantLabel}</td>`;
            months.forEach((m, idx) => {
                const sep = idx > 0 ? ' de-monthSep' : '';
                const beforeContract = csKey && m < csKey;
                const afterEnd = ceKey && m > ceKey;
                if(beforeContract || afterEnd){
                    html += `<td class="de-disabled${sep}"></td><td class="de-disabled"></td><td class="de-disabled"></td>`;
                    return;
                }
                const e = (r.elec && r.elec[m]) || {};
                // 부과서 이름이 다른 입주자면 비활성 (이전 입주자 데이터)
                if(_resolveBillTenant(r, m, e) !== t && e.name !== '공실'){
                    html += `<td class="de-disabled${sep}"></td><td class="de-disabled"></td><td class="de-disabled"></td>`;
                    return;
                }
                // 퇴실자 행 → 읽기 전용
                if(isPast){
                    const cellPast = (val) => `<td class="de-disabled${sep}" style="font-size:10px;color:#475569;text-align:center;background:#f1f5f9">${val||'-'}</td>`;
                    const billN = (e.bill !== null && e.bill !== undefined && e.bill !== '') ? Number(e.bill) : 0;
                    const paidN = (e.paidAmount !== null && e.paidAmount !== undefined && e.paidAmount !== '')
                        ? Number(e.paidAmount)
                        : (e.received && e.bill ? Number(e.bill) : 0);
                    _rowBillSum += billN;
                    _rowPaidSum += paidN;
                    const billDisp = billN > 0 ? fmt(billN) : '';
                    const paidDisp = paidN > 0 ? fmt(paidN) : '';
                    const dateDisp = e.received ? e.received.slice(5) : '';
                    html += cellPast(billDisp) + cellPast(paidDisp) + cellPast(dateDisp);
                    return;
                }
                // 현재 입주자: 편집 가능
                const ovE = (ov[r.room] && ov[r.room].elec && ov[r.room].elec[m]) || {};
                const dirtyE = (window._deDirty[r.room] && window._deDirty[r.room].elec && window._deDirty[r.room].elec[m]) || {};
                const billRaw = (dirtyE.bill !== undefined) ? dirtyE.bill : ((ovE.bill !== undefined) ? ovE.bill : e.bill);
                const paidRaw = (dirtyE.paidAmount !== undefined) ? dirtyE.paidAmount : ((ovE.paidAmount !== undefined) ? ovE.paidAmount : e.paidAmount);
                const dateRaw = (dirtyE.received !== undefined) ? dirtyE.received : ((ovE.received !== undefined) ? ovE.received : e.received);
                const billVal = (billRaw === null || billRaw === undefined) ? '' : billRaw;
                const paidVal = (paidRaw === null || paidRaw === undefined) ? '' : paidRaw;
                const dateVal = _deDateVal(dateRaw);
                _rowBillSum += Number(billVal) || 0;
                _rowPaidSum += Number(paidVal) || 0;
                // 입력 셀
                html += `<td class="${sep.trim()}"><input type="number" value="${billVal}" placeholder="" oninput="deSetFieldGrid('${r.room}','elec','${m}','bill', this.value===''?null:Number(this.value), this); deSetFieldGrid('${r.room}','elec','${m}','name', '${(t.tenant||'').replace(/'/g, "\\'")}', null)" style="width:100%;font-size:10px;text-align:right;padding:2px 3px;border:1px solid #94a3b8;border-radius:3px;color:#1e293b;font-weight:600"></td>`;
                html += `<td><input type="number" value="${paidVal}" placeholder="" oninput="deSetFieldGrid('${r.room}','elec','${m}','paidAmount', this.value===''?null:Number(this.value), this)" style="width:100%;font-size:10px;text-align:right;padding:2px 3px;border:1px solid #94a3b8;border-radius:3px;color:#1e293b;font-weight:600"></td>`;
                html += `<td><input type="text" value="${dateVal||''}" placeholder="YYYY.MM.DD" oninput="deSetFieldGrid('${r.room}','elec','${m}','received', this.value.trim()||null, this)" style="width:100%;font-size:10.5px;text-align:center;padding:2px 3px;border:1px solid #cbd5e1;border-radius:3px;background:#fff;color:#1e293b;font-weight:600"></td>`;
            });
            // 행별 합계 셀 (부과/입금/차액)
            const _rowDiff = _rowBillSum - _rowPaidSum;
            const _diffColor = _rowDiff > 0 ? '#991b1b' : (_rowDiff < 0 ? '#475569' : '#1e293b');
            const _diffBg = isPast ? 'background:#f1f5f9;color:#475569' : 'background:#f8fafc;color:#1e293b';
            html += `<td class="num" style="border-left:3px solid #94a3b8;${_diffBg};font-weight:900;text-align:right;padding:2px 6px">${_rowBillSum>0?fmt(_rowBillSum):'-'}</td>`;
            html += `<td class="num" style="${_diffBg};font-weight:900;text-align:right;padding:2px 6px">${_rowPaidSum>0?fmt(_rowPaidSum):'-'}</td>`;
            html += `<td class="num" style="${_diffBg};font-weight:900;color:${_diffColor};text-align:right;padding:2px 6px">${(_rowBillSum===0&&_rowPaidSum===0)?'-':(_rowDiff===0?'0':(_rowDiff>0?fmt(_rowDiff):'+'+fmt(-_rowDiff)))}</td>`;
            html += '</tr>';
        });
    });
    html += '</tbody></table></div>';
    html += `<div style="font-size:11px;color:#64748b;margin-top:6px;line-height:1.5">
        ※ 좌측이 최근 월. 각 월에 <b>부과 / 입금 / 일자</b> 3개 필드. 우측 끝에 <b>합계 (부과·입금·차액)</b> 자동 계산.<br>
        ※ 차액 = 부과 − 입금 (양수 = 미수, 음수 = 과납). 계약기간 밖 / 퇴실자 / 다른 입주자 부과서는 비활성/읽기 전용.<br>
        ※ 부과금 입력 시 <b>현재 입주자 이름이 자동으로 부과서에 기록</b>됩니다.
    </div>`;
    return html;
}

function deSetField(section, month, field, value, inputEl){
    const roomKey = window._deCurrentRoom;
    if(!window._deDirty[roomKey]) window._deDirty[roomKey] = {payments:{}, elec:{}};
    if(!window._deDirty[roomKey][section][month]) window._deDirty[roomKey][section][month] = {};
    window._deDirty[roomKey][section][month][field] = value;
    if(inputEl) inputEl.classList.add('dirty');
    // Update save button count
    const saveBtn = document.querySelector('.dataEntryPanel .de-save');
    if(saveBtn){
        let n = 0;
        Object.values(window._deDirty[roomKey] || {}).forEach(sec => {
            Object.values(sec).forEach(f => { n += Object.keys(f).length; });
        });
        saveBtn.innerHTML = `💾 저장 (${n}건)`;
    }
}

function deSaveCurrent(){
    const roomKey = window._deCurrentRoom;
    const dirty = window._deDirty[roomKey];
    if(!dirty || (!Object.keys(dirty.payments).length && !Object.keys(dirty.elec).length)){
        deShowStatus('변경된 내용이 없습니다', 'err'); return;
    }
    const ov = deLoadOverrides();
    if(!ov[roomKey]) ov[roomKey] = {payments:{}, elec:{}};
    // merge
    Object.entries(dirty.payments).forEach(([m, fields]) => {
        if(!ov[roomKey].payments[m]) ov[roomKey].payments[m] = {};
        Object.assign(ov[roomKey].payments[m], fields);
    });
    Object.entries(dirty.elec).forEach(([m, fields]) => {
        if(!ov[roomKey].elec[m]) ov[roomKey].elec[m] = {};
        Object.assign(ov[roomKey].elec[m], fields);
    });
    deSaveOverrides(ov);
    // 즉시 메모리 ROOMS에도 반영
    deApplyOverridesToRooms();
    window._deDirty[roomKey] = {payments:{}, elec:{}};
    deShowStatus(`✓ ${roomKey} 저장 완료 — 메인 화면에 반영되었습니다`);
    renderDataEntry();
    render(); // 메인 화면 갱신
}

function deResetRoom(){
    const roomKey = window._deCurrentRoom;
    if(!confirm(`${roomKey} 방의 모든 변경 내용을 삭제하고 원본으로 되돌리시겠습니까?`)) return;
    const ov = deLoadOverrides();
    delete ov[roomKey];
    deSaveOverrides(ov);
    window._deDirty[roomKey] = {payments:{}, elec:{}};
    // 원본 데이터 회복: 페이지 새로고침이 가장 안전
    deShowStatus(`${roomKey} 초기화 완료 — 원본 복원을 위해 페이지를 다시 로드하세요`, 'err');
    setTimeout(()=>location.reload(), 1500);
}

function deResetAll(){
    if(!confirm('전체 방의 모든 변경 내용을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;
    localStorage.removeItem(DE_STORAGE_KEY);
    window._deDirty = {};
    deShowStatus('전체 초기화 완료 — 페이지를 다시 로드합니다', 'err');
    setTimeout(()=>location.reload(), 1200);
}

const SNAPSHOT_KEY = 'cheonghwa_regent_snapshots_v1';
function loadSnapshots(){
    try { return JSON.parse(localStorage.getItem(SNAPSHOT_KEY) || '{}'); }
    catch(e){ return {}; }
}
function saveSnapshots(obj){
    localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(obj));
}

// "전체 백업" — 이 PC에 이름붙여서 저장 (localStorage)
function deExportJSON(){
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const defaultName = `백업_${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    const name = prompt('이 PC에 저장할 백업 이름을 입력하세요:\n(기존 이름과 같으면 덮어씁니다)', defaultName);
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed){ deShowStatus('이름이 비어있습니다', 'err'); return; }
    const snapshots = loadSnapshots();
    const exists = !!snapshots[trimmed];
    if(exists && !confirm(`"${trimmed}" 백업이 이미 있습니다. 덮어쓰시겠습니까?`)) return;
    const ov = deLoadOverrides();
    let expenses = [];
    try { expenses = (typeof loadExpenses === 'function') ? loadExpenses() : []; } catch(_){}
    snapshots[trimmed] = {
        name: trimmed,
        timestamp: now.toISOString(),
        timestampLocal: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
        ov: ov,
        expenses: expenses,
        ovCount: Object.keys(ov).length,
        expCount: expenses.length
    };
    saveSnapshots(snapshots);
    deShowStatus(`✓ "${trimmed}" 백업 저장 완료 (이 PC 내에 보관)`);
    // 백업 목록 표시
    setTimeout(showSnapshotsModal, 300);
}

// === 작업 히스토리 시스템 ===
const BK_HISTORY_KEY = 'cheonghwa_regent_backup_history_v1';
function loadBkHistory(){
    try { return JSON.parse(localStorage.getItem(BK_HISTORY_KEY) || '[]'); }
    catch(e){ return []; }
}
function saveBkHistory(arr){
    // 최대 100개로 제한
    if(arr.length > 100) arr = arr.slice(-100);
    localStorage.setItem(BK_HISTORY_KEY, JSON.stringify(arr));
}
function logBkHistory(action, status, message){
    var hist = loadBkHistory();
    var now = new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    hist.push({
        action: action,  // 'backup', 'export', 'restore'
        status: status,  // 'success', 'error', 'cancel'
        message: message,
        timestamp: now.toISOString(),
        timestampLocal: now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())
    });
    saveBkHistory(hist);
}
function getBkHistoryHtml(action){
    var hist = loadBkHistory().filter(function(h){ return h.action === action; });
    hist.sort(function(a,b){ return (b.timestamp||'').localeCompare(a.timestamp||''); });
    if(hist.length === 0) return '<div style="font-size:12px;color:#94a3b8;font-style:italic">이력 없음</div>';
    return hist.slice(0, 3).map(function(h){
        var icon = h.status === 'success' ? '✓' : (h.status === 'error' ? '✗' : '○');
        var color = h.status === 'success' ? '#059669' : (h.status === 'error' ? '#991b1b' : '#94a3b8');
        return '<div style="font-size:12px;line-height:1.5;color:#475569"><span style="color:'+color+';font-weight:800;margin-right:6px">'+icon+'</span><span style="color:#94a3b8;font-family:monospace;font-size:10.5px;margin-right:8px">'+h.timestampLocal+'</span>'+h.message+'</div>';
    }).join('');
}

function bkAction(action){
    try {
        if(action === 'backup'){
            var now = new Date();
            var pad = function(n){ return String(n).padStart(2,'0'); };
            var defaultName = '백업_' + now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
            var name = prompt('이 PC에 저장할 백업 이름:', defaultName);
            if(!name){ logBkHistory('backup', 'cancel', '취소됨'); bkSetResult('backup', getBkHistoryHtml('backup')); return; }
            var trimmed = name.trim();
            if(!trimmed){ logBkHistory('backup', 'error', '이름 비어있음'); bkSetResult('backup', getBkHistoryHtml('backup')); return; }
            var snapshots = loadSnapshots();
            if(snapshots[trimmed] && !confirm('"' + trimmed + '" 백업이 있습니다. 덮어쓸까요?')){ logBkHistory('backup', 'cancel', '"'+trimmed+'" 덮어쓰기 취소'); bkSetResult('backup', getBkHistoryHtml('backup')); return; }
            var ov = deLoadOverrides();
