                <span class="roomBadges">${history.length>0 ? `<span class="badge badge-hist">이전 ${history.length}건</span>` : ''}</span>
            </div>
            <div class="vacantBody">
                <div class="vacantPill">🏠 공실</div>
                ${lastName ? `<div class="vacantMeta">최근 퇴실: ${lastName}${lastOut?' · '+lastOut:''}</div>` : '<div class="vacantMeta">입주 이력 없음</div>'}
                <div class="vacantHint">데이터 입력 → 입주자 교체 탭에서<br>신규 입주자 등록 가능</div>
            </div>
        </button>`;
    }
    const rentUnpaid = isRecentlyUnpaid(r);
    const elecUnpaid = isRecentlyElecUnpaid(r);
    const anyUnpaid = rentUnpaid || elecUnpaid;
    const hasParking = t.parkingNum > 0;
    let unpaidLabel = '';
    if(rentUnpaid && elecUnpaid) unpaidLabel = '월세+전기 미납';
    else if(rentUnpaid) unpaidLabel = '월세미납';
    else if(elecUnpaid) unpaidLabel = '전기미납';
    const cls = [
        'roomCard',
        String(r.room)===String(selectedRoom) ? 'selected' : '',
        anyUnpaid ? 'unpaid-highlight' : '',
        (!rentUnpaid && elecUnpaid) ? 'elec-unpaid-only' : '',
        hasParking ? 'has-parking' : '',
        history.length > 0 ? 'has-history' : ''
    ].filter(Boolean).join(' ');

    const genderBadge = t.gender==='여' ? '<span class="badge badge-f">여</span>' :
                        t.gender==='남' ? '<span class="badge badge-m">남</span>' : '';
    const parkBadge = hasParking ? '<span class="badge badge-park">주차</span>' : '';
    const histBadge = history.length > 0 ? `<span class="badge badge-hist">이전 ${history.length}건</span>` : '';

    const dots = RENT_MONTHS.map(m => {
        const st = rentPayStatus(t, m);
        return `<div class="dot ${st.cls==='paid'?'paid':st.cls==='unpaid'?'unpaid':'na'}" title="${monthLabel(m)} ${st.label}"></div>`;
    }).join('');

    const monthlyTotal = t.monthlyTotal || (t.rent + (t.mgmtNum||0) + (t.parkingNum||0));
    const breakdown = [];
    if(t.rent) breakdown.push(`월세 ${fmt(t.rent)}`);
    if(t.mgmtNum) breakdown.push(`관리 ${fmt(t.mgmtNum)}`);
    if(t.parkingNum) breakdown.push(`주차 ${fmt(t.parkingNum)}`);

    // 전기세 막대 (최근 8개월) - 금액 크기에 비례한 막대 높이
    const elecRecent = ELEC_MONTHS.slice(-8);
    const bills = elecRecent.map(m => (r.elec && r.elec[m] && r.elec[m].bill) || 0);
    const maxBill = Math.max(...bills, 1);
    const latestBill = [...bills].reverse().find(b => b > 0) || 0;
    const elecBars = elecRecent.map((m, i) => {
        const e = r.elec && r.elec[m];
        const bill = bills[i];
        if(!bill){
            return `<div class="elecBar na" title="${monthLabel(m)} 데이터없음"></div>`;
        }
        const h = Math.max(15, Math.round((bill / maxBill) * 100));
        const paid = e.received ? 'paid' : 'unpaid';
        const statusText = e.received ? `납부 ${e.received}` : '미납';
        return `<div class="elecBar ${paid}" style="height:${h}%" title="${monthLabel(m)} ${fmt(bill)}원 · ${statusText}"></div>`;
    }).join('');
    const monthAbbrevs = elecRecent.map(m => `<span>${m.split('-')[1].replace(/^0/,'')}</span>`).join('');

    // 미납 총액 박스 HTML (미납 있을 때만)
    const u = unpaidTotals(r);
    const unpaidBoxHtml = (u.total > 0) ? `
        <div class="unpaidTotalBox" title="최근 3개월 고정비 ${u.rentMonths.length}건, 최근 4개월 전기세 ${u.elecMonths.length}건 미납">
            ${u.rent > 0 ? `<div class="unpaidRow"><span>고정비 미납 (${u.rentMonths.length}개월)</span><span class="amt">${fmt(u.rent)}원</span></div>` : ''}
            ${u.elec > 0 ? `<div class="unpaidRow"><span>전기세 미납 (${u.elecMonths.length}개월)</span><span class="amt">${fmt(u.elec)}원</span></div>` : ''}
            <div class="unpaidRow total"><span>미납 합계</span><span class="amt">${fmt(u.total)}원</span></div>
        </div>` : '';

    // 미납 박스를 맨 아래에 표시 (.atBottom 클래스 추가)
    const unpaidBoxHtmlBottom = unpaidBoxHtml ? unpaidBoxHtml.replace('class="unpaidTotalBox"', 'class="unpaidTotalBox atBottom"') : '';
    return `<button class="${cls}" data-unpaid-label="${unpaidLabel}" onclick="selectRoom('${r.room}')">
        <div class="roomNoLine">
            <span class="roomNo">${r.room}</span>
            <span class="tenant" title="${(t.tenant||'-').replace(/"/g,'&quot;')}">${t.tenant||'-'}</span>
            <span class="roomBadges">${genderBadge}${parkBadge}${histBadge}</span>
        </div>
        <div class="amountLine main">
            <span>월 합계</span><span class="amt">${fmt(monthlyTotal)}원</span>
        </div>
        <div class="breakdown">${breakdown.join(' · ') || '-'}</div>
        <div class="amountLine">
            <span>보증금</span><span class="amt">${fmt(t.deposit)}원</span>
        </div>
        <div class="barLabel" style="margin-top:7px"><span>월세 납부</span></div>
        <div class="recentPay">${dots}</div>
        <div class="barSection">
            <div class="barLabel"><span>전기세 (최근)</span><span class="barMax">최근 ${fmt(latestBill)}원</span></div>
            <div class="elecBars">${elecBars}</div>
            <div class="elecMonthLabels">${monthAbbrevs}</div>
        </div>
        ${unpaidBoxHtmlBottom}
    </button>`;
}

function render(){
    const q = (document.getElementById('search').value || '').trim().toLowerCase();
    const filtered = ROOMS.filter(r => {
        if(!q) return true;
        if(String(r.room).toLowerCase().includes(q)) return true;
        return r.tenants.some(t =>
            (t.tenant||'').toLowerCase().includes(q) ||
            (t.phone||'').toLowerCase().includes(q)
        );
    });
    const byFloor = {};
    filtered.forEach(r => {
        if(!byFloor[r.floor]) byFloor[r.floor] = [];
        byFloor[r.floor].push(r);
    });
    // 각 층 카드를 호실 번호 오름차순으로 정렬
    Object.keys(byFloor).forEach(f => {
        byFloor[f].sort((a,b) => String(a.room).localeCompare(String(b.room),undefined,{numeric:true}));
    });
    const floors = Object.keys(byFloor).sort((a,b) => {
        const aN = a==='B' ? -1 : parseInt(a);
        const bN = b==='B' ? -1 : parseInt(b);
        // 7층은 맨 위, 나머지는 오름차순
        if(aN === 7 && bN !== 7) return -1;
        if(bN === 7 && aN !== 7) return 1;
        return aN - bN;
    });
    const html = floors.map(f => {
        const cards = byFloor[f];
        const COLS = 7;
        const isRightAlign = String(f).includes('7');
        let rowInner = '';
        if(isRightAlign){
            // 7층 특수 배치: 709(서경아) 맨 오른쪽 분리, 나머지는 그 왼쪽 그룹
            const idx709 = cards.findIndex(c => String(c.room) === '709');
            let r709 = null;
            let others = cards;
            if(idx709 !== -1){
                r709 = cards[idx709];
                others = cards.filter((_,i) => i !== idx709);
            }
            const otherCount = others.length;
            const gapAndLast = r709 ? 2 : 0;
            const leadPad = Math.max(0, COLS - otherCount - gapAndLast);
            rowInner = '<div class="roomCardPad"></div>'.repeat(leadPad)
                     + others.map(roomCard).join('')
                     + (r709 ? '<div class="roomCardPad"></div>' + roomCard(r709) : '');
        } else {
            rowInner = cards.map(roomCard).join('');
        }
        return `
        <div class="floor">
            <div class="floorLabel">${f}</div>
            <div class="roomRow">${rowInner}</div>
        </div>
    `;}).join('') || '<div style="padding:30px;text-align:center;color:#667085">검색 결과가 없습니다</div>';
    document.getElementById('board').innerHTML = html;

    let totalDeposit=0, totalMonthly=0, activeCount=0, rentUnpaidCount=0, elecUnpaidCount=0, anyUnpaidCount=0;
    let pastDeposit=0, pastMonthly=0, pastCount=0;
    let sumUnpaidRent=0, sumUnpaidElec=0;
    let grandElecBill=0, grandElecPaid=0; // 전기세 (직전 부과월 · 현재 입주자 부과서 기준)
    let pastElecBill=0, pastElecPaid=0;   // 전기세 (직전 부과월 · 퇴실자 부과서)
    // 직전 부과월 자동 결정: 부과금이 1건이라도 있는 가장 최근 월
    let _elecLatestMonth = '';
    {
        const _allMonthsWithBill = new Set();
        ROOMS.forEach(r => {
            if(r.elec){
                Object.entries(r.elec).forEach(([m, e]) => {
                    if(elecBillOf(e) > 0) _allMonthsWithBill.add(m);
                });
            }
        });
        _elecLatestMonth = [..._allMonthsWithBill].sort().pop() || '';
    }
    // 특정 날짜에 입실 중이었는지 판정 (날짜 문자열 YYYY-MM-DD 비교)
    // 룰: contractStart <= 날짜 AND (moveOutDate 없거나 >= 날짜)
    //   contractEnd 는 만료 후 갱신해서 거주중인 케이스(isPast=false) 가 많아서 종료 기준으로 사용 안 함
    //   퇴실자(isPast=true) 인데 moveOutDate 가 없으면 contractEnd 를 fallback 으로 사용
    function _wasActiveOnDate(t, dateStr){
        if(!t || !dateStr) return false;
        const cs = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,10) : null;
        if(cs && dateStr < cs) return false;
        const mo = t.moveOutDate ? t.moveOutDate.replace(/\./g,'-').slice(0,10) : null;
        if(mo && dateStr > mo) return false;
        // moveOutDate 없는 퇴실자만 contractEnd fallback (계약갱신 보호 — 활성자는 contractEnd 무시)
        if(!mo && t.isPast){
            const ce = t.contractEnd ? t.contractEnd.replace(/\./g,'-').slice(0,10) : null;
            if(ce && dateStr > ce) return false;
        }
        return true;
    }
    // 거주 기간 판정 헬퍼 (월 단위 — 호환용)
    function _wasActiveInMonth(t, mkey){
        if(!t || !mkey) return false;
        const cs = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
        const endSrc = t.moveOutDate || t.contractEnd || '';
        const ce = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
        if(cs && mkey < cs) return false;
        if(ce && mkey > ce) return false;
        return true;
    }
    // 조회월 반영: window._queryMonth ('YYYY-MM') 가 있으면 그 월 1일, 없으면 오늘 월 1일
    const _today_st = new Date();
    let _thisFirst;
    if(window._queryMonth && /^\d{4}-\d{2}$/.test(window._queryMonth)){
        const [_qy, _qm] = window._queryMonth.split('-').map(Number);
        _thisFirst = new Date(_qy, _qm-1, 1);
    } else {
        _thisFirst = new Date(_today_st.getFullYear(), _today_st.getMonth(), 1);
    }
    const _prevFirst = new Date(_thisFirst.getFullYear(), _thisFirst.getMonth()-1, 1);
    const _pad2_d = n => String(n).padStart(2,'0');
    const _thisFirstStr = _thisFirst.getFullYear() + '-' + _pad2_d(_thisFirst.getMonth()+1) + '-01';
    const _prevFirstStr = _prevFirst.getFullYear() + '-' + _pad2_d(_prevFirst.getMonth()+1) + '-01';
    const _thisFirstLab = _thisFirst.getFullYear() + '년 ' + (_thisFirst.getMonth()+1) + '월 1일';
    const _prevFirstLab = _prevFirst.getFullYear() + '년 ' + (_prevFirst.getMonth()+1) + '월 1일';
    // 이번달 1일 기준 합계 (메인)
    let _curFirstDeposit = 0, _curFirstMonthly = 0;
    let _prevFirstDeposit = 0, _prevFirstMonthly = 0;
    ROOMS.forEach(r => {
        (r.tenants||[]).forEach(tt => {
            if(_wasActiveOnDate(tt, _thisFirstStr)){
                _curFirstDeposit += Number(tt.deposit)||0;
                _curFirstMonthly += Number(tt.monthlyTotal)||0;
            }
            if(_wasActiveOnDate(tt, _prevFirstStr)){
                _prevFirstDeposit += Number(tt.deposit)||0;
                _prevFirstMonthly += Number(tt.monthlyTotal)||0;
            }
        });
    });
    // 전기 직전 부과월의 직전월 (예: 3월이 main이면 2월) sub용
    let _prevElecMonth = '';
    let _prevElecBill = 0;
    {
        const _allMonthsWithBill = [];
        ROOMS.forEach(r => {
            if(r.elec){
                Object.entries(r.elec).forEach(([m, e]) => {
                    if(elecBillOf(e) > 0) _allMonthsWithBill.push(m);
                });
            }
        });
        const _uniqSorted = [...new Set(_allMonthsWithBill)].sort();
        if(_uniqSorted.length >= 2){
            _prevElecMonth = _uniqSorted[_uniqSorted.length - 2];
            ROOMS.forEach(r => {
                if(r.elec && r.elec[_prevElecMonth]){
                    _prevElecBill += elecBillOf(r.elec[_prevElecMonth]);
                }
            });
        }
    }
    ROOMS.forEach(r => {
        // 보증금/고정비: 현재 입실자(isPast=false) 전체 합계 (40명)
        // 라벨에만 직전 부과월 표시. 계산은 현재 시점 기준.
        const _curT = currentTenant(r);
        if(_curT && !_curT.isPast){
            activeCount++;
            totalDeposit += Number(_curT.deposit)||0;
            totalMonthly += Number(_curT.monthlyTotal)||0;
        }
        // 퇴실자 카운트만 유지 (현재 표시 안 함)
        (r.tenants||[]).forEach(tt => {
            if(tt && tt.isPast){
                pastCount++;
                pastDeposit += Number(tt.deposit)||0;
                pastMonthly += Number(tt.monthlyTotal)||0;
            }
        });
        // 전기세: 직전 부과월(_elecLatestMonth) 만 합산 (전체 누적 X)
        if(r.elec && _elecLatestMonth){
            const e = r.elec[_elecLatestMonth];
            if(e){
                const b = elecBillOf(e);
                if(b > 0){
                    const p = elecPaidOf(e);
                    const owner = _resolveBillTenant(r, _elecLatestMonth, e);
                    if(owner && !owner.isPast){
                        grandElecBill += b;
                        grandElecPaid += p;
                    } else {
                        pastElecBill += b;
                        pastElecPaid += p;
                    }
                }
            }
        }
        const rU = isRecentlyUnpaid(r);
        const eU = isRecentlyElecUnpaid(r);
        if(rU) rentUnpaidCount++;
        if(eU) elecUnpaidCount++;
        if(rU || eU) anyUnpaidCount++;
        const u = unpaidTotals(r);
        sumUnpaidRent += u.rent;
        sumUnpaidElec += u.elec;
    });
    const sumUnpaidAll = sumUnpaidRent + sumUnpaidElec;

    // === 미납 총액 카드용: 전체 기간 항목별 분리 합계 ===
    let _allUnpaidRent = 0, _allUnpaidMgmt = 0, _allUnpaidPark = 0, _allUnpaidElec = 0;
    const _todayKeyAll = (new Date()).getFullYear() + '-' + String((new Date()).getMonth()+1).padStart(2,'0');
    ROOMS.forEach(r => {
        // 고정비 — 현재 입주자만, payments 명시 입력된 월 + RENT_MONTHS 윈도우 범위
        const t = currentTenant(r);
        if(t && !t.isPast){
            const cs = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
            const endSrc = t.moveOutDate || '';
            const ce = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
            const _allMonthsForT = new Set(RENT_MONTHS);
            Object.keys(t.payments || {}).forEach(m => _allMonthsForT.add(m));
            [..._allMonthsForT].forEach(m => {
                if(cs && m < cs) return;
                if(ce && m > ce) return;
                if(m > _todayKeyAll) return;
                if(rentPayStatus(t, m).cls === 'unpaid'){
                    _allUnpaidRent += Number(t.rent)||0;
                    _allUnpaidMgmt += Number(t.mgmtNum)||0;
                    _allUnpaidPark += Number(t.parkingNum)||0;
                }
            });
        }
        // 전기 — 호실 단위 전체 기간 부과 vs 입금 (퇴실 무관)
        if(r.elec){
            Object.entries(r.elec).forEach(([m, e]) => {
                if(!e) return;
                const bill = elecBillOf(e);
                if(bill <= 0) return;
                const paid = elecPaidOf(e);
                const diff = bill - paid;
                if(diff > 0) _allUnpaidElec += diff;
            });
        }
    });
    const _allUnpaidTotal = _allUnpaidRent + _allUnpaidMgmt + _allUnpaidPark + _allUnpaidElec;

    // baselineText: 조회월 1일 기준 표시
    var _bsEl = document.getElementById('baselineText');
    if(_bsEl){
        // _thisFirst 는 위에서 이미 계산됨 (조회월 반영 후의 1일)
        _bsEl.textContent = _thisFirst.getFullYear() + '년 ' + (_thisFirst.getMonth()+1) + '월 1일 기준';
    }
    // 조회월 입력값 동기화
    var _qmEl = document.getElementById('queryMonth');
    if(_qmEl && window._queryMonth){
        _qmEl.value = window._queryMonth;
    }
    // 오늘 기준 입주 수 (모든 isPast=false 입주자가 있는 방)
    let _todayActive = 0;
    ROOMS.forEach(r => {
        const _hasCur = (r.tenants||[]).some(t => t && !t.isPast);
        if(_hasCur) _todayActive++;
    });
    // 조회월 1일 기준 입주 수
    let _firstActive = 0;
    ROOMS.forEach(r => {
        const _hasOnFirst = (r.tenants||[]).some(t => t && _wasActiveOnDate(t, _thisFirstStr));
        if(_hasOnFirst) _firstActive++;
    });
    const _todayDateLab = _today_st.getFullYear() + '년 ' + (_today_st.getMonth()+1) + '월 ' + _today_st.getDate() + '일';
    // 라벨 옆 오늘 날짜 갱신
    var _occLab = document.getElementById('statOccupiedDate');
    if(_occLab) _occLab.textContent = '(' + _todayDateLab + ' 기준)';
    document.getElementById('statOccupied').innerHTML = 
        `<div style="font-size:18px;line-height:1.2;font-weight:900">총 ${ROOMS.length}개 중 <span style="color:#0f172a">입주 ${_todayActive}개</span></div>` +
        `<div style="font-size:11px;color:#64748b;font-weight:600;margin-top:6px;line-height:1.5">${_thisFirstLab} 기준: <span style="color:#475569;font-weight:700">총 ${ROOMS.length}개 중 입주 ${_firstActive}개</span></div>`;
    // 라벨: 보증금/고정비는 오늘 월(현재 월) 기준, 전기는 직전 부과월
    const _todayD = new Date();
    const _curMonLab = _todayD.getFullYear() + '년 ' + (_todayD.getMonth()+1) + '월';
    var _depLab = document.getElementById('statDepositLabel');
    if(_depLab) _depLab.textContent = '(' + _thisFirstLab + ' 기준)';
    var _fxLab = document.getElementById('statFixedLabel');
    if(_fxLab) _fxLab.textContent = '(' + _thisFirstLab + ' 기준 · 월세+관리+주차)';
    // 보증금 — 직전월 거주 입실자 합계 (단일 숫자)
    document.getElementById('statDeposit').innerHTML = `${fmt(_curFirstDeposit)}원<div style="font-size:11px;color:#64748b;font-weight:600;margin-top:4px">${_prevFirstLab} 기준: <span style="color:#475569;font-weight:700">${fmt(_prevFirstDeposit)}원</span></div>`;
    // 고정비 — 이번달 1일 기준 + 전달 1일 기준
    document.getElementById('statFixed').innerHTML = `${fmt(_curFirstMonthly)}원<div style="font-size:11px;color:#64748b;font-weight:600;margin-top:4px">${_prevFirstLab} 기준: <span style="color:#475569;font-weight:700">${fmt(_prevFirstMonthly)}원</span></div>`;
    // 전기세 — 직전 부과월 합계 + 그 직전월 합계
    const _elecMonLabel = _elecLatestMonth ? (_elecLatestMonth.slice(0,4) + '년 ' + parseInt(_elecLatestMonth.slice(5,7),10) + '월') : '데이터 없음';
    const _prevElecLabel = _prevElecMonth ? (_prevElecMonth.slice(0,4) + '년 ' + parseInt(_prevElecMonth.slice(5,7),10) + '월') : '';
    var _elLab = document.getElementById('statElecLabel');
    if(_elLab) _elLab.textContent = '(' + _elecMonLabel + ' 부과)';
    document.getElementById('statElec').innerHTML = `${fmt(grandElecBill+pastElecBill)}원` + (_prevElecMonth ? `<div style="font-size:11px;color:#64748b;font-weight:600;margin-top:4px">${_prevElecLabel} 부과: <span style="color:#475569;font-weight:700">${fmt(_prevElecBill)}원</span></div>` : '');
    document.getElementById('statUnpaid').innerHTML = 
        `<span style="color:#991b1b">${fmt(_allUnpaidTotal)}원</span>` +
        `<div style="font-size:11px;color:#9a3412;font-weight:700;margin-top:6px;line-height:1.7">` +
            `<div style="display:flex;justify-content:space-between"><span>월세</span><span style="font-variant-numeric:tabular-nums">${fmt(_allUnpaidRent)}원</span></div>` +
            `<div style="display:flex;justify-content:space-between"><span>관리비</span><span style="font-variant-numeric:tabular-nums">${fmt(_allUnpaidMgmt)}원</span></div>` +
            `<div style="display:flex;justify-content:space-between"><span>주차비</span><span style="font-variant-numeric:tabular-nums">${fmt(_allUnpaidPark)}원</span></div>` +
            `<div style="display:flex;justify-content:space-between"><span>전기요금</span><span style="font-variant-numeric:tabular-nums">${fmt(_allUnpaidElec)}원</span></div>` +
        `</div>`;

    if(selectedRoom) renderDetail();
    else renderDefaultOverview();
}

function selectRoom(roomNo){
    selectedRoom = roomNo;
    render();
}

function tenantBlockHtml(t, isPast){
    const parkTag = t.parkingNum>0 ? '<span class="badge badge-park">주차</span>' : '';
    const statusTag = isPast ? '<span class="badge-unpaid">이전 입주자</span>' : '<span class="badge-paid">현재 입주중</span>';
    const monthlyTotal = t.monthlyTotal || (t.rent + (t.mgmtNum||0) + (t.parkingNum||0));
    const rows = [
        ['입주자', `${t.tenant}${t.gender?' ('+t.gender+')':''}`],
        ['연락처', t.phone || '-'],
        ['비상처', t.emergency || '-'],
        ['계약기간', `${t.contractStart||'-'} ~ ${t.contractEnd||'-'}`],
        ['보증금', `${fmt(t.deposit)}원`],
        ['월세', `${fmt(t.rent)}원`],
        ['관리비', t.mgmtNum ? `${fmt(t.mgmtNum)}원` : (t.mgmt||'-')],
        ['주차', t.parkingNum>0 ? `${fmt(t.parkingNum)}원` : (t.parking||'-')],
    ];
    const rowsHtml = rows.map(([k,v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
    const totalRow = `<div class="row"><span class="k">월 합계</span><span class="v highlight">${fmt(monthlyTotal)}원</span></div>`;
    const noteRow = t.baseNote ? `<div class="row"><span class="k">비고</span><span class="v">${t.baseNote}</span></div>` : '';
    const moveOutRow = t.moveOut ? `<div class="row"><span class="k">퇴실/메모</span><span class="v">${t.moveOut}</span></div>` : '';

    // 고정비 입금이력 전체 (계약 기간 내 모든 월) - 세로형 테이블
    // RENT_MONTHS 외에 tenant.payments에 있는 모든 월도 포함
    const allMonths = Array.from(new Set([...RENT_MONTHS, ...Object.keys(t.payments||{})])).sort().reverse();
    let paidCount=0, unpaidCount=0, paidSum=0, unpaidSum=0;
    const payRowsHtml = allMonths.map(m => {
        const st = rentPayStatus(t, m);
        const p = (t.payments||{})[m] || {};
        const expected = monthlyTotal;
        let statusLabel = '';
        let amtCell = '';
        let cls = 'none';
        if(st.cls === 'paid'){
            statusLabel = `<span class="badge-paid">완납</span>`;
            amtCell = `<td class="num">${fmt(expected)}원</td>`;
            cls = 'paid';
            paidCount++; paidSum += expected;
        } else if(st.cls === 'unpaid'){
            statusLabel = `<span class="badge-unpaid">미납</span>`;
            amtCell = `<td class="num" style="color:#991b1b;font-weight:900">${fmt(expected)}원</td>`;
            cls = 'unpaid';
            unpaidCount++; unpaidSum += expected;
        } else {
            statusLabel = `<span class="badge-none">-</span>`;
            amtCell = `<td class="num none">-</td>`;
        }
        const paidDate = (p.rentPaid && !String(p.rentPaid).includes('미납')) ? p.rentPaid : '-';
        const mgmtNote = (p.mgmtPaid && p.mgmtPaid !== 'N/A') ? ` · 관리 ${p.mgmtPaid}` : '';
        const parkNote = p.parkingPaid ? ` · 주차 ${p.parkingPaid}` : '';
        const noteTxt = (p.note || '') + mgmtNote + parkNote;
        return `<tr><td>${monthLabel(m)}</td><td>${statusLabel}</td>${amtCell}<td>${paidDate}</td><td style="font-size:10px;color:#64748b">${noteTxt||'-'}</td></tr>`;
    }).join('');
    const paySummary = `<div style="display:flex;gap:8px;margin:6px 0;font-size:11px;flex-wrap:wrap">
        <span class="badge-paid">완납 ${paidCount}개월 · ${fmt(paidSum)}원</span>
        ${unpaidCount>0?`<span class="badge-unpaid">미납 ${unpaidCount}개월 · ${fmt(unpaidSum)}원</span>`:''}
    </div>`;
    const payTable = `<table class="payTable histTable"><thead><tr>
        <th>월</th><th>상태</th><th class="num">금액</th><th>납부일</th><th>비고</th>
    </tr></thead><tbody>${payRowsHtml}</tbody></table>`;

    return `<div class="tenantBlock${isPast?' past':''}">
        <h4>${t.tenant} ${statusTag}${parkTag}</h4>
        ${rowsHtml}${totalRow}${noteRow}${moveOutRow}
        <div style="margin-top:10px;font-weight:900;font-size:12px">고정비 입금내역 (월세+관리비+주차 통합)</div>
        ${paySummary}
        ${payTable}
    </div>`;
}

function renderDefaultOverview(){
    // 호실 선택 전 기본 화면: 전체미납 / 월별미납 탭으로 표시
    document.getElementById('detailTitle').textContent = '미납 현황 요약';
    const subEl = document.getElementById('detailSub');
    if(subEl) subEl.textContent = '카드를 클릭하면 호실 상세, 탭으로 전체/월별 미납 전환';

    // ===== 전체미납 데이터 (기존 로직) =====
    const rentList = [], elecList = [];
    let rentTotal = 0, elecTotal = 0;
    ROOMS.forEach(r => {
        const t = currentTenant(r);
        if(!t || t.isPast) return;
        const u = unpaidTotals(r);
        if(u.rent > 0){
            rentList.push({room:r.room, tenant:t.tenant, amount:u.rent, months:u.rentMonths});
            rentTotal += u.rent;
        }
        if(u.elec > 0){
            elecList.push({room:r.room, tenant:t.tenant, amount:u.elec, months:u.elecMonths});
            elecTotal += u.elec;
        }
    });
    rentList.sort((a,b) => b.amount - a.amount);
    elecList.sort((a,b) => b.amount - a.amount);

    const renderList = (title, subtitle, list, total, color) => {
        let h = `<div style="margin-bottom:14px">
            <h3 style="margin:0 0 6px 0;font-size:14px;color:${color};display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid ${color};padding-bottom:4px">
                <span>${title}</span>
                <span style="font-size:11px;color:#64748b;font-weight:600">${subtitle}</span>
            </h3>`;
        if(list.length === 0){
            h += `<div style="padding:10px;background:#dcfce7;color:#166534;border-radius:6px;font-weight:700;font-size:12px;text-align:center">미납 방 없음 ✓</div>`;
        } else {
            h += `<table class="payTable histTable" style="width:100%;font-size:11.5px">
                <thead><tr><th>호실</th><th>입주자</th><th style="font-size:10px">미납월</th><th class="num">금액</th></tr></thead><tbody>`;
            list.forEach(x => {
                h += `<tr style="cursor:pointer" onclick="selectRoom('${x.room}')" title="클릭하면 ${x.room}호 상세로 이동">
                    <td style="font-weight:900">${x.room}</td>
                    <td>${x.tenant}</td>
                    <td style="font-size:10px;color:${color}">${x.months.map(monthLabel).join(', ')}</td>
                    <td class="num" style="color:${color};font-weight:900">${fmt(x.amount)}원</td>
                </tr>`;
            });
            h += `<tr class="total-row"><td colspan="3" style="font-weight:900">합계 (${list.length}실)</td>
                <td class="num" style="color:${color};font-weight:900;font-size:13px">${fmt(total)}원</td></tr>`;
            h += `</tbody></table>`;
        }
        h += `</div>`;
        return h;
    };

    let allTabHtml = renderList('💰 미납 고정비 요약', '', rentList, rentTotal, '#991b1b');
    allTabHtml += renderList('⚡ 미납 전기요금 요약', '', elecList, elecTotal, '#b91c1c');
    const grandTotal = rentTotal + elecTotal;
    if(grandTotal > 0){
        allTabHtml += `<div style="padding:12px 14px;background:#fef2f2;border:2px solid #fca5a5;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <span style="font-weight:900;font-size:13px;color:#991b1b">전체 미납 합계</span>
            <span style="font-weight:900;font-size:17px;color:#991b1b">${fmt(grandTotal)}원</span>
        </div>`;
    } else {
        allTabHtml += `<div style="padding:14px;background:#dcfce7;color:#166534;border-radius:10px;font-weight:900;font-size:13px;text-align:center;margin-top:8px">
            🎉 현재 미납 없음
        </div>`;
    }
    allTabHtml += `<div style="font-size:10.5px;color:#94a3b8;margin-top:10px;text-align:center">※ 호실을 클릭하면 해당 방 상세로 이동합니다</div>`;

    // ===== 월별미납 데이터 (전체 방 통합, 월별 그룹) =====
    const byMonth = {};
    ROOMS.forEach(r => {
        (r.tenants||[]).forEach(t => {
            const monthlyTotal = t.monthlyTotal || ((Number(t.rent)||0) + (Number(t.mgmtNum)||0) + (Number(t.parkingNum)||0));
            if(!monthlyTotal) return;
            const csKey = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
            const endSrc = t.moveOutDate || t.contractEnd || '';
            const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
            // 확장 월 집합: RENT_MONTHS + 이 입주자의 payments 키 (오래된 미납 포함)
            const extM = new Set(RENT_MONTHS);
            Object.keys(t.payments || {}).forEach(mm => extM.add(mm));
            extM.forEach(m => {
                if(csKey && m < csKey) return;
                if(ceKey && m > ceKey) return;
                if(rentPayStatus(t, m).cls === 'unpaid'){
                    if(!byMonth[m]) byMonth[m] = {rooms:{}, isOld: !RENT_MONTHS.includes(m)};
                    if(!byMonth[m].rooms[r.room]) byMonth[m].rooms[r.room] = {room:r.room, tenant:t.tenant, isPast:!!t.isPast, rent:0, elec:0};
                    byMonth[m].rooms[r.room].rent += monthlyTotal;
                }
            });
        });
        if(r.elec){
            Object.entries(r.elec).forEach(([m,e]) => {
                if(!e) return;
                const bill = Number(e.bill) || 0;
                if(bill <= 0) return;
                const paid = elecPaidOf(e);
                const diff = bill - paid;
                if(diff > 0){
                    if(!byMonth[m]) byMonth[m] = {rooms:{}, isOld: !RENT_MONTHS.includes(m) && !ELEC_MONTHS.includes(m)};
                    if(!byMonth[m].rooms[r.room]){
                        const cur = currentTenant(r);
                        byMonth[m].rooms[r.room] = {room:r.room, tenant:(e.name || (cur?cur.tenant:'-')), isPast:false, rent:0, elec:0};
                    }
                    byMonth[m].rooms[r.room].elec += diff;
                }
            });
        }
    });
    const months = Object.keys(byMonth).sort().reverse();
    let monthlyTabHtml = '';
    let mGrandRent = 0, mGrandElec = 0;
    months.forEach(m => {
        Object.values(byMonth[m].rooms).forEach(rr => { mGrandRent += rr.rent; mGrandElec += rr.elec; });
    });
    const mGrand = mGrandRent + mGrandElec;
    if(months.length === 0){
        monthlyTabHtml = `<div style="padding:24px;background:#dcfce7;color:#166534;border-radius:10px;font-weight:900;font-size:14px;text-align:center">🎉 전 방 · 전 기간 미납 없음</div>`;
    } else {
        monthlyTabHtml += `<div style="padding:10px 14px;background:#fef2f2;border:2px solid #fca5a5;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <span style="font-weight:800;font-size:12px;color:#991b1b">${months.length}개월 · ${new Set(months.flatMap(m => Object.keys(byMonth[m].rooms))).size}개 방 미납</span>
            <span style="font-weight:900;font-size:15px;color:#991b1b">${fmt(mGrand)}원</span>
        </div>`;
        months.forEach(m => {
            const rooms = Object.values(byMonth[m].rooms).sort((a,b) => String(a.room).localeCompare(String(b.room)));
            const mRent = rooms.reduce((s,x)=>s+x.rent,0);
            const mElec = rooms.reduce((s,x)=>s+x.elec,0);
            const mTot = mRent + mElec;
            monthlyTabHtml += `<div style="margin-bottom:12px;border:1.5px solid #e5e7eb;border-radius:10px;overflow:hidden;background:#fff">
                <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:${byMonth[m].isOld?'linear-gradient(135deg,#fef2f2,#fee2e2)':'linear-gradient(135deg,#f1f5f9,#e2e8f0)'};border-bottom:1.5px solid ${byMonth[m].isOld?'#fca5a5':'#cbd5e1'}">
                    <span style="font-weight:900;font-size:14px;color:#0f172a">${monthLabel(m)}</span>
                    ${byMonth[m].isOld?'<span style="background:#7f1d1d;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px" title="롤링 윈도우 밖의 장기 미납">⚠ 장기</span>':''}
                    <span style="font-size:10px;font-weight:700;color:#475569;background:#fff;padding:2px 7px;border-radius:5px;border:1px solid #cbd5e1">${rooms.length}실</span>
                    <span style="margin-left:auto;font-weight:900;font-size:13px;color:#1e293b;background:#cbd5e1;padding:3px 10px;border-radius:999px;border:1.5px solid #94a3b8">${fmt(mTot)}원</span>
                </div>
                <table class="payTable histTable" style="width:100%;font-size:11.5px;border:none">
                    <thead><tr>
                        <th style="width:55px">호실</th>
                        <th style="min-width:75px">입주자</th>
                        <th class="num" style="min-width:75px">고정비</th>
                        <th class="num" style="min-width:75px">전기</th>
                        <th class="num" style="background:#cbd5e1;min-width:75px;color:#1e293b">합계</th>
                    </tr></thead><tbody>`;
            rooms.forEach(rr => {
                const tot = rr.rent + rr.elec;
                const pastTag = rr.isPast ? `<span style="display:inline-block;background:#fee2e2;color:#991b1b;font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px;margin-left:3px">퇴실</span>` : '';
                monthlyTabHtml += `<tr style="cursor:pointer" onclick="selectRoom('${rr.room}')" title="클릭하면 ${rr.room}호 상세로 이동">
                    <td style="font-weight:900;color:#0f172a">${rr.room}</td>
                    <td>${rr.tenant||'-'}${pastTag}</td>
                    <td class="num" style="color:${rr.rent>0?'#991b1b':'#9ca3af'};font-weight:${rr.rent>0?'800':'500'}">${rr.rent>0?fmt(rr.rent):'-'}</td>
                    <td class="num" style="color:${rr.elec>0?'#475569':'#9ca3af'};font-weight:${rr.elec>0?'800':'500'}">${rr.elec>0?fmt(rr.elec):'-'}</td>
                    <td class="num" style="color:#1e293b;background:#e2e8f0;font-weight:900">${fmt(tot)}</td>
                </tr>`;
            });
            monthlyTabHtml += `<tr class="total-row" style="background:#cbd5e1"><td colspan="2" style="font-weight:800;color:#1e293b">소계</td>
                <td class="num" style="color:#1e293b;font-weight:900">${mRent>0?fmt(mRent):'-'}</td>
                <td class="num" style="color:#1e293b;font-weight:900">${mElec>0?fmt(mElec):'-'}</td>
                <td class="num" style="color:#1e293b;background:#94a3b8;font-weight:900">${fmt(mTot)}</td></tr>`;
            monthlyTabHtml += `</tbody></table></div>`;
        });
        monthlyTabHtml += `<div style="font-size:10px;color:#94a3b8;margin-top:8px">※ 현재+퇴실자 통합 · 호실 클릭시 상세로 이동</div>`;
    }

    // 탭 제거 — 전체미납만 표시
    document.getElementById('detailBody').innerHTML = allTabHtml;
}

function switchOverviewTab(name){
    const all = document.getElementById('ovTabAll');
    const mon = document.getElementById('ovTabMonthly');
    const btns = document.querySelectorAll('.ovTabBtn');
    if(!all || !mon) return;
    btns.forEach(b => {
        const isActive = b.dataset.ovtab === name;
        b.style.color = isActive ? '#0f172a' : '#64748b';
        b.style.borderBottomColor = isActive ? (name==='all'?'#dc2626':'#f59e0b') : 'transparent';
    });
    all.style.display = (name === 'all') ? 'block' : 'none';
    mon.style.display = (name === 'monthly') ? 'block' : 'none';
}

        basicHtml += history.map(t => {
            const rows = [
                ['입주자', `${t.tenant}${t.gender?' ('+t.gender+')':''}`],
                ['연락처', t.phone || '-'],
                ['계약기간', `${t.contractStart||'-'} ~ ${t.contractEnd||'-'}`],
                ['보증금', `${fmt(t.deposit)}원`],
                ['월세', `${fmt(t.rent)}원`],
            ];
            return `<div class="tenantBlock past"><h4>${t.tenant} <span class="badge-unpaid">이전 입주자</span></h4>
                ${rows.map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;
        }).join('');
    }

    // 탭 2: 고정비 입금내역 (현재 + 이전 입주자)
    let rentHtml = renderRentHistoryFor(current, false);
    if(history.length > 0){
        rentHtml += `<div class="historyTitle">이전 입주자 입금내역</div>`;
        rentHtml += history.map(t => renderRentHistoryFor(t, true)).join('');
    }

    // 탭 3: 전기세 입금내역 (호실 단위, 부과금 vs 입금액 비교)
    let elecHtml = '';
    if(r.elec){
        const allElecMonths = Array.from(new Set([...ELEC_MONTHS, ...Object.keys(r.elec||{})])).sort().reverse();
        let eBillSum=0, ePaidSum=0, eArrearSum=0; // 총 부과, 총 입금, 총 미수
        let ePaidCnt=0, eUnpaidCnt=0, ePartialCnt=0;
        const eRowsHtml = allElecMonths.map(m => {
            const e = r.elec[m] || {};
            const bill = elecBillOf(e);
            const paid = elecPaidOf(e);
            const st = elecStatusOf(e);
            if(!bill){
                return `<tr><td>${monthLabel(m)}</td><td class="num none">-</td><td class="num none">-</td><td class="num none">-</td><td><span class="badge-none">-</span></td><td>-</td></tr>`;
            }
            eBillSum += bill;
            ePaidSum += paid;
            const diff = bill - paid; // 양수=미수
            if(diff > 0) eArrearSum += diff;
            let badgeHtml, billCls='', paidCls='', diffCls='', diffTxt;
            if(st.cls==='paid'){
                ePaidCnt++;
                badgeHtml = st.label==='과납' ? `<span class="badge-partial">과납</span>` : `<span class="badge-paid">완납</span>`;
                diffTxt = diff === 0 ? '-' : (diff < 0 ? `+${fmt(-diff)}원` : `${fmt(diff)}원`);
                if(diff < 0) diffCls = 'style="color:#92400e;font-weight:900"';
            } else if(st.cls==='partial'){
                ePartialCnt++;
                badgeHtml = `<span class="badge-partial">일부납부</span>`;
                paidCls = 'style="color:#92400e;font-weight:900"';
                diffCls = 'style="color:#991b1b;font-weight:900"';
                diffTxt = `${fmt(diff)}원`;
            } else { // unpaid
                eUnpaidCnt++;
                badgeHtml = `<span class="badge-unpaid">미납</span>`;
                billCls = 'style="color:#991b1b;font-weight:900"';
                diffCls = 'style="color:#991b1b;font-weight:900"';
                diffTxt = `${fmt(diff)}원`;
            }
            return `<tr><td>${monthLabel(m)}</td>`+
                `<td class="num" ${billCls}>${fmt(bill)}원</td>`+
                `<td class="num" ${paidCls}>${paid>0?fmt(paid)+'원':'-'}</td>`+
                `<td class="num" ${diffCls}>${diffTxt}</td>`+
                `<td>${badgeHtml}</td><td>${e.received||'-'}</td></tr>`;
        }).join('');
        // 합계 행
        const totalDiff = eBillSum - ePaidSum;
        const diffLabel = totalDiff > 0
            ? `<span style="color:#991b1b">미수 ${fmt(totalDiff)}원</span>`
            : (totalDiff < 0 ? `<span style="color:#92400e">과납 ${fmt(-totalDiff)}원</span>` : `<span style="color:#166534">정확히 일치</span>`);
        elecHtml = `<div style="display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:800;margin-bottom:10px;align-items:center">
                <span class="chip" style="padding:4px 10px;border-radius:999px;background:#f1f5f9;color:#334155">총 부과 ${fmt(eBillSum)}원</span>
                <span class="chip" style="padding:4px 10px;border-radius:999px;background:#dbeafe;color:#1e3a8a">총 입금 ${fmt(ePaidSum)}원</span>
                <span class="chip" style="padding:4px 10px;border-radius:999px;background:${totalDiff>0?'#fee2e2':(totalDiff<0?'#fef3c7':'#dcfce7')};color:${totalDiff>0?'#991b1b':(totalDiff<0?'#92400e':'#166534')}">차액: ${diffLabel}</span>
                <span class="badge-paid">완납 ${ePaidCnt}개월</span>
                ${ePartialCnt>0?`<span class="badge-partial">일부납부 ${ePartialCnt}개월</span>`:''}
                ${eUnpaidCnt>0?`<span class="badge-unpaid">미납 ${eUnpaidCnt}개월</span>`:''}
            </div>
            <table class="payTable histTable"><thead><tr>
                <th>월</th><th class="num">부과금</th><th class="num">입금액</th><th class="num">차액</th><th>상태</th><th>수납일</th>
            </tr></thead><tbody>${eRowsHtml}
            <tr class="total-row"><td><b>합계</b></td>`+
                `<td class="num"><b>${fmt(eBillSum)}원</b></td>`+
                `<td class="num"><b>${fmt(ePaidSum)}원</b></td>`+
                `<td class="num" style="color:${totalDiff>0?'#991b1b':(totalDiff<0?'#92400e':'#166534')}"><b>${totalDiff===0?'0원':(totalDiff>0?fmt(totalDiff)+'원':'+'+fmt(-totalDiff)+'원')}</b></td>`+
                `<td colspan="2">${totalDiff>0?'미수':(totalDiff<0?'과납':'정산완료')}</td></tr>
            </tbody></table>
            <div style="font-size:10px;color:#94a3b8;margin-top:6px">※ 차액 = 부과금 − 입금액 (양수=미수, 음수=과납)</div>`;
    } else {
        elecHtml = '<div style="padding:20px;text-align:center;color:#94a3b8">전기세 데이터가 없습니다</div>';
    }

    // 탭 4: 월별 미납 (해당 호실의 월별 미납 집계)
    const monRows = unpaidByMonth(r);
    const monGrandRent = monRows.reduce((s,x)=>s+x.rent,0);
    const monGrandElec = monRows.reduce((s,x)=>s+x.elec,0);
    const monGrandTotal = monGrandRent + monGrandElec;
    const monUnpaidBadge = monRows.length>0
        ? ` <span style="background:#fde68a;color:#92400e;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:900;margin-left:2px">${monRows.length}</span>`
        : '';
    let monUnpaidHtml;
    if(monRows.length === 0){
        monUnpaidHtml = '<div style="padding:24px;text-align:center;color:#16a34a;background:#f0fdf4;border:1.5px dashed #86efac;border-radius:10px">✅ 월별 미납 내역이 없습니다</div>';
    } else {
        const monRowsHtml = monRows.map(rw => {
            const namesTxt = rw.namesArr.length ? rw.namesArr.join(', ') : '-';
            const oldMark = rw.isOld ? ` <span style="background:#7f1d1d;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:4px" title="롤링 윈도우(최근 6개월) 밖의 장기 미납">⚠ 장기</span>` : '';
            const rowStyle = rw.isOld ? 'background:#fef2f2;border-left:3px solid #991b1b' : '';
            return `<tr style="${rowStyle}">`
                + `<td><b>${monthLabel(rw.month)}</b>${oldMark}</td>`
                + `<td style="font-size:11px;color:#475569">${namesTxt}</td>`
                + `<td class="num" style="color:${rw.rent>0?'#1e293b':'#94a3b8'}">${rw.rent>0?fmt(rw.rent):'-'}</td>`
                + `<td class="num" style="color:${rw.elec>0?'#1e293b':'#94a3b8'}">${rw.elec>0?fmt(rw.elec):'-'}</td>`
                + `<td class="num" style="color:#1e293b;font-weight:900">${fmt(rw.total)}</td>`
                + `</tr>`;
        }).join('');
        monUnpaidHtml = `<div style="display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:800;margin-bottom:10px">
                <span class="chip" style="padding:4px 10px;border-radius:999px;background:#cbd5e1;color:#1e293b">미납 ${monRows.length}개월</span>
                <span class="chip" style="padding:4px 10px;border-radius:999px;background:#e2e8f0;color:#1e293b">고정비 ${fmt(monGrandRent)}원</span>
                <span class="chip" style="padding:4px 10px;border-radius:999px;background:#e2e8f0;color:#1e293b">전기 ${fmt(monGrandElec)}원</span>
                <span class="chip" style="padding:4px 10px;border-radius:999px;background:#475569;color:#fff">총 ${fmt(monGrandTotal)}원</span>
            </div>
            <table class="payTable histTable"><thead><tr>
                <th>월</th><th>입주자</th><th class="num">고정비 미납</th><th class="num">전기 미수</th><th class="num">합계</th>
            </tr></thead><tbody>${monRowsHtml}
            <tr class="total-row"><td colspan="2"><b>합계</b></td>`
                + `<td class="num"><b>${fmt(monGrandRent)}</b></td>`
                + `<td class="num"><b>${fmt(monGrandElec)}</b></td>`
                + `<td class="num" style="color:#1e293b"><b>${fmt(monGrandTotal)}</b></td></tr>
            </tbody></table>
            <div style="font-size:10px;color:#94a3b8;margin-top:6px">※ 현재·이전 입주자의 고정비 미납과 전기세 미수를 월 단위로 통합 표시</div>`;
    }

    const tabs = `<div class="detailTabs">
        <button data-tab="basic" onclick="switchDetailTab('basic')">기본정보</button>
        <button data-tab="rent" onclick="switchDetailTab('rent')">고정비</button>
        <button data-tab="elec" onclick="switchDetailTab('elec')">전기료</button>
        <button data-tab="monUnpaid" onclick="switchDetailTab('monUnpaid')">월별미납${monUnpaidBadge}</button>
    </div>`;
    const panes = `
        <div class="tabPane" id="tabBasic">${basicHtml}</div>
        <div class="tabPane" id="tabRent">${rentHtml}</div>
        <div class="tabPane" id="tabElec">${elecHtml}</div>
        <div class="tabPane" id="tabMonUnpaid">${monUnpaidHtml}</div>`;

    document.getElementById('detailBody').innerHTML = summaryStrip + tabs + panes;
    switchDetailTab(window._activeDetailTab || 'basic');
}

function switchDetailTab(name){
    window._activeDetailTab = name;
    document.querySelectorAll('.detailTabs button').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === name);
    });
    const map = {basic:'tabBasic', rent:'tabRent', elec:'tabElec', monUnpaid:'tabMonUnpaid'};
    Object.entries(map).forEach(([k,id]) => {
        const el = document.getElementById(id);
        if(el) el.classList.toggle('active', k === name);
    });
}

function renderRentHistoryFor(t, isPast){
    const monthlyTotal = t.monthlyTotal || (t.rent + (t.mgmtNum||0) + (t.parkingNum||0));
    const allMonths = Array.from(new Set([...RENT_MONTHS, ...Object.keys(t.payments||{})])).sort().reverse();
    let paidCount=0, unpaidCount=0, paidSum=0, unpaidSum=0;
    const rows = allMonths.map(m => {
        const st = rentPayStatus(t, m);
        const p = (t.payments||{})[m] || {};
        const expected = monthlyTotal;
        let statusLabel = '<span class="badge-none">-</span>';
        let amtCell = '<td class="num none">-</td>';
        if(st.cls === 'paid'){
            statusLabel = '<span class="badge-paid">완납</span>';
            amtCell = `<td class="num">${fmt(expected)}원</td>`;
            paidCount++; paidSum += expected;
        } else if(st.cls === 'unpaid'){
            statusLabel = '<span class="badge-unpaid">미납</span>';
            amtCell = `<td class="num" style="color:#991b1b;font-weight:900">${fmt(expected)}원</td>`;
            unpaidCount++; unpaidSum += expected;
        }
        const paidDate = (p.rentPaid && !String(p.rentPaid).includes('미납')) ? p.rentPaid : '-';
        const mgmtNote = (p.mgmtPaid && p.mgmtPaid !== 'N/A') ? `관리 ${p.mgmtPaid}` : '';
        const parkNote = p.parkingPaid ? `주차 ${p.parkingPaid}` : '';
        const noteBits = [p.note, mgmtNote, parkNote].filter(Boolean).join(' · ');
        return `<tr><td>${monthLabel(m)}</td><td>${statusLabel}</td>${amtCell}<td>${paidDate}</td><td style="font-size:10px;color:#64748b">${noteBits||'-'}</td></tr>`;
    }).join('');
    const summary = `<div style="display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:800;margin:6px 0 10px 0">
        <span class="badge-paid">완납 ${paidCount}개월 · ${fmt(paidSum)}원</span>
        ${unpaidCount>0?`<span class="badge-unpaid">미납 ${unpaidCount}개월 · ${fmt(unpaidSum)}원</span>`:''}
    </div>`;
    const pastTag = isPast ? ' <span class="badge-unpaid" style="font-size:10px">이전 입주자</span>' : '';
    return `<div class="tenantBlock${isPast?' past':''}">
        <h4>${t.tenant}${pastTag}</h4>
        <div style="font-size:11px;color:#64748b;margin-bottom:4px">계약 ${t.contractStart||'-'} ~ ${t.contractEnd||'-'} · 월 ${fmt(monthlyTotal)}원</div>
        ${summary}
        <table class="payTable histTable"><thead><tr>
            <th>월</th><th>상태</th><th class="num">금액</th><th>납부일</th><th>비고</th>
        </tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

function exportCSV(){
    const headers = ['호실','구분','입주자','성별','연락처','비상처','계약시작','계약만기','보증금','월세','관리비','주차','월합계','비고','퇴실메모'];
    const rows = [];
    ROOMS.forEach(r => {
        r.tenants.forEach(t => {
            rows.push([r.room, t.isPast?'이전':'현재', t.tenant, t.gender||'', t.phone||'', t.emergency||'',
                t.contractStart||'', t.contractEnd||'',
                t.deposit||0, t.rent||0, t.mgmtNum||t.mgmt||'', t.parkingNum||t.parking||'',
                t.monthlyTotal||0, t.baseNote||'', t.moveOut||'']);
        });
    });
    // 합계 행 추가
    let sumDeposit=0, sumRent=0, sumMgmt=0, sumPark=0, sumTotal=0;
    ROOMS.forEach(r => {
        const t = currentTenant(r);
        if(!t || t.isPast) return;
        sumDeposit += t.deposit||0;
        sumRent += t.rent||0;
        sumMgmt += t.mgmtNum||0;
        sumPark += t.parkingNum||0;
        sumTotal += t.monthlyTotal||0;
    });
    rows.push(['합계','현재','','','','','','',sumDeposit,sumRent,sumMgmt,sumPark,sumTotal,'','']);

    const csv = '\uFEFF' + [headers, ...rows].map(row =>
        row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')
    ).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // 파일명: Cheonghwa_Regent_YYYYMMDD_HHMMSS (KST 실시각)
    const _csvNow = new Date();
    const _csvPad = n => String(n).padStart(2,'0');
    const _csvStamp = _csvNow.getFullYear() + _csvPad(_csvNow.getMonth()+1) + _csvPad(_csvNow.getDate()) + '_' + _csvPad(_csvNow.getHours()) + _csvPad(_csvNow.getMinutes()) + _csvPad(_csvNow.getSeconds());
    a.download = `Cheonghwa_Regent_${_csvStamp}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

// 섹션별 CSV 다운로드 (패널 안의 모든 표를 하나의 CSV로 저장)
function downloadPanelCSV(panelId, sectionName){
    const panel = document.getElementById(panelId);
    if(!panel){ alert('패널을 찾을 수 없습니다'); return; }
    const tables = panel.querySelectorAll('table');
    if(tables.length === 0){ alert('다운로드할 표가 없습니다'); return; }
    const rows = [];
    tables.forEach((tbl, idx) => {
        if(idx > 0) rows.push([]);
        // 선행 H3 제목을 구분용 행으로 삽입
        let prev = tbl.previousElementSibling;
        while(prev && !/^H[1-6]$/i.test(prev.tagName)) prev = prev.previousElementSibling;
        if(prev && /^H[1-6]$/i.test(prev.tagName)){
            rows.push(['=== ' + prev.textContent.replace(/\s+/g,' ').trim() + ' ===']);
        }
        tbl.querySelectorAll('tr').forEach(tr => {
            const cells = [];
            tr.querySelectorAll('th,td').forEach(td => {
                let txt = (td.innerText || td.textContent || '').replace(/\s+/g,' ').trim();
                cells.push(txt);
            });
            rows.push(cells);
        });
    });
    const csv = rows.map(row => row.map(c => {
        const s = (c == null) ? '' : String(c);
        if(s.includes('"') || s.includes(',') || s.includes('\n') || s.includes('\r')){
            return '"' + s.replace(/"/g,'""') + '"';
        }
        return s;
    }).join(',')).join('\r\n');
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    const filename = `${sectionName}_${stamp}.csv`;
    const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openGlobalReport(){
    const panel = document.getElementById('globalReportPanel');
    if(panel.style.display === 'block'){ closeAllPanels(); return; }
    closeAllPanels();
    const _now = new Date();
    const _pad = n => String(n).padStart(2,'0');
    const _nowStr = `${_now.getFullYear()}-${_pad(_now.getMonth()+1)}-${_pad(_now.getDate())} ${_pad(_now.getHours())}:${_pad(_now.getMinutes())}`;
    // === 전체 미납 요약 사전 계산 (4개 카드용) ===
    let _sumRentUnp = 0, _sumElecUnp = 0;
    const _unpaidRoomSet = new Set();
    const _unpaidMonthSet = new Set();
    ROOMS.forEach(r => {
        (r.tenants||[]).forEach(tt => {
            const mt = tt.monthlyTotal || ((Number(tt.rent)||0)+(Number(tt.mgmtNum)||0)+(Number(tt.parkingNum)||0));
            if(!mt) return;
            const csKey = tt.contractStart ? tt.contractStart.replace(/\./g,'-').slice(0,7) : null;
            const endSrc = tt.moveOutDate || tt.contractEnd || '';
            const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
            extMonthsForTenant(tt).forEach(mm => {
                if(csKey && mm < csKey) return;
                if(ceKey && mm > ceKey) return;
                if(rentPayStatus(tt, mm).cls === 'unpaid'){
                    _sumRentUnp += mt;
                    _unpaidRoomSet.add(r.room);
                    _unpaidMonthSet.add(mm);
                }
            });
        });
        if(r.elec){
            Object.entries(r.elec).forEach(([mm, e]) => {
                if(!e) return;
                const bill = elecBillOf(e);
                if(bill <= 0) return;
                const paid = elecPaidOf(e);
                const diff = bill - paid;
                if(diff > 0){
                    _sumElecUnp += diff;
                    _unpaidRoomSet.add(r.room);
                    _unpaidMonthSet.add(mm);
                }
            });
        }
    });
    const _sumTotal = _sumRentUnp + _sumElecUnp;

    let html = `<div class="panelHead">
        <h2>📊 월간 보고서 <span class="phPill-info">${_nowStr} 기준</span></h2>
        <button class="csvBtn" onclick="downloadPanelCSV('globalReportPanel','월간보고')">📥 CSV 다운로드</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px">
        <div style="padding:14px 16px;border-radius:12px;background:#f1f5f9;border:1px solid #cbd5e1;border-left:5px solid #94a3b8">
            <div style="font-size:11px;color:#64748b;font-weight:700;letter-spacing:0.05em">총 미납 합계</div>
            <div style="font-size:22px;font-weight:900;margin-top:3px;color:#991b1b;font-variant-numeric:tabular-nums">${fmt(_sumTotal)}원</div>
        </div>
        <div style="padding:14px 16px;border-radius:12px;background:#f1f5f9;border:1px solid #cbd5e1">
            <div style="font-size:11px;color:#64748b;font-weight:700;letter-spacing:0.05em">고정비 미납 (월세+관리+주차)</div>
            <div style="font-size:22px;font-weight:900;margin-top:3px;color:#1e293b;font-variant-numeric:tabular-nums">${fmt(_sumRentUnp)}원</div>
        </div>

function openElectricReport(){
    const panel = document.getElementById('electricReportPanel');
    if(panel.style.display === 'block'){ closeAllPanels(); return; }
    closeAllPanels();
    window._elecViewMode = window._elecViewMode || 'full';
    renderElectricReport();
    panel.style.display = 'block';
}

function switchElecViewMode(mode){
    window._elecViewMode = mode;
    renderElectricReport();
}

        <button onclick="switchElecViewMode('full')" style="padding:5px 12px;border-radius:6px;font-weight:800;font-size:11px;cursor:pointer;border:1.5px solid ${mode==='full'?'#1e3a8a':'#cbd5e1'};background:${mode==='full'?'#1e3a8a':'#fff'};color:${mode==='full'?'#fff':'#475569'}">전체 (부과·입금·일자)</button>
        <button onclick="switchElecViewMode('billOnly')" style="padding:5px 12px;border-radius:6px;font-weight:800;font-size:11px;cursor:pointer;border:1.5px solid ${mode==='billOnly'?'#1e3a8a':'#cbd5e1'};background:${mode==='billOnly'?'#1e3a8a':'#fff'};color:${mode==='billOnly'?'#fff':'#475569'}">부과금만</button>

    html += `<div style="font-size:11px;color:#475569;margin-bottom:6px">
        ${mode==='billOnly'

          : '각 월 아래에 <b>부과 · 입금 · 일자</b> 3개 컬럼이 나란히 표시됩니다. 미수는 빨강, 과납은 노랑.'}

    html += `<div style="overflow-x:auto;border:1px solid #e5e7eb;border-radius:8px">`;
    html += `<table class="reportTable elecReportTable" style="font-size:11px;min-width:100%;border-collapse:collapse">`;

    if(mode === 'billOnly'){
        // 부과금만 모드: 각 월 단일 컬럼
        html += `<thead><tr>
            <th style="position:sticky;left:0;background:#0f172a;color:#fff;z-index:3;min-width:130px;text-align:left;padding:6px 8px">호실 / 입주자</th>
            <th style="background:#334155;color:#fff;min-width:80px;font-size:10px">계약시작</th>
            <th style="background:#334155;color:#fff;min-width:80px;font-size:10px">계약만기</th>
            <th style="background:#475569;color:#fff;min-width:80px;font-size:10px">실제 퇴실일</th>
            ${elecMonthsRev.map(m=>`<th class="num" style="background:#1e293b;color:#fff;border-left:2px solid #475569">${monthLabel(m)}</th>`).join('')}
            <th class="num" style="background:#0f172a;color:#fff;border-left:3px solid #94a3b8">합계</th>
        </tr></thead><tbody>`;
        ROOMS.forEach(r => {
            // 월별 합계 누적 (방 단위 1회만 - 정확한 그랜드 토탈 위해)
            elecMonthsRev.forEach(m => {
                const e = r.elec && r.elec[m];
                if(!e || !elecBillOf(e)) return;
                monthBill[m] += elecBillOf(e);
                monthPaid[m] += elecPaidOf(e);
                grandBill += elecBillOf(e);
            });
            // 모든 입주자(현재+퇴실) 시간순 정렬, 가장 최근이 위
            const allTenants = (r.tenants || []).slice().sort((a,b) => {
                const aS = a.contractStart || '';

            allTenants.forEach(t => {
                const csKey = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
                const endSrc = t.moveOutDate || t.contractEnd || '';
                const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
                let rowBillSum = 0;

            <td style="position:sticky;left:0;background:#1e293b;color:#fff;z-index:2;min-width:130px;text-align:left;padding:6px 8px"><b>월별 합계</b></td>
            <td style="background:#334155;color:#fff;text-align:center;font-size:10px">-</td>
            <td style="background:#334155;color:#fff;text-align:center;font-size:10px">-</td>
            <td style="background:#475569;color:#fff;text-align:center;font-size:10px">-</td>
            ${elecMonthsRev.map(m => `<td class="num" style="background:#f8fafc;font-weight:900;border-left:2px solid #cbd5e1">${fmt(monthBill[m])}</td>`).join('')}

            <th rowspan="2" style="background:#334155;color:#fff;min-width:80px;font-size:10px">계약시작</th>

        </tr>`;
        html += `<tr>
            ${elecMonthsRev.map(()=>`

            <th class="num" style="background:#334155;color:#fff;font-size:10px">차액</th>
        </tr></thead><tbody>`;
        ROOMS.forEach(r => {

                const e = r.elec && r.elec[m];
                if(!e || !elecBillOf(e)) return;
                const bill = elecBillOf(e);
                const paid = elecPaidOf(e);
                monthBill[m] += bill;
                monthPaid[m] += paid;
                grandBill += bill;
                grandPaid += paid;
            });
            // 모든 입주자(현재+퇴실) 시간순 정렬, 가장 최근이 위

            if(allTenants.length === 0){

                let rowBillSum = 0, rowPaidSum = 0;
                const cells = [];
                elecMonthsRev.forEach(m => {
                    if(csKey && m < csKey){
                        cells.push(`<td class="num" style="color:#e2e8f0;border-left:2px solid #e5e7eb">·</td><td class="num" style="color:#e2e8f0">·</td><td style="color:#e2e8f0;font-size:10px">·</td>`);

                </tr>`;

        });
        html += `<tr class="total-row" style="border-top:3px solid #1e293b;background:#f1f5f9">

function filterResidents(){
    const _qEl = document.getElementById('residentFilter');
    const q = (_qEl ? _qEl.value : '' || '').toLowerCase();
    const st = window._residentScope || 'all';
    const pk = document.getElementById('residentParking').value;
    const rows = document.querySelectorAll('#residentTable tbody tr:not(.total-row)');
    rows.forEach(tr => {
        const matchQ = !q || (tr.dataset.search||'').includes(q);
        const isPast = tr.classList.contains('resident-past');
        const hasPark = tr.classList.contains('has-parking');
        const matchSt = st==='all' || (st==='active' && !isPast) || (st==='past' && isPast);
        const matchPk = pk==='all' || (pk==='yes' && hasPark);
        tr.style.display = (matchQ && matchSt && matchPk) ? '' : 'none';
    });
    const totalRow = document.querySelector('#residentTable tbody tr.total-row');
    if(totalRow) totalRow.style.display = '';
}

// 입실자 정보 - 인라인 편집 dirty 추적 + 일괄 저장
window._resDirtyCount = 0;
function _resAutoSize(el){
    try {
        if(!el || !el.style) return;
        el.style.height = 'auto';
        var h = Math.max(42, el.scrollHeight);
        el.style.height = h + 'px';
    } catch(e){}
}
function resMarkDirty(el){
    try {
        if(!el) return;
        if(!el.classList.contains('res-dirty')){
            el.classList.add('res-dirty');
            window._resDirtyCount = (window._resDirtyCount||0) + 1;
        }
        el.style.background = '#fef3c7';
        el.style.borderColor = '#f59e0b';
        el.style.borderWidth = '2px';
        var badge = document.getElementById('resSaveCount');
        if(badge) badge.textContent = window._resDirtyCount;
        var btn = document.getElementById('resSaveBtn');
        if(btn){ btn.style.background = '#dc2626'; btn.style.animation = 'pulse 1.5s infinite'; }
    } catch(err){
        console.error('resMarkDirty error', err);
    }
}
function resSaveAll(){
    var dirtyEls = document.querySelectorAll('#residentTable .res-dirty');
    if(dirtyEls.length === 0){ alert('변경된 내용이 없습니다.'); return; }
    try {
        var all = (typeof loadTenantEdits === 'function') ? loadTenantEdits() : {};
        var n = 0;
        dirtyEls.forEach(function(el){
            var roomKey = el.dataset.room;
            var origName = el.dataset.orig;
            var field = el.dataset.field;
            var v = (el.value || '').trim();
            var saveVal = v === '' ? null : v;
            // 숫자 필드는 Number 변환
            var NUM_FIELDS = ['deposit','rent','mgmtNum','parkingNum'];
            if(NUM_FIELDS.indexOf(field) >= 0){
                saveVal = (v === '') ? 0 : (Number(v) || 0);
            }
            if(!all[roomKey]) all[roomKey] = {};
            if(!all[roomKey][origName]) all[roomKey][origName] = {};
            all[roomKey][origName][field] = saveVal;
            // ROOMS 메모리 동기화
            var r = ROOMS.find(function(x){ return x.room === roomKey; });
            var tRef = null;
            if(r){
                tRef = (r.tenants||[]).find(function(tt){ return tt.tenant === origName; });
                if(tRef) tRef[field] = saveVal;
            }
            // ⭐ 자동 동기화: 퇴실일 입력 시 isPast=true 자동 설정 (모든 화면 통일)
            //                퇴실일 비우면 isPast=false 자동 복원
            if(field === 'moveOutDate'){
                var newIsPast = !!saveVal;
                all[roomKey][origName].isPast = newIsPast;
                if(tRef) tRef.isPast = newIsPast;
            }
            // ⭐ 금액 변경 시 monthlyTotal 자동 재계산
            if(NUM_FIELDS.indexOf(field) >= 0 && tRef){
                tRef.monthlyTotal = (Number(tRef.rent)||0) + (Number(tRef.mgmtNum)||0) + (Number(tRef.parkingNum)||0);
                all[roomKey][origName].monthlyTotal = tRef.monthlyTotal;
            }
            // dirty 해제
            el.classList.remove('res-dirty');
            el.style.borderWidth = '1px';
            if(field === 'moveOutDate'){
                el.style.borderColor = '#fca5a5';
                el.style.background = '#fef2f2';
                el.style.color = saveVal ? '#991b1b' : '#475569';
                el.style.fontWeight = saveVal ? '700' : '400';
            } else {
                el.style.borderColor = '#fbbf24';
                el.style.background = '#fffbeb';
            }
            n++;
        });
        if(typeof saveTenantEdits === 'function') saveTenantEdits(all);
        // 메인 화면도 즉시 반영
        if(typeof render === 'function') render();
        // 카운터 초기화
        window._resDirtyCount = 0;
        var badge = document.getElementById('resSaveCount');
        if(badge) badge.textContent = '0';
        var btn = document.getElementById('resSaveBtn');
        if(btn){ btn.style.background = '#475569'; btn.style.animation = ''; }
        alert('✓ ' + n + '건 저장 완료\n\n패널을 다시 그려 새 데이터를 반영합니다.');
        // 패널 자체를 다시 렌더링 → 새 데이터로 input value 채워짐
        try {
            var panel = document.getElementById('residentInfoPanel');
            if(panel && panel.style.display === 'block'){
                panel.style.display = 'none';
                if(typeof openResidentInfo === 'function') openResidentInfo();
            }
        } catch(reErr){ console.error('패널 재렌더 에러', reErr); }
    } catch(e){
        console.error('resSaveAll error', e);
        alert('저장 에러: ' + e.message + '\n\nF12 콘솔에서 자세한 내용 확인.');
    }
}

// 월간보고 미납상세 - 조회기간 입력
// 사용자 룰: 매번 새로 시작 - window._unpaidPeriod 매번 null로 초기화
window._unpaidPeriod = null;
// From 변경 시 To의 min을 From 값으로 동기화 + To가 From보다 작으면 To도 자동 갱신
function _unpSyncToMin(){
    var fromEl = document.getElementById('unpFromMonth');
    var toEl = document.getElementById('unpToMonth');
    if(!fromEl || !toEl) return;
    var fromVal = fromEl.value;
    // From 최소값(2025-10) 보정
    if(fromVal && fromVal < '2025-10'){ fromEl.value = '2025-10'; fromVal = '2025-10'; }
    toEl.min = fromVal || '2025-10';
    if(fromVal && toEl.value && toEl.value < fromVal){
        toEl.value = fromVal; // To가 From보다 작으면 To = From으로 보정
    }
}
function applyUnpaidPeriod(){
    var fromEl = document.getElementById('unpFromMonth');
    var toEl = document.getElementById('unpToMonth');
    var from = fromEl ? fromEl.value : '';
    var to = toEl ? toEl.value : '';
    // From 최소값(2025-10) 검증
    if(from && from < '2025-10'){
        alert('조회 시작월은 2025-10 이후만 가능합니다.');
        if(fromEl){ fromEl.value = '2025-10'; from = '2025-10'; }
    }
    // To가 From보다 작으면 차단
    if(from && to && to < from){
        alert('종료월은 시작월(' + from + ') 이상이어야 합니다.');
        if(toEl){ toEl.value = from; to = from; }
        return;
    }
    if(from || to){
        if(from && to && from > to){
            alert('시작월이 종료월보다 늦을 수 없습니다.');
            return;
        }
        window._unpaidPeriod = {from: from || null, to: to || null};
    } else {
        window._unpaidPeriod = null;
    }
    // 패널 재렌더링 (계산 다시)
    if(typeof openGlobalReport === 'function'){
        var panel = document.getElementById('globalReportPanel');
        if(panel && panel.style.display === 'block'){
            panel.style.display = 'none';
            openGlobalReport();
        }
    }
}

// 월간보고 미납상세 - 4개 체크박스 필터
function applyUnpaidFilter(){
    // 6개 체크박스: 고정비(납부/미납), 전기료(납부/미납), 퇴실자(포함/제외)
    var fxPaid = document.getElementById('unpChk-fix-paid');
    var fxUnpaid = document.getElementById('unpChk-fix-unpaid');
    var elPaid = document.getElementById('unpChk-elec-paid');
    var elUnpaid = document.getElementById('unpChk-elec-unpaid');
    var pInc = document.getElementById('unpChk-past-include');
    var pExc = document.getElementById('unpChk-past-exclude');
    var fixPaidOn = fxPaid ? fxPaid.checked : false;
    var fixUnpaidOn = fxUnpaid ? fxUnpaid.checked : true;
    var elecPaidOn = elPaid ? elPaid.checked : false;
    var elecUnpaidOn = elUnpaid ? elUnpaid.checked : true;
    var pastIncOn = pInc ? pInc.checked : false;
    var pastExcOn = pExc ? pExc.checked : true;
    // 카테고리 내 둘 다 체크 안 했으면 = 그 카테고리 무시 (모두 매치)
    var fixIgnore = !fixPaidOn && !fixUnpaidOn;
    var elecIgnore = !elecPaidOn && !elecUnpaidOn;
    var pastIgnore = !pastIncOn && !pastExcOn;
    var rows = document.querySelectorAll('#globalReportPanel tr.unp-paid, #globalReportPanel tr.unp-unpaid');
    var visible = 0;
    rows.forEach(function(tr){
        var fixSt = tr.getAttribute('data-fix') || (tr.classList.contains('unp-paid') ? 'paid' : 'unpaid');
        var elecSt = tr.getAttribute('data-elec') || (tr.classList.contains('unp-paid') ? 'paid' : 'unpaid');
        var pastSt = tr.getAttribute('data-past') || (tr.classList.contains('unp-past') ? '1' : '0');
        var matchFix = fixIgnore || (fixPaidOn && fixSt==='paid') || (fixUnpaidOn && fixSt==='unpaid');
        var matchElec = elecIgnore || (elecPaidOn && elecSt==='paid') || (elecUnpaidOn && elecSt==='unpaid');
        var matchPast = pastIgnore || (pastIncOn && pastSt==='1') || (pastExcOn && pastSt==='0');
        var show = matchFix && matchElec && matchPast;
        tr.style.display = show ? '' : 'none';
        if(show) visible++;
    });
    var lbl = document.getElementById('unpFilterCount');
    if(lbl) lbl.textContent = visible;

    // ★ 가시 행만 합산해서 합계 행 갱신 (퇴실자 포함/제외 토글에 정확히 반응)
    var sums = {deposit:0, rent:0, mgmt:0, park:0, fixed:0, accum:0, elec:0, tot:0};
    rows.forEach(function(tr){
        if(tr.style.display === 'none') return;
        sums.deposit += Number(tr.getAttribute('data-deposit')) || 0;
        sums.rent    += Number(tr.getAttribute('data-rent'))    || 0;
        sums.mgmt    += Number(tr.getAttribute('data-mgmt'))    || 0;
        sums.park    += Number(tr.getAttribute('data-park'))    || 0;
        sums.fixed   += Number(tr.getAttribute('data-fixed'))   || 0;
        sums.accum   += Number(tr.getAttribute('data-accum'))   || 0;
        sums.elec    += Number(tr.getAttribute('data-elecarr')) || 0;
        sums.tot     += Number(tr.getAttribute('data-totunp')) || 0;
    });
    function _fmtSum(n){ return n.toLocaleString('ko-KR'); }
    var pairs = [['unpSumDeposit', sums.deposit], ['unpSumRent', sums.rent], ['unpSumMgmt', sums.mgmt],
                 ['unpSumPark', sums.park], ['unpSumFixed', sums.fixed], ['unpSumAccum', sums.accum],
                 ['unpSumElec', sums.elec], ['unpSumGrand', sums.tot]];
    pairs.forEach(function(p){
        var el = document.getElementById(p[0]);
        if(el) el.textContent = p[1] > 0 ? _fmtSum(p[1]) : '-';
    });
}
