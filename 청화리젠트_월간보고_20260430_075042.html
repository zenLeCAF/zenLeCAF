// 특정 백업을 파일로 내보내기
function exportSnapshotToFile(name){
    const snapshots = loadSnapshots();
    const snap = snapshots[name];
    if(!snap){ alert('백업을 찾을 수 없습니다: ' + name); return; }
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    const safeName = name.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
    const payload = {
        _meta: {
            dashboard: '청화(淸和) REZENT',
            snapshotName: name,
            createdAt: snap.timestamp,
            exportedAt: now.toISOString(),
            schemaVersion: 2,
            counts: { overrideRooms: snap.ovCount||0, expenseEntries: snap.expCount||0 }
        },
        rooms: ROOMS,
        overrides: snap.ov,
        expenses: snap.expenses
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `청화Regent_백업_${safeName}_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    deShowStatus(`✓ "${name}" 백업을 파일로 다운로드 완료`);
}

// 특정 백업으로 복원
function restoreSnapshot(name){
    const snapshots = loadSnapshots();

// "백업 내보내기" — 전체 백업 + 즉시 파일 다운로드
function exportBackupAsFile(){
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const defaultName = `내보내기_${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;

    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed){ deShowStatus('이름이 비어있습니다', 'err'); return; }
    // 1) PC 내 저장 (snapshot)
    const snapshots = loadSnapshots();
    const exists = !!snapshots[trimmed];
    if(exists && !confirm(`"${trimmed}" 백업이 이미 있습니다. 덮어쓰시겠습니까?`)) return;
    const ov = deLoadOverrides();
    let expenses = [];
    try { expenses = (typeof loadExpenses === 'function') ? loadExpenses() : []; } catch(_){}
    snapshots[trimmed] = {
        name: trimmed,
        timestamp: now.toISOString(),
        timestampLocal: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
        ov: ov,
        expenses: expenses,
        ovCount: Object.keys(ov).length,
        expCount: expenses.length
    };
    saveSnapshots(snapshots);

    exportSnapshotToFile(trimmed);
    deShowStatus(`✓ "${trimmed}" PC 저장 + 파일 다운로드 완료`);
}

function deImportJSON(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            // 형식 자동 감지: 전체 DB(_meta + rooms + overrides + expenses) 또는 입력데이터만(평면 객체)
            let overrides = null;
            let expenses = null;
            let isFullDB = false;
            if(data && typeof data === 'object' && data._meta && data.overrides){
                // 📦 전체 DB 다운로드 형식
                isFullDB = true;
                overrides = data.overrides || {};
                if(Array.isArray(data.expenses)) expenses = data.expenses;
            } else if(data && typeof data === 'object'){
                // 📤 전체 백업(오버라이드만) 형식
                overrides = data;
            }
            if(!overrides){
                deShowStatus('복원 실패: 인식되지 않는 JSON 형식', 'err');
                return;
            }
            const ovCount = Object.keys(overrides).length;
            const expCount = expenses ? expenses.length : 0;
            const msg = isFullDB
                ? `📦 전체 DB 백업 파일이 감지되었습니다.\n\n• 입력 데이터(입금/전기/교체): ${ovCount}건\n• 지출 내역: ${expCount}건\n\n현재 PC의 모든 입력 데이터와 지출 내역을 덮어씁니다. 진행하시겠습니까?`
                : `📤 입력데이터 백업 파일이 감지되었습니다.\n\n• 입력 데이터: ${ovCount}건\n\n현재 입력 데이터를 덮어씁니다. 진행하시겠습니까?`;
            if(!confirm(msg)) return;
            deSaveOverrides(overrides);
            if(expenses){
                try { localStorage.setItem(EXPENSE_STORAGE_KEY, JSON.stringify(expenses)); } catch(_){}
            }
            deShowStatus('✓ 복원 완료 — 페이지를 다시 로드합니다');
            setTimeout(()=>location.reload(), 1200);
        } catch(err){
            deShowStatus('복원 실패: 잘못된 JSON 파일', 'err');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// 전체 데이터베이스 JSON 다운로드 (메인 우측 상단 버튼)
function downloadFullDB(){
    const ov = deLoadOverrides();
    const expenses = loadExpenses();
    // 통계 요약
    const roomCount = ROOMS.length;
    const activeTenants = ROOMS.reduce((n, r) => n + r.tenants.filter(t => !t.isPast).length, 0);
    const pastTenants = ROOMS.reduce((n, r) => n + r.tenants.filter(t => t.isPast).length, 0);
    let rentMonths = 0, elecMonths = 0;
    ROOMS.forEach(r => {
        r.tenants.forEach(t => { if(t.payments) rentMonths += Object.keys(t.payments).length; });
        if(r.elec) elecMonths += Object.keys(r.elec).length;
    });
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    const isoNow = now.toISOString();
    const expenseTotal = expenses.reduce((s,e)=>s+(Number(e.amount)||0), 0);
    const payload = {
        _meta: {
            dashboard: '청화(淸和) REZENT',
            exportedAt: isoNow,
            exportedAtLocal: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
            schemaVersion: 2,
            counts: {
                rooms: roomCount,
                activeTenants,
                pastTenants,
                rentPaymentEntries: rentMonths,
                elecEntries: elecMonths,
                overrideRooms: Object.keys(ov).length,
                expenseEntries: expenses.length,
                expenseTotal
            },
            rentMonths: RENT_MONTHS,
            elecMonths: ELEC_MONTHS
        },
        rooms: ROOMS,
        overrides: ov,
        expenses: expenses
    };
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], {type:'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `청화Regent_전체DB_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    const btn = document.querySelector('.dbBtn') || document.querySelector('.dbDownloadBtn');
    if(btn){

            txtEl.textContent = '✓ 다운로드 완료';

        }
    }
}

function nrApply(){
    const roomKey = window._nrCurrentRoom;
    const r = ROOMS.find(x => x.room === roomKey);

    const curT = r.tenants.find(tt => !tt.isPast);
    const name = (document.getElementById('nrName').value || '').trim();
    const gender = document.getElementById('nrGender').value || '';
    const phone = (document.getElementById('nrPhone').value || '').trim();
    const emergency = (document.getElementById('nrEmergency').value || '').trim();
    const start = document.getElementById('nrStart').value || '';
    const end = document.getElementById('nrEnd').value || '';
    const deposit = document.getElementById('nrDeposit').value;
    const rent = document.getElementById('nrRent').value;
    const mgmt = document.getElementById('nrMgmt').value;
    const park = document.getElementById('nrPark').value;
    const note = (document.getElementById('nrNote').value || '').trim();
    if(!name){ nrShowStatus('입주자 이름을 입력하세요', 'err'); return; }
    if(!start){ nrShowStatus('계약시작일을 입력하세요', 'err'); return; }
    if(!rent){ if(!confirm('월세가 비어있습니다. 0원으로 진행할까요?')) return; }
    if(curT){
        const blockMsg = '⛔ 등록 불가\n\n' + roomKey + '호는 현재 ' + curT.tenant + ' 거주중입니다.\n기존 입주자가 퇴실 처리되지 않은 방에는 신규 입실 등록을 진행할 수 없습니다.\n\n[해결 방법]\n상단 메뉴 [입력] → [입주자 교체] 탭에서 ' + curT.tenant + ' 퇴실 처리 후 다시 시도하세요.';
        alert(blockMsg);
        nrShowStatus('⛔ 등록 불가 — ' + curT.tenant + '(현재 거주중) 퇴실 처리 후 등록하세요. 입력→입주자 교체 메뉴 사용', 'err');
        return;
    }
    const normDate = s => s ? s.replace(/-/g,'.') : '';
    const rentN = rent === '' ? 0 : Number(rent);
    const mgmtN = mgmt === '' ? 0 : Number(mgmt);
    const parkN = park === '' ? 0 : Number(park);
    let autoMoveOutDate = '';
    if(curT){
        const d = new Date(start);
        d.setDate(d.getDate() - 1);
        const pad = n => String(n).padStart(2,'0');
        autoMoveOutDate = d.getFullYear() + '.' + pad(d.getMonth()+1) + '.' + pad(d.getDate());
    }
    const rec = {
        moveOutDate: autoMoveOutDate,
        outTenantName: curT ? curT.tenant : '',
        settlementStatus: curT ? '정산중' : '',
        refundAmount: null,
        outNote: curT ? '입실등록 메뉴에서 자동 퇴실 처리' : '',
        newTenant: {
            tenant: name, gender: gender, phone: phone, emergency: emergency,
            contractStart: normDate(start), contractEnd: normDate(end),
            deposit: deposit === '' ? 0 : Number(deposit),
            rent: rentN, mgmtNum: mgmtN,
            mgmt: mgmtN > 0 ? String(mgmtN) : 'N/A',
            parkingNum: parkN,
            parking: parkN > 0 ? String(parkN) : '-',
            monthlyTotal: rentN + mgmtN + parkN,
            baseNote: note, payments: {}, isPast: false
        },
        timestamp: (new Date()).toISOString().replace('T',' ').slice(0,19)
    };
    const ov = deLoadOverrides();
    if(!ov[roomKey]) ov[roomKey] = {payments:{}, elec:{}};
    if(!ov[roomKey]._tenantReplacements) ov[roomKey]._tenantReplacements = [];
    ov[roomKey]._tenantReplacements.push(rec);
    deSaveOverrides(ov);
    deApplyOverridesToRooms();
    render();
    const successMsg = '✅ 입실 등록 완료\n\n' + roomKey + '호에 ' + name + ' 입실 등록되었습니다.\n계약시작: ' + normDate(start) + (end ? '\n계약만기: ' + normDate(end) : '') + '\n월세: ' + fmt(rentN) + '원' + (mgmtN > 0 ? '\n관리비: ' + fmt(mgmtN) + '원' : '') + (parkN > 0 ? '\n주차비: ' + fmt(parkN) + '원' : '') + '\n\n메인 화면 및 입실자 정보에 즉시 반영되었습니다.';
    alert(successMsg);
    nrShowStatus('✓ ' + roomKey + '호 입실 등록되었습니다 — ' + name);
    // 폼 리셋
    ['nrName','nrPhone','nrEmergency','nrEnd','nrDeposit','nrRent','nrMgmt','nrPark','nrNote'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.value = '';
    });
    const gEl = document.getElementById('nrGender');
    if(gEl) gEl.value = '';
    // 검증: 실제로 ROOMS에 반영되었는지 확인
    const verifyRoom = ROOMS.find(x => x.room === roomKey);
    const verifyTenant = verifyRoom ? verifyRoom.tenants.find(tt => !tt.isPast && tt.tenant === name) : null;
    if(!verifyTenant){
        console.error('[nrApply] 등록 검증 실패: ROOMS에서 ' + roomKey + '/' + name + ' 못찾음');
        alert('⚠️ 등록 검증 경고\n\n등록 처리는 완료되었으나 메인 데이터에서 새 입주자를 즉시 확인할 수 없습니다.\nF5(새로고침) 후 다시 확인해 주세요.\n\n방: ' + roomKey + '호\n입주자: ' + name);
    }
    // 패널 자동 닫기 → 메인 화면으로
    setTimeout(() => {
        try { closeAllPanels(); } catch(e){}
        // 새 입주자 카드 강조 + 스크롤
        try {
            const cards = document.querySelectorAll('.roomCard');
            cards.forEach(c => {
                const noEl = c.querySelector('.roomNo');
                if(noEl && noEl.textContent.trim() === String(roomKey)){
                    c.scrollIntoView({behavior:'smooth', block:'center'});
                    c.style.transition = 'box-shadow 0.4s, outline 0.4s';
                    c.style.outline = '4px solid #fbbf24';
                    c.style.boxShadow = '0 0 24px rgba(251,191,36,0.7)';
                    setTimeout(() => {
                        c.style.outline = '';
                        c.style.boxShadow = '';
                    }, 3500);
                }
            });
        } catch(e){ console.error('하이라이트 오류:', e); }
    }, 600);
}

const EXPENSE_STORAGE_KEY = 'cheonghwa_regent_expenses_v1';
const EXPENSE_CATEGORIES = ['수선·수리','청소·용역','공과금','세금','소모품','인건비','이자·대출','보험','기타'];

function loadExpenses(){
    try { return JSON.parse(localStorage.getItem(EXPENSE_STORAGE_KEY)) || []; }
    catch(e){ return []; }
}
function saveExpenses(arr){
    try { localStorage.setItem(EXPENSE_STORAGE_KEY, JSON.stringify(arr)); }
    catch(e){ alert('저장 실패: 저장공간이 부족할 수 있습니다.'); }
}

function openExpensePanel(){
    const panel = document.getElementById('expensePanel');
    if(panel.style.display === 'block'){ closeAllPanels(); return; }
    closeAllPanels();
    panel.style.display = 'block';
    renderExpensePanel();
    panel.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderExpensePanel(){
    const panel = document.getElementById('expensePanel');
    const expenses = loadExpenses();
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const _nowStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const curYM = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
    const curY = String(now.getFullYear());
    let thisMonth = 0, thisYear = 0, allTime = 0;
    const catSum = {};
    expenses.forEach(e => {
        const amt = Number(e.amount) || 0;
        allTime += amt;
        if(e.date && e.date.startsWith(curY)) thisYear += amt;
        if(e.date && e.date.startsWith(curYM)) thisMonth += amt;
        const c = e.category || '기타';
        catSum[c] = (catSum[c]||0) + amt;
    });
    const fmt_ = n => (Number(n)||0).toLocaleString('ko-KR');
    const filters = window._expFilters || {year:'', month:'', cat:'', search:''};
    window._expFilters = filters;
    const allYears = Array.from(new Set(expenses.map(e => (e.date||'').slice(0,4)).filter(Boolean))).sort().reverse();
    if(!allYears.includes(String(now.getFullYear()))) allYears.unshift(String(now.getFullYear()));

    let html = `<div class="panelHead">

        </div>

    html += `<div class="expSummary">

        <div class="expCard ytd"><div class="cLabel">올해 누적 (${curY})</div><div class="cValue">${fmt_(thisYear)}원</div></div>
        <div class="expCard count"><div class="cLabel">전체 누적 · ${expenses.length}건</div><div class="cValue">${fmt_(allTime)}원</div></div>
    </div>`;

    const catArr = Object.entries(catSum).sort((a,b)=>b[1]-a[1]);
    if(catArr.length){
        html += `<div class="expCatBreak">`;
        catArr.forEach(([c,v]) => {
            html += `<span class="pill">${c} <b>${fmt_(v)}원</b></span>`;

        <label>거래처 <input type="text" id="expVendor" placeholder="선택"></label>
        <label>결제수단 <select id="expPay"><option value="카드">카드</option><option value="계좌이체">계좌이체</option><option value="현금">현금</option><option value="자동이체">자동이체</option><option value="기타">기타</option></select></label>

    html += `<div id="expMsg" style="margin:4px 0;font-size:12px;color:#059669;min-height:16px"></div>`;

function addExpense(){
    const date = document.getElementById('expDate').value;
    const category = document.getElementById('expCat').value;
    const amount = Number(document.getElementById('expAmt').value) || 0;
    const note = document.getElementById('expNote').value.trim();
    const vendor = document.getElementById('expVendor').value.trim();
    const paidBy = document.getElementById('expPay').value;
    const msgEl = document.getElementById('expMsg');
    if(!date){ msgEl.style.color='#b91c1c'; msgEl.textContent='❌ 날짜를 입력하세요'; return; }
    if(amount <= 0){ msgEl.style.color='#b91c1c'; msgEl.textContent='❌ 금액은 0보다 커야 합니다'; return; }
    const expenses = loadExpenses();
    const id = 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    expenses.push({id, date, category, amount, note, vendor, paidBy, createdAt: new Date().toISOString()});
    saveExpenses(expenses);
    renderExpensePanel();
    const m = document.getElementById('expMsg');
    if(m){
        m.style.color='#059669';
        m.textContent=`✓ 저장됨: ${date} · ${category} · ${amount.toLocaleString('ko-KR')}원`;
        setTimeout(()=>{ const mm=document.getElementById('expMsg'); if(mm) mm.textContent=''; }, 3500);
    }
}

function deleteExpense(id){
    if(!confirm('이 지출 내역을 삭제하시겠습니까?\n(복구할 수 없습니다)')) return;
    const expenses = loadExpenses().filter(e => e.id !== id);
    saveExpenses(expenses);
    renderExpensePanel();
}

function updateExpFilter(){
    window._expFilters = {
        year: document.getElementById('expFilterYear').value,
        month: document.getElementById('expFilterMonth').value,
        cat: document.getElementById('expFilterCat').value,
        search: document.getElementById('expFilterSearch').value

    renderExpensePanel();

}

function exportExpenseCSV(){
    const expenses = loadExpenses().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(expenses.length === 0){ alert('저장된 지출 내역이 없습니다'); return; }
    const headers = ['날짜','카테고리','금액(원)','내역·비고','거래처','결제수단'];
    const rows = [headers];
    expenses.forEach(e => {
        rows.push([
            e.date||'',
            e.category||'',
            e.amount||0,
            e.note||'',
            e.vendor||'',
            e.paidBy||''
        ]);
    });
    const csv = rows.map(r => r.map(c => {
        const s = String(c);
        return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\n');
    const bom = '\uFEFF';
    const blob = new Blob([bom+csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    a.download = `청화Regent_지출내역_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

// 컬럼명 정규화·매칭 헬퍼
function _xlNorm(s){
    return String(s||'').replace(/[\s·\-_().\/]/g,'').toLowerCase();
}
function _xlMatchKey(headerObj, candidates){
    // headerObj: {원본키1: 정규화키1, ...} 또는 {정규화키: 원본키}
    for(const cand of candidates){
        const ck = _xlNorm(cand);
        for(const orig of Object.keys(headerObj)){
            if(_xlNorm(orig) === ck) return orig;
        }
    }
    return null;
}

// 엑셀 날짜 셀 처리: 숫자(serial) | 문자열 | Date → "YYYY-MM-DD"
function _xlParseDate(v){
    if(v === null || v === undefined || v === '') return '';
    if(v instanceof Date && !isNaN(v)){
        const y = v.getFullYear(); const m = String(v.getMonth()+1).padStart(2,'0'); const d = String(v.getDate()).padStart(2,'0');
        return `${y}-${m}-${d}`;
    }
    if(typeof v === 'number'){
        // SheetJS는 cellDates:true이면 Date를 주지만, false면 serial 숫자
        try {
            const o = XLSX.SSF.parse_date_code(v);
            if(o){
                return `${o.y}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`;
            }
        } catch(_){}
        return '';
    }
    const s = String(v).trim();
    // 2026-04-23 / 2026.04.23 / 2026/04/23
    let m = s.match(/^(\d{4})[\.\-\/](\d{1,2})[\.\-\/](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    // 2026년 4월 23일
    m = s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일?/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    // 20260423
    m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
    if(m) return `${m[1]}-${m[2]}-${m[3]}`;
    return '';
}

// 월 키 정규화: "2026-03" / "2026.3" / "202603" / "2026년 3월" → "2026-03"
function _xlParseMonth(v){
    if(v === null || v === undefined || v === '') return '';
    if(v instanceof Date && !isNaN(v)){
        return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}`;
    }
    if(typeof v === 'number'){
        // 엑셀 셀이 날짜 serial이면 변환
        try {
            const o = XLSX.SSF.parse_date_code(v);
            if(o) return `${o.y}-${String(o.m).padStart(2,'0')}`;
        } catch(_){}
        // 6자리 숫자 (202603)
        const s = String(v);
        if(s.length === 6) return `${s.slice(0,4)}-${s.slice(4,6)}`;
        return '';
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})[\.\-\/](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}`;
    m = s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}`;
    m = s.match(/^(\d{4})(\d{2})$/);
    if(m) return `${m[1]}-${m[2]}`;
    return '';
}

function _xlParseAmount(v){
    if(v === null || v === undefined || v === '') return 0;
    if(typeof v === 'number') return Math.round(v);
    const cleaned = String(v).replace(/[,원\s₩]/g,'').replace(/[^0-9.\-]/g,'');
    const n = Number(cleaned);
    return isNaN(n) ? 0 : Math.round(n);
}

function _xlMatchCategory(v){
    const s = _xlNorm(v);
    if(!s) return '기타';
    for(const c of EXPENSE_CATEGORIES){
        if(_xlNorm(c) === s) return c;
    }
    // 부분 매칭
    for(const c of EXPENSE_CATEGORIES){
        if(s.includes(_xlNorm(c)) || _xlNorm(c).includes(s)) return c;
    }
    return '기타';
}

function _xlParseCsv(text){
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    const src = String(text || '').replace(/^\uFEFF/, '');
    for(let i = 0; i < src.length; i++){
        const ch = src[i];
        const next = src[i + 1];
        if(inQuotes){
            if(ch === '"' && next === '"'){
                field += '"';
                i++;
            } else if(ch === '"'){
                inQuotes = false;
            } else {
                field += ch;
            }
        } else {
            if(ch === '"'){
                inQuotes = true;
            } else if(ch === ','){
                row.push(field);
                field = '';
            } else if(ch === '\n'){
                row.push(field);
                rows.push(row);
                row = [];
                field = '';
            } else if(ch !== '\r'){
                field += ch;
            }
        }
    }
    if(field !== '' || row.length){
        row.push(field);
        rows.push(row);
    }
    const nonEmptyRows = rows.filter(r => r.some(c => String(c || '').trim() !== ''));
    if(nonEmptyRows.length === 0) return [];
    const headers = nonEmptyRows[0].map(h => String(h || '').trim());
    return nonEmptyRows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
            if(h) obj[h] = r[idx] === undefined ? '' : r[idx];
        });
        return obj;
    });
}

function xlHandleFile(event){
    const input = event.target;
    const file = input.files[0];
    if(!file){
        input.value = '';
        return;
    }
    const isCsv = /\.csv$/i.test(file.name || '');
    if(typeof XLSX === 'undefined' && !isCsv){
        alert('엑셀 라이브러리(SheetJS)가 로드되지 않았습니다. 인터넷 연결을 확인하고 페이지를 다시 로드해 보세요.\n\nCSV 파일은 인터넷 연결 없이도 업로드할 수 있습니다.');
        input.value = '';
        return;
    }
    const reader = new FileReader();
    reader.onerror = () => {
        alert('파일을 읽을 수 없습니다. 파일이 열려 있거나 손상되었는지 확인해 주세요.');
        input.value = '';
    };
    reader.onload = (ev) => {
        try {
            let rows;
            if(isCsv && typeof XLSX === 'undefined'){
                rows = _xlParseCsv(ev.target.result);
            } else {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array', cellDates:true});
                const ws = wb.Sheets[wb.SheetNames[0]];
                rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false, dateNF:'yyyy-mm-dd'});
            }
            if(window._xlMode === 'expense') xlPreviewExpense(rows, file.name);
            else if(window._xlMode === 'elec') xlPreviewElec(rows, file.name);
        } catch(err){
            alert('파일 읽기 실패: ' + err.message);
        } finally {
            input.value = '';
        }
    };
    if(isCsv && typeof XLSX === 'undefined') reader.readAsText(file, 'utf-8');
    else reader.readAsArrayBuffer(file);
}

function xlPreviewExpense(rows, fname){
    if(!rows || rows.length === 0){
        alert('빈 파일이거나 데이터 행이 없습니다.');
        return;
    }
    // 헤더 키 매핑
    const sample = rows[0] || {};
    const dateK = _xlMatchKey(sample, ['날짜','일자','date']);
    const amtK = _xlMatchKey(sample, ['금액','비용','amount','지출액']);
    const catK = _xlMatchKey(sample, ['카테고리','분류','category','구분']);
    const noteK = _xlMatchKey(sample, ['내역','비고','상세','note','적요']);
    const vendorK = _xlMatchKey(sample, ['거래처','업체','공급자','vendor']);
    const payK = _xlMatchKey(sample, ['결제수단','결제','지급방법','paidBy','수단']);

    const parsed = [];
    rows.forEach((row, idx) => {
        const errors = [];
        const date = dateK ? _xlParseDate(row[dateK]) : '';
        const amount = amtK ? _xlParseAmount(row[amtK]) : 0;
        const category = catK ? _xlMatchCategory(row[catK]) : '기타';
        const note = noteK ? String(row[noteK]||'').trim() : '';
        const vendor = vendorK ? String(row[vendorK]||'').trim() : '';
        const paidBy = payK ? (String(row[payK]||'').trim() || '카드') : '카드';
        if(!date) errors.push('날짜 형식 인식 실패');
        if(amount <= 0) errors.push('금액 0 이하');
        parsed.push({rowIdx:idx+2, date, amount, category, note, vendor, paidBy, errors});
    });

    window._xlParsedRows = parsed;
    const okN = parsed.filter(p => p.errors.length===0).length;
    const badN = parsed.length - okN;

    let html = `<div class="xlGuide">📂 <b>${fname}</b> · 총 ${parsed.length}행 분석 완료. 미리보기를 확인하고 <b>업로드 적용</b>을 누르면 정상 행만 일괄 추가됩니다.</div>`;
    html += `<div class="xlSummary">
        <span class="pill ok">✓ 정상 ${okN}건</span>
        ${badN>0?`<span class="pill bad">✗ 오류 ${badN}건 (제외됨)</span>`:''}
        <span class="pill">감지된 컬럼: ${[dateK&&'날짜',amtK&&'금액',catK&&'카테고리',noteK&&'내역',vendorK&&'거래처',payK&&'결제'].filter(Boolean).join(' / ')||'없음'}</span>
    </div>`;
    if(!dateK || !amtK){
        html += `<div class="xlGuide" style="background:#fee2e2;border-left-color:#dc2626;color:#991b1b">⚠️ <b>필수 컬럼이 누락되었습니다:</b> ${!dateK?'<code>날짜</code>':''} ${!amtK?'<code>금액</code>':''} — 양식 안내를 확인하세요.</div>`;
    }
    html += `<table class="xlPreview"><thead><tr>
        <th>행</th><th>날짜</th><th>카테고리</th><th>금액</th><th>내역</th><th>거래처</th><th>결제</th><th>비고</th>
    </tr></thead><tbody>`;
    parsed.forEach(p => {
        const cls = p.errors.length ? 'bad' : '';
        html += `<tr class="${cls}">
            <td>${p.rowIdx}</td>
            <td>${p.date||'<span style=\"color:#dc2626\">-</span>'}</td>
            <td>${p.category}</td>
            <td style="text-align:right">${p.amount.toLocaleString('ko-KR')}</td>
            <td>${(p.note||'').slice(0,40)}</td>
            <td>${(p.vendor||'').slice(0,20)}</td>
            <td>${p.paidBy}</td>
            <td style="font-size:11px;color:${p.errors.length?'#991b1b':'#10b981'}">${p.errors.length?p.errors.join(', '):'OK'}</td>
        </tr>`;
    });
    html += `</tbody></table>`;

    document.getElementById('xlModalTitle').textContent = '📊 지출 엑셀 업로드 미리보기';
    document.getElementById('xlModalBody').innerHTML = html;
    const btn = document.getElementById('xlConfirmBtn');
    btn.style.display = '';
    btn.disabled = okN === 0;
    btn.textContent = okN === 0 ? '✗ 적용할 행 없음' : `✓ ${okN}건 일괄 추가`;
    document.getElementById('xlUploadModal').classList.add('show');
}

function xlConfirmImport(){
    const ok = (window._xlParsedRows||[]).filter(p => p.errors.length===0);
    if(!ok.length){ alert('적용할 정상 행이 없습니다.'); return; }
    if(window._xlMode === 'expense'){
        if(!confirm(`${ok.length}건의 지출 내역을 추가합니다. 계속하시겠습니까?`)) return;
        const expenses = loadExpenses();
        const baseTs = Date.now();
        ok.forEach((p, i) => {
            expenses.push({
                id: 'e_' + (baseTs+i) + '_' + Math.random().toString(36).slice(2,6),
                date: p.date,
                category: p.category || '기타',
                amount: p.amount,
                note: p.note || '',
                vendor: p.vendor || '',
                paidBy: p.paidBy || '카드',
                createdAt: new Date().toISOString(),
                source: 'excel'
            });
        });
        saveExpenses(expenses);
        closeXlModal();
        renderExpensePanel();
        alert(`✓ ${ok.length}건의 지출 내역이 추가되었습니다.`);
    } else if(window._xlMode === 'elec'){
        if(!confirm(`${ok.length}건의 전기세 데이터를 호실·월별로 저장합니다. 기존 값은 덮어씁니다. 계속하시겠습니까?`)) return;
        const ov = deLoadOverrides();
        ok.forEach(p => {
            if(!ov[p.room]) ov[p.room] = {payments:{}, elec:{}};
            if(!ov[p.room].elec) ov[p.room].elec = {};
            if(!ov[p.room].elec[p.month]) ov[p.room].elec[p.month] = {};
            const cell = ov[p.room].elec[p.month];
            cell.bill = p.bill;
            if(p.name) cell.name = p.name;
            if(p.paidAmount !== null && p.paidAmount !== undefined) cell.paidAmount = p.paidAmount;
            if(p.received) cell.received = p.received.replace(/-/g,'.');
        });
        deSaveOverrides(ov);
        closeXlModal();
        alert(`✓ ${ok.length}건의 전기세 데이터가 저장되었습니다. 페이지를 새로고침합니다.`);
        location.reload();
    }
}

function msgBuildContext(room, tenant, monthKey){
    const mk = monthKey || (RENT_MONTHS && RENT_MONTHS.length ? RENT_MONTHS[RENT_MONTHS.length-1] : '');
    const monthKR = mk ? `${mk.slice(0,4)}년 ${parseInt(mk.slice(5,7),10)}월` : '';
    const rent = tenant.rent || 0;
    const mgmt = (tenant.mgmtNum === 'N/A' || tenant.mgmtNum===null||tenant.mgmtNum===undefined) ? 0 : (Number(tenant.mgmtNum)||0);
    const parking = Number(tenant.parkingNum)||0;
    const amount = tenant.monthlyTotal || (rent+mgmt+parking) || 0;
    let unpaid = 0;
    if(tenant.payments && tenant.payments[mk]){
        const p = tenant.payments[mk];
        if(!p.rentPaid) unpaid += rent;
        if(!p.mgmtPaid && mgmt) unpaid += mgmt;
        if(!p.parkingPaid && parking) unpaid += parking;
    } else { unpaid = amount; }
    let elecBill = 0, elecPaid = 0, elecUnpaid = 0;
    if(room.elec && room.elec[mk]){
        elecBill = Number(room.elec[mk].bill)||0;
        elecPaid = (room.elec[mk].paidAmount!==null&&room.elec[mk].paidAmount!==undefined) ? Number(room.elec[mk].paidAmount)||0 : (room.elec[mk].received ? elecBill : 0);
        elecUnpaid = Math.max(0, elecBill - elecPaid);
    }
    return {
        name: tenant.tenant || '',
        room: room.room,
        phone: tenant.phone || '',
        rent, mgmt, parking, amount,
        monthKey: mk, monthKR,
        elecBill, elecPaid, elecUnpaid,
        unpaid
    };
}

// 미납자 추출 (고정비 또는 전기세 미납)
function msgFindUnpaid(monthKey, mode){
    // mode: 'rent' | 'elec' | 'both'
    const mk = monthKey;
    const out = [];
    ROOMS.forEach(r => {
        const t = currentTenant(r);
        if(!t || t.isPast) return;
        const cs = t.contractStart;
        if(cs){
            const csKey = cs.replace(/\./g,'-').slice(0,7);
            if(mk < csKey) return;
        }
        const ctx = msgBuildContext(r, t, mk);
        const rentBad = ctx.unpaid > 0;
        const elecBad = ctx.elecUnpaid > 0;
        if(mode==='rent' && rentBad) out.push({room:r, tenant:t, ctx});
        else if(mode==='elec' && elecBad) out.push({room:r, tenant:t, ctx});
        else if(mode==='both' && (rentBad||elecBad)) out.push({room:r, tenant:t, ctx});
    });
    return out;
}

function msgAllActive(monthKey){
    const out = [];
    ROOMS.forEach(r => {
        const t = currentTenant(r);
        if(!t || t.isPast) return;
        out.push({room:r, tenant:t, ctx: msgBuildContext(r, t, monthKey)});
    });
    return out;
}

// 발송 액션
function msgMakeSmsLink(phone, body){
    if(!phone) return null;
    const cleaned = String(phone).replace(/[^0-9+]/g,'');
    return 'sms:' + cleaned + '?body=' + encodeURIComponent(body);
}
function msgCopyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text);
    }
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(_){}
    document.body.removeChild(ta);
    return Promise.resolve();
}
function msgRecord(entry){
    const h = msgLoadHist();
    h.push({...entry, ts: new Date().toISOString()});
    msgSaveHist(h);
}

function msgToggleRoom(roomKey){
    if(!window._msgSelectedRooms) window._msgSelectedRooms = new Set();
    if(window._msgSelectedRooms.has(roomKey)) window._msgSelectedRooms.delete(roomKey);
    else window._msgSelectedRooms.add(roomKey);
    msgRender();
}

function msgSelectAll(mode){
    if(!window._msgSelectedRooms) window._msgSelectedRooms = new Set();
    window._msgSelectedRooms.clear();
    if(mode==='none'){ msgRender(); return; }
    const mk = window._msgSelectedMonth || (RENT_MONTHS && RENT_MONTHS.length ? RENT_MONTHS[RENT_MONTHS.length-1] : '');
    ROOMS.forEach(r => {
        const t = currentTenant(r);
        if(!t || t.isPast) return;
        if(mode==='all'){
            window._msgSelectedRooms.add(r.room);
        } else if(mode==='unpaid'){
            const ctx = msgBuildContext(r, t, mk);
            if(ctx.unpaid > 0 || ctx.elecUnpaid > 0) window._msgSelectedRooms.add(r.room);
        }
    });
    msgRender();
}

function msgUpdateSinglePreview(){
    const selected = window._msgSelectedRooms || new Set();
    const mk = document.getElementById('msgSingleMonth')?.value || window._msgSelectedMonth;
    const body = document.getElementById('msgSingleBody')?.value || '';
    const ch2 = document.getElementById('msgSingleChar');
    if(ch2) ch2.textContent = `${body.length}자`;
    const previewEl = document.getElementById('msgSinglePreview');
    if(!previewEl) return;
    if(selected.size === 0){
        previewEl.textContent = '방을 선택하세요.';
        const ch = document.getElementById('msgSinglePrevChar'); if(ch) ch.textContent='';
        return;
    }
    const firstRoomKey = [...selected][0];
    const r = ROOMS.find(x => x.room === firstRoomKey);
    if(!r){ previewEl.textContent = '선택한 방 정보를 찾을 수 없음.'; return; }
    const t = currentTenant(r);
    if(!t){ previewEl.textContent = '(공실)'; return; }
    const ctx = msgBuildContext(r, t, mk);
    const rendered = msgRenderTemplate(body, ctx);
    let infoExtra = selected.size > 1 ? `\n\n(나머지 ${selected.size-1}명에게도 동일 양식으로 발송)` : '';
    previewEl.textContent = rendered + (t.phone?`\n\n→ ${r.room}호 ${t.tenant} · ${t.phone}`:`\n\n⚠️ ${r.room}호 ${t.tenant} 연락처 없음`) + infoExtra;
    const ch = document.getElementById('msgSinglePrevChar');
    if(ch){ const len = rendered.length; ch.textContent = `미리보기 ${len}자` + (len>90?' (LMS, 90자 초과 시 장문)':''); ch.classList.toggle('warn', len>90); }
}

// 선택된 여러 방으로 발송
function msgSendSelected(action){
    const selected = window._msgSelectedRooms || new Set();
    if(selected.size === 0){ alert('방을 1개 이상 선택하세요.'); return; }
    const mk = document.getElementById('msgSingleMonth')?.value || window._msgSelectedMonth;
    const body = document.getElementById('msgSingleBody')?.value || '';
    if(!body.trim() && action !== 'phone'){ alert('메시지 본문이 비어있습니다.'); return; }
    const recipients = [];
    [...selected].forEach(roomKey => {
        const r = ROOMS.find(x => x.room === roomKey); if(!r) return;
        const t = currentTenant(r); if(!t) return;
        const ctx = msgBuildContext(r, t, mk);
        const rendered = msgRenderTemplate(body, ctx);
        recipients.push({room:r.room, tenant:t, rendered, ctx});
    });
    if(recipients.length === 0){ alert('발송 가능한 대상이 없습니다.'); return; }
    if(action==='sms'){
        if(recipients.length === 1){
            const rc = recipients[0];
            if(!rc.tenant.phone){ alert(`${rc.room}호 ${rc.tenant.tenant}: 연락처가 없어 SMS를 열 수 없습니다.`); return; }
            msgShowSendModal({phone:rc.tenant.phone, name:rc.tenant.tenant, room:rc.room, body:rc.rendered, mk});
            msgRecord({to:rc.tenant.phone, name:rc.tenant.tenant, room:rc.room, body:rc.rendered, source:'manual', method:'sms'});
        } else {
            msgShowMultiSendModal(recipients);
            recipients.forEach(rc => { if(rc.tenant.phone) msgRecord({to:rc.tenant.phone, name:rc.tenant.tenant, room:rc.room, body:rc.rendered, source:'manual', method:'sms'}); });
        }
    } else if(action==='copy'){
        const text = recipients.map(rc => `[${rc.room}호 ${rc.tenant.tenant} · ${rc.tenant.phone||'번호없음'}]\n${rc.rendered}`).join('\n\n---\n\n');
        msgCopyToClipboard(text).then(()=>{
            recipients.forEach(rc => msgRecord({to:rc.tenant.phone||'', name:rc.tenant.tenant, room:rc.room, body:rc.rendered, source:'manual', method:'copy'}));
            alert(`✓ ${recipients.length}명의 메시지가 클립보드에 복사되었습니다.`);
        });
    } else if(action==='phone'){
        const phones = recipients.filter(rc=>rc.tenant.phone).map(rc=>rc.tenant.phone);
        if(phones.length===0){ alert('연락처가 있는 대상이 없습니다.'); return; }
        msgCopyToClipboard(phones.join('\n')).then(()=>alert(`✓ ${phones.length}개 번호 복사됨\n(${phones.length<recipients.length?`${recipients.length-phones.length}명은 번호 없음`:'전원'})`));
    } else if(action==='mark'){
        recipients.forEach(rc => msgRecord({to:rc.tenant.phone||'', name:rc.tenant.tenant, room:rc.room, body:rc.rendered, source:'manual', method:'mark'}));
        alert(`✓ ${recipients.length}명의 발송 기록이 추가되었습니다.`);
        msgRender();
    }
}

        return `

function msgApplySingleTpl(){
    const tplId = document.getElementById('msgSingleTpl').value;
    const tpls = msgLoadTpls();

function msgInsertVar(inputId, key){
    const ta = document.getElementById(inputId);
    if(!ta) return;
    const start = ta.selectionStart||0, end = ta.selectionEnd||0;
    ta.value = ta.value.slice(0,start) + key + ta.value.slice(end);
    ta.focus(); ta.setSelectionRange(start+key.length, start+key.length);
    if(inputId==='msgSingleBody') msgUpdateSinglePreview();
    else if(inputId==='msgBulkBody') msgUpdateBulkPreview();
    else if(inputId==='msgTplBody'){}
}

function msgSendSingle(action){
    const roomKey = document.getElementById('msgSingleRoom')?.value;
    const mk = document.getElementById('msgSingleMonth')?.value;
    const body = document.getElementById('msgSingleBody')?.value || '';
    const r = ROOMS.find(x => x.room === roomKey); if(!r){ alert('대상자를 선택하세요'); return; }
    const t = currentTenant(r); if(!t){ alert('현재 공실입니다'); return; }
    if(!body.trim()){ alert('메시지 본문이 비어있습니다.\n템플릿을 선택하거나 본문을 입력하세요.'); return; }
    const ctx = msgBuildContext(r, t, mk);
    const rendered = msgRenderTemplate(body, ctx);
    if(action==='sms'){
        if(!t.phone){ alert('연락처가 없어 SMS 앱을 열 수 없습니다.'); return; }
        // 데스크탑은 sms: 핸들러가 없을 수 있으므로 시도와 함께 모달을 보여줌
        msgShowSendModal({phone:t.phone, name:t.tenant, room:r.room, body:rendered, mk:mk});
        msgRecord({to:t.phone, name:t.tenant, room:r.room, body:rendered, source:'manual', method:'sms'});
    } else if(action==='copy'){
        msgCopyToClipboard(rendered).then(()=>{
            msgRecord({to:t.phone||'', name:t.tenant, room:r.room, body:rendered, source:'manual', method:'copy'});
            alert('✓ 메시지가 클립보드에 복사되었습니다.\n\n붙여넣을 곳:\n· 카카오톡 / 네이버 메시지 / SMS 앱\n· 알림톡·문자 발송 도구');
        });
    } else if(action==='phone'){
        if(!t.phone){ alert('연락처가 없습니다'); return; }
        msgCopyToClipboard(t.phone).then(()=>alert(`✓ 번호 복사됨: ${t.phone}`));
    } else if(action==='mark'){
        msgRecord({to:t.phone||'', name:t.tenant, room:r.room, body:rendered, source:'manual', method:'mark'});
        alert('✓ 발송 기록만 추가되었습니다 (실제 메시지는 다른 방법으로 발송하세요).');
    }
}

function msgRenderBulk(){
    const filters = window._msgBulkFilters || { target:'unpaid_both', month: (RENT_MONTHS&&RENT_MONTHS.length?RENT_MONTHS[RENT_MONTHS.length-1]:'') };
    window._msgBulkFilters = filters;
    const tpls = msgLoadTpls();
    const tplOpts = tpls.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    const monthOpts = [...RENT_MONTHS].reverse().map(m => `<option value="${m}" ${filters.month===m?'selected':''}>${m.slice(0,4)}년 ${parseInt(m.slice(5,7),10)}월</option>`).join('');

    let html = `<div class="msgFilter">
        <label>대상 <select id="msgBulkTarget" onchange="msgBulkChanged()">
            <option value="all" ${filters.target==='all'?'selected':''}>👥 현재 입주자 전체</option>
            <option value="unpaid_rent" ${filters.target==='unpaid_rent'?'selected':''}>💰 고정비 미납자</option>
            <option value="unpaid_elec" ${filters.target==='unpaid_elec'?'selected':''}>⚡ 전기세 미납자</option>
            <option value="unpaid_both" ${filters.target==='unpaid_both'?'selected':''}>❗ 미납자(고정비 또는 전기)</option>
            <option value="queue" ${filters.target==='queue'?'selected':''}>📨 자동발송 대기 큐 (${msgLoadQueue().length}건)</option>
        </select></label>
        <label>대상월 <select id="msgBulkMonth" onchange="msgBulkChanged()">${monthOpts}</select></label>
        <label>템플릿 <select id="msgBulkTpl" onchange="msgApplyBulkTpl()">${tplOpts}</select></label>
        <span style="flex:1 1 auto"></span>
        <button class="msgBtn ghost" onclick="msgBulkChanged()">🔄 새로고침</button>
    </div>`;

    if(window._msgBulkSource === 'queue'){
        document.getElementById && setTimeout(()=>{
            const sel = document.getElementById('msgBulkTarget'); if(sel){ sel.value = 'queue'; }
            window._msgBulkFilters.target = 'queue';
            window._msgBulkSource = null;
            msgBulkChanged();
        }, 50);
    }

    html += `<div class="msgRow" style="margin-top:14px">
        <div>
            <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:5px">메시지 본문</div>
            <textarea id="msgBulkBody" class="msgTextarea" oninput="msgUpdateBulkPreview()" style="min-height:140px"></textarea>
            <div class="msgVarHint" style="margin-top:5px">변수:
                ${MSG_VARIABLES.map(v => `<code onclick="msgInsertVar('msgBulkBody','${v.key.replace(/'/g,"&apos;")}')" title="${v.desc}">${v.key}</code>`).join('')}
            </div>
        </div>
        <div>
            <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:5px">📨 첫 대상자 미리보기 (실제 발송 시 각자별 치환)</div>
            <div class="msgPreviewBox" id="msgBulkPreview">대상자가 없거나 템플릿이 비어 있습니다.</div>
        </div>
    </div>`;

    html += `<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center">
        <span id="msgBulkCount" style="font-weight:800;color:#0e7490">대상 0명</span>
        <span style="flex:1 1 auto"></span>
        <button class="msgBtn primary" onclick="msgBulkSend('sms_seq')" title="SMS 앱을 한 명씩 차례로 엽니다 (각 대상자마다 확인 필요)">📲 SMS 순차 열기</button>
        <button class="msgBtn outline" onclick="msgBulkSend('copy_all')">📋 전체 복사 (구분자: 빈 줄)</button>
        <button class="msgBtn outline" onclick="msgBulkSend('download')">⬇️ TXT/CSV 다운로드</button>
        <button class="msgBtn ghost" onclick="msgBulkSend('mark_all')">✓ 전체 발송 기록만</button>
    </div>`;

    html += `<div id="msgBulkList"></div>`;
    html += `<div class="msgCard amber" style="margin-top:14px;font-size:12px">
        💡 <b>SMS 순차 열기</b>: 데스크탑/모바일 모두 작동하지만, 각 메시지마다 SMS 앱이 열리고 사용자가 [전송] 버튼을 직접 눌러야 합니다(브라우저 보안 정책). 진정한 무인 자동 발송이 필요하면 외부 SMS API(Aligo·NCP·KT Bizmessage 등)와 연동해야 합니다 — 도움말 참조.
    </div>`;
    return html;
}

function msgApplyBulkTpl(){
    const tplId = document.getElementById('msgBulkTpl')?.value;
    const tpls = msgLoadTpls();
    const t = tpls.find(x => x.id === tplId);

function msgBulkChanged(){
    window._msgBulkFilters.target = document.getElementById('msgBulkTarget').value;
    window._msgBulkFilters.month = document.getElementById('msgBulkMonth').value;
    msgUpdateBulkPreview();
}
function _msgBulkRecipients(){
    const f = window._msgBulkFilters;
    if(f.target==='queue') return msgLoadQueue();
    if(f.target==='all') return msgAllActive(f.month);
    if(f.target==='unpaid_rent') return msgFindUnpaid(f.month, 'rent');
    if(f.target==='unpaid_elec') return msgFindUnpaid(f.month, 'elec');
    return msgFindUnpaid(f.month, 'both');
}
function msgUpdateBulkPreview(){
    const recips = _msgBulkRecipients();
    const body = document.getElementById('msgBulkBody')?.value || '';
    const cntEl = document.getElementById('msgBulkCount');
    if(cntEl) cntEl.textContent = `대상 ${recips.length}명`;
    const prev = document.getElementById('msgBulkPreview');
    if(recips.length === 0){
        if(prev) prev.textContent = '대상자가 없습니다.';
    } else {
        const r = recips[0];
        const ctx = r.ctx || msgBuildContext(r.room, r.tenant, window._msgBulkFilters.month);
        const rendered = msgRenderTemplate(body, ctx);
        if(prev) prev.textContent = rendered + `\n\n→ ${ctx.name} (${ctx.room}호) ${ctx.phone||'연락처없음'}`;
    }
    // 리스트
    const listEl = document.getElementById('msgBulkList');
    if(!listEl) return;
    if(recips.length === 0){
        listEl.innerHTML = `<div class="msgEmpty" style="margin-top:14px">대상자가 없습니다. 필터를 바꿔보세요.</div>`;
        return;
    }
    let h = `<table class="msgTable" style="margin-top:14px"><thead><tr>
        <th style="width:40px">#</th><th>호실</th><th>이름</th><th>연락처</th>
        <th class="num">미납·금액</th><th>메시지 (치환)</th></tr></thead><tbody>`;
    recips.forEach((r, i) => {
        const ctx = r.ctx || msgBuildContext(r.room, r.tenant, window._msgBulkFilters.month);
        const rendered = msgRenderTemplate(body, ctx);
        const phoneCls = ctx.phone ? '' : 'disabled';
        h += `<tr class="${phoneCls}">
            <td>${i+1}</td>
            <td><b>${ctx.room}</b></td>
            <td>${ctx.name}</td>
            <td>${ctx.phone||'<span style="color:#dc2626">없음</span>'}</td>
            <td class="num">${(ctx.unpaid+ctx.elecUnpaid).toLocaleString('ko-KR')}</td>
            <td style="font-size:11px;line-height:1.5;color:#475569;max-width:480px">${rendered.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</td>
        </tr>`;
    });
    h += `</tbody></table>`;
    listEl.innerHTML = h;
}
function msgBulkSend(action){
    const recips = _msgBulkRecipients();
    const body = document.getElementById('msgBulkBody').value || '';
    if(!recips.length){ alert('대상자가 없습니다'); return; }
    const items = recips.map(r => {
        const ctx = r.ctx || msgBuildContext(r.room, r.tenant, window._msgBulkFilters.month);
        return { ctx, rendered: msgRenderTemplate(body, ctx) };
    });
    if(action==='sms_seq'){
        const withPhone = items.filter(x => x.ctx.phone);
        if(!withPhone.length){ alert('연락처가 있는 대상자가 없습니다'); return; }
        if(!confirm(`${withPhone.length}명에게 SMS 앱을 순차 열기 합니다. 각 메시지마다 [전송]을 직접 눌러야 합니다. 진행할까요?`)) return;
        let i = 0;
        const next = () => {
            if(i >= withPhone.length){
                alert(`✓ ${withPhone.length}건 모두 SMS 앱 호출 완료. 실제 발송은 SMS 앱에서 [전송] 버튼으로 마무리하세요.`);
                if(window._msgBulkFilters.target==='queue') msgClearQueue();
                msgRender();
                return;
            }
            const it = withPhone[i++];
            window.location.href = msgMakeSmsLink(it.ctx.phone, it.rendered);
            msgRecord({to:it.ctx.phone, name:it.ctx.name, room:it.ctx.room, body:it.rendered, source: window._msgBulkFilters.target==='queue'?'auto':'bulk', method:'sms'});
            setTimeout(next, 1500);
        };
        next();
    } else if(action==='copy_all'){
        const text = items.map(x => `▣ ${x.ctx.room}호 ${x.ctx.name} (${x.ctx.phone||'-'})\n${x.rendered}`).join('\n\n────────\n\n');
        msgCopyToClipboard(text).then(()=>{
            items.forEach(it => msgRecord({to:it.ctx.phone||'', name:it.ctx.name, room:it.ctx.room, body:it.rendered, source: window._msgBulkFilters.target==='queue'?'auto':'bulk', method:'copy'}));
            if(window._msgBulkFilters.target==='queue') msgClearQueue();
            alert(`✓ ${items.length}건 클립보드 복사 완료. 카카오톡·메일·메모장에 붙여넣어 사용하세요.`);
            msgRender();
        });
    } else if(action==='download'){
        // CSV: 호실,이름,연락처,메시지
        const rows = [['호실','이름','연락처','메시지']];
        items.forEach(it => rows.push([it.ctx.room, it.ctx.name, it.ctx.phone||'', it.rendered.replace(/\n/g,' / ')]));
        const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
        const now = new Date(); const pad = n => String(n).padStart(2,'0');
        const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `청화Regent_문자발송리스트_${stamp}.csv`;
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
        items.forEach(it => msgRecord({to:it.ctx.phone||'', name:it.ctx.name, room:it.ctx.room, body:it.rendered, source: window._msgBulkFilters.target==='queue'?'auto':'bulk', method:'download'}));
        if(window._msgBulkFilters.target==='queue') msgClearQueue();
        alert(`✓ ${items.length}건 CSV 다운로드 완료. 알림톡·문자 발송 도구에 업로드하면 됩니다.`);
        msgRender();
    } else if(action==='mark_all'){
        if(!confirm(`${items.length}건의 발송 기록만 추가합니다 (실제 메시지는 따로 보내야 합니다). 진행할까요?`)) return;

        if(window._msgBulkFilters.target==='queue') msgClearQueue();
        alert(`✓ ${items.length}건 발송 기록 추가 완료`);
        msgRender();
    }

function msgRunRule(id){
    const rules = msgLoadRules();
    const r = rules.find(x => x.id===id); if(!r) return;
    const added = _msgExecuteRule(r, true);
    r.lastRun = new Date().toISOString();
    msgSaveRules(rules);
    alert(`✓ 룰 "${r.name}" 실행: ${added}건이 발송 대기 큐에 추가되었습니다.`);
    msgRender();
}
function _msgExecuteRule(r, force){
    const tpls = msgLoadTpls();
    const tpl = tpls.find(t => t.id===r.templateId);
    if(!tpl) return 0;
    const mk = (RENT_MONTHS && RENT_MONTHS.length) ? RENT_MONTHS[RENT_MONTHS.length-1] : '';
    let recips = [];
    if(r.target==='all') recips = msgAllActive(mk);
    else if(r.target==='unpaid_rent') recips = msgFindUnpaid(mk, 'rent');
    else if(r.target==='unpaid_elec') recips = msgFindUnpaid(mk, 'elec');
    else recips = msgFindUnpaid(mk, 'both');
    if(!recips.length) return 0;
    const queue = msgLoadQueue();
    let added = 0;
    recips.forEach(rec => {
        const ctx = rec.ctx;
        // 이미 같은 룰+호실+월로 큐에 있으면 중복 방지
        const dup = queue.some(q => q.ruleId===r.id && q.ctx && q.ctx.room===ctx.room && q.ctx.monthKey===ctx.monthKey);
        if(dup) return;
        queue.push({
            id: 'q_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
            ruleId: r.id,
            ruleName: r.name,
            templateId: r.templateId,
            ctx: ctx,
            tenant: rec.tenant,
            room: rec.room,
            createdAt: new Date().toISOString()
        });
        added++;
    });
    msgSaveQueue(queue);
    return added;
}
// 자동 스케줄러 (페이지 열려있는 동안 동작)
function msgSchedulerTick(){
    const rules = msgLoadRules().filter(r => r.enabled);
    if(!rules.length) return;
    const now = new Date();
    let didAny = false;
    rules.forEach(r => {
        const lastRun = r.lastRun ? new Date(r.lastRun) : null;
        let shouldFire = false;
        if(r.scheduleType==='monthly'){
            // 오늘이 지정 일자(또는 그 이후 첫 접속)이고 lastRun이 이번 달이 아니면 발사
            const today = now.getDate();
            if(today >= r.scheduleDay){
                if(!lastRun || lastRun.getMonth()!==now.getMonth() || lastRun.getFullYear()!==now.getFullYear()){
                    shouldFire = true;
                }
            }
        } else if(r.scheduleType==='weekly'){
            // 오늘이 지정 요일이고 lastRun이 같은 주가 아니면 발사
            if(now.getDay() === r.scheduleDay){
                if(!lastRun){ shouldFire = true; }
                else {
                    const diff = (now - lastRun) / (1000*60*60*24);
                    if(diff >= 1) shouldFire = true;
                }
            }
        }
        if(shouldFire){
            const added = _msgExecuteRule(r, false);
            r.lastRun = now.toISOString();
            didAny = true;
            console.log(`[자동발송] 룰 "${r.name}" 실행 — ${added}건 큐 추가`);
        }
    });
    if(didAny){
        msgSaveRules(rules);
        msgUpdateQueueBadge();
    }
}

    const hist = msgLoadHist().slice().reverse();
    let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0">
        <h3 style="margin:0;font-size:15px;color:#0e7490">📜 발송 이력 (${hist.length}건, 최근 2000건 보관)</h3>
        <div style="display:flex;gap:6px">
            <button class="msgBtn outline" onclick="msgExportHistCsv()">📥 CSV 다운로드</button>
            <button class="msgBtn danger" onclick="msgClearHist()">🗑 전체 삭제</button>
        </div>
    </div>`;
    if(!hist.length){
        h += `<div class="msgEmpty">발송 이력이 없습니다.</div>`;
    } else {
        h += `<table class="msgTable"><thead><tr>
            <th style="width:140px">발송시각</th><th>호실</th><th>이름</th><th>연락처</th>
            <th>경로</th><th>유형</th><th>메시지</th></tr></thead><tbody>`;
        hist.forEach(e => {
            const ts = new Date(e.ts);
            const tstr = isNaN(ts.getTime()) ? '-' : ts.toLocaleString('ko-KR', {hour12:false});
            const sourceLbl = e.source==='auto'?'<span style="color:#0e7490;font-weight:700">자동</span>' : e.source==='bulk'?'<span style="color:#7c3aed;font-weight:700">일괄</span>' : '<span style="color:#475569;font-weight:700">개별</span>';
            const methodLbl = {sms:'📲 SMS',copy:'📋 복사',download:'⬇️ DL',mark:'✓ 기록',phone:'📞 번호'}[e.method] || e.method||'-';
            h += `<tr>
                <td style="font-size:11px;color:#475569;font-variant-numeric:tabular-nums">${tstr}</td>
                <td><b>${e.room||'-'}</b></td>
                <td>${e.name||'-'}</td>
                <td style="font-size:11px">${e.to||'-'}</td>
                <td>${sourceLbl}</td>
                <td style="font-size:11px">${methodLbl}</td>
                <td style="font-size:11px;color:#475569;max-width:480px;line-height:1.4">${(e.body||'').replace(/</g,'&lt;').replace(/\n/g,' / ').slice(0,140)}</td>
            </tr>`;
        });
        h += `</tbody></table>`;
    }
    return h;
}
function msgExportHistCsv(){
    const hist = msgLoadHist();
    if(!hist.length){ alert('이력이 없습니다'); return; }
    const rows = [['발송시각','호실','이름','연락처','발송경로','발송수단','메시지']];
    hist.forEach(e => rows.push([e.ts, e.room||'', e.name||'', e.to||'', e.source||'', e.method||'', (e.body||'').replace(/\n/g,' / ')]));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
    const now = new Date(); const pad = n => String(n).padStart(2,'0');
    const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);

}

// === B01호 입실자 데이터 원본 복원 (1회 cleanup - 입실자명 표시 문제 해결) ===
(function restoreB01Once(){
    const FLAG = 'restored_B01_v1';
    if(localStorage.getItem(FLAG) === 'done') return;
    try {
        // 1) overrides에서 B01의 _tenantReplacements 제거 (실수로 퇴실 처리된 경우 복원)
        const OV_KEY = 'cheonghwa_regent_overrides_v1';
        const ovRaw = localStorage.getItem(OV_KEY);
        if(ovRaw){
            const ov = JSON.parse(ovRaw);
            if(ov && ov['B01']){
                if(ov['B01']._tenantReplacements) delete ov['B01']._tenantReplacements;
                localStorage.setItem(OV_KEY, JSON.stringify(ov));
            }
        }
        // 2) tenant edits에서 B01 제거 (이름이 잘못 변경된 경우 복원)
        const ED_KEY = 'cheonghwa_regent_tenant_edits_v1';
        const edRaw = localStorage.getItem(ED_KEY);
        if(edRaw){
            const ed = JSON.parse(edRaw);
            if(ed && ed['B01']){
                delete ed['B01'];
                localStorage.setItem(ED_KEY, JSON.stringify(ed));
            }
        }
        // 3) ROOMS 메모리에서 B01의 모든 tenants를 isPast:false로 복원
        if(typeof ROOMS !== 'undefined'){
            const rB01 = ROOMS.find(x => String(x.room) === 'B01');
            if(rB01 && Array.isArray(rB01.tenants)){
                rB01.tenants.forEach(t => { t.isPast = false; });
            }
        }
        localStorage.setItem(FLAG, 'done');
        console.log('B01 입실자 데이터 원본 복원 완료 (푸엉타오(外) 표시 정상화)');
    } catch(e){ console.error('B01 restore error', e); }
})();

function saveTenantEdit(roomKey, origName){
    const get = id => (document.getElementById(id) || {}).value || '';
    const getN = id => Number(get(id)) || 0;
    const edits = {
        tenant: get('teName').trim(),
        gender: get('teGender'),
        phone: get('tePhone').trim(),
        emergency: get('teEmergency').trim(),
        contractStart: get('teContractStart').trim(),
        contractEnd: get('teContractEnd').trim(),
        moveOutDate: get('teMoveOutDate').trim(),
        deposit: getN('teDeposit'),
        rent: getN('teRent'),
        mgmtNum: getN('teMgmt'),
        parkingNum: getN('tePark'),
        baseNote: get('teNote').trim()
    };
    edits.monthlyTotal = edits.rent + edits.mgmtNum + edits.parkingNum;
    if(!edits.tenant){ alert('입주자 이름은 필수입니다'); return; }
    const all = loadTenantEdits();
    if(!all[roomKey]) all[roomKey] = {};
    all[roomKey][origName] = edits;
    saveTenantEdits(all);
    closeTenantEdit();
    // 무조건 페이지 리로드 - 모든 시점/상태 이슈 우회 (가장 확실한 방법)
    var moveOutMsg = edits.moveOutDate ? '\n• 실제 퇴실일: ' + edits.moveOutDate : '';
    alert('✓ ' + roomKey + '호 저장 완료\n\n• 관리비: ' + (edits.mgmtNum||0).toLocaleString() + '원\n• 주차비: ' + (edits.parkingNum||0).toLocaleString() + '원\n• 월 합계: ' + (edits.monthlyTotal||0).toLocaleString() + '원' + moveOutMsg + '\n\n페이지를 새로고침하여 반영합니다.');
    location.reload();
}

// 메모리 ROOMS에 tenant edits 적용
function applyTenantEditsToRooms(){
    const all = loadTenantEdits();
    let appliedCount = 0;
    Object.entries(all).forEach(([roomKey, byName]) => {
        const r = ROOMS.find(x => x.room === roomKey);
        if(!r) return;
        Object.entries(byName).forEach(([origName, edits]) => {
            // 1차: 같은 이름 - 현재 입주자 우선 (isPast=false), 없으면 퇴실자 매칭
            let t = r.tenants && r.tenants.find(tt => tt.tenant === origName && !tt.isPast);
            if(!t) t = r.tenants && r.tenants.find(tt => tt.tenant === origName && tt.isPast);
            // 2차: 새 이름으로 매칭 (이름 변경됐을 경우) - isPast 무관
            if(!t && edits.tenant && edits.tenant !== origName){
                t = r.tenants && r.tenants.find(tt => tt.tenant === edits.tenant && !tt.isPast);
                if(!t) t = r.tenants && r.tenants.find(tt => tt.tenant === edits.tenant && tt.isPast);
            }
            // ❌ fallback 제거 - 잘못된 입주자에 데이터가 흘러가는 것 방지
            if(!t){
                console.warn('[tenant edits] 매칭 실패 - skip:', roomKey, origName);
                return;
            }
            Object.entries(edits).forEach(([k, v]) => {
                if(v === undefined) return;
                // moveOutDate는 빈 문자열도 의도적 클리어로 인정 (퇴실 취소 케이스)
                if(typeof v === 'string' && v === '' && k !== 'moveOutDate') return;
                t[k] = v;
                appliedCount++;
            });
            // monthlyTotal 강제 재계산 (mgmtNum/parkingNum 변경 시 즉시 반영)
            t.monthlyTotal = (Number(t.rent)||0) + (Number(t.mgmtNum)||0) + (Number(t.parkingNum)||0);
            // 이름 변경 시 origName 키 업데이트
            if(edits.tenant && edits.tenant !== origName){
                delete byName[origName];
                byName[edits.tenant] = edits;
                saveTenantEdits(all);
            }
        });
    });
    if(appliedCount > 0){
        console.log('[tenant edits] '+appliedCount+'개 필드 적용됨');
    }
}

window.addEventListener('DOMContentLoaded', function(){

function gtmToggleMgmt(ev){
    try {
        if(ev) ev.stopPropagation();
        var dd = document.getElementById('gtmMgmtDropdown');
        if(!dd){ alert('백업관리 드롭다운 요소 없음 (gtmMgmtDropdown)'); return; }
        var btn = ev && ev.currentTarget;
        // 위치 강제 설정 (fixed + z-index 최상)
        if(btn){
            var rect = btn.getBoundingClientRect();
            dd.style.position = 'fixed';
            dd.style.left = Math.max(8, rect.right - 240) + 'px';
            dd.style.top = (rect.bottom + 6) + 'px';
            dd.style.right = 'auto';
            dd.style.zIndex = '99999';
        }
        // 토글 - inline style 직접 사용
        var isOpen = dd.style.display === 'block';
        dd.style.display = isOpen ? 'none' : 'block';
        if(!isOpen) dd.classList.add('open'); else dd.classList.remove('open');
        var other = document.getElementById('gtmDropdown');
        if(other){ other.style.display = 'none'; other.classList.remove('open'); }
    } catch(err){
        alert('백업관리 에러: ' + err.message);
    }
}

}
