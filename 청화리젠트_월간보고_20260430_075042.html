<!doctype html>
<html lang="ko">
<head>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" as="style" href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@500;700&family=Jua&family=Black+Han+Sans&display=swap">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>청화(淸和) Regent 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;background:linear-gradient(135deg,#f8fafc,#f3f0ea);color:#172033;min-width:1400px;overflow-x:auto}
.wrap{max-width:1740px;min-width:1380px;margin:0 auto;padding:22px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:16px}
h1{font-size:34px;letter-spacing:-.04em;margin:0;font-weight:900}
.sub{color:#667085;margin-top:6px}
.headerClock{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 26px;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#3b82f6 100%);color:#fff;border-radius:14px;box-shadow:0 5px 16px rgba(37,99,235,.22);min-width:360px;justify-self:center;font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,"Courier New",monospace}
.headerClock .clockDate{font-size:18px;font-weight:700;letter-spacing:.02em;line-height:1.2;font-variant-numeric:tabular-nums;font-family:inherit}
.headerClock .clockTime{font-size:24px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.2);margin-top:3px;line-height:1.1;font-family:inherit}
.headerClock .clockLabel{font-size:10px;letter-spacing:.2em;opacity:.7;margin-top:4px;text-transform:uppercase;font-family:inherit}
.baselineCaption{display:flex;align-items:center;gap:10px;margin:8px 2px 0 2px;padding:8px 14px;background:linear-gradient(90deg,#eff6ff 0%,#dbeafe 100%);border-left:4px solid #2563eb;border-radius:8px;font-size:13px;color:#1e3a8a;font-weight:700}
.baselineCaption .bc-icon{font-size:16px}
.baselineCaption .bc-note{font-size:11px;color:#475569;font-weight:500;margin-left:auto}
button{border:1px solid #e5e7eb;background:white;padding:10px 14px;border-radius:14px;cursor:pointer;font-weight:800;font-family:inherit}
button:hover{background:#f1f5f9}

.roomCard.unpaid-highlight{border:2.5px solid #ef4444 !important;box-shadow:0 0 12px rgba(239,68,68,.3) !important;position:relative}
.roomCard.unpaid-highlight::after{content:attr(data-unpaid-label);position:absolute;top:-9px;right:4px;background:#ef4444;color:white;font-size:10px;padding:2px 7px;border-radius:9px;font-weight:900;z-index:5;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.roomCard.elec-unpaid-only{border:2.5px solid #dc2626 !important;box-shadow:0 0 12px rgba(220,38,38,.25) !important}
.unpaidTotalBox{margin-top:auto;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:5px 6px;font-size:9.5px;color:#1e293b;font-weight:800;display:flex;flex-direction:column;gap:2px}
.unpaidTotalBox.atBottom{margin-top:8px;padding-top:6px;border-top:2px solid #fecaca}
.unpaidTotalBox .unpaidRow{display:flex;justify-content:space-between;align-items:center;gap:3px}
.unpaidTotalBox .unpaidRow.total{border-top:1px dashed #fca5a5;padding-top:2px;margin-top:1px;font-size:11px;color:#7f1d1d}
.unpaidTotalBox .amt{font-variant-numeric:tabular-nums}
.roomCard.vacant{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 8px,#f1f5f9 8px,#f1f5f9 16px);border:1.5px dashed #cbd5e1}
.roomCard.vacant:hover{background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 8px,#e2e8f0 8px,#e2e8f0 16px);border-color:#94a3b8}
.roomCard.vacant .vacantBody{padding:14px 10px;text-align:center}
.roomCard.vacant .vacantPill{display:inline-block;padding:6px 14px;background:#e2e8f0;color:#475569;border-radius:999px;font-weight:800;font-size:13px;margin-bottom:8px}
.roomCard.vacant .vacantMeta{font-size:11.5px;color:#64748b;margin:6px 0;font-weight:600}
.roomCard.vacant .vacantHint{font-size:10.5px;color:#94a3b8;line-height:1.5;margin-top:10px;padding-top:8px;border-top:1px dashed #e2e8f0}
.roomCard.has-parking{border-left:4px solid #f59e0b}
.roomCard.has-history::before{content:'이력';position:absolute;top:-9px;left:4px;background:#94a3b8;color:white;font-size:9px;padding:1px 5px;border-radius:9px;font-weight:800;z-index:5;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.roomCard{position:relative}

.topStats{display:grid;grid-template-columns:minmax(0,4fr) minmax(340px,1fr);gap:14px;margin:15px 0;align-items:stretch}
.topStatsLeft{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(16,24,40,.04)}
.stat .label{font-size:13px;color:#667085}
.stat .value{font-size:24px;font-weight:900;margin-top:5px}
.stat.unpaidStat{background:linear-gradient(135deg,#ffedd5 0%,#fed7aa 100%);border:1px solid #fb923c;box-shadow:0 4px 14px rgba(251,146,60,.15)}
.stat.unpaidStat .label{color:#9a3412;font-weight:600}
.stat.unpaidStat .value{color:#c2410c}

.layout{display:grid;grid-template-columns:minmax(0,4fr) minmax(340px,1fr);gap:14px;align-items:start}
.search{width:100%;border:1px solid #e5e7eb;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-family:inherit;font-size:14px}
.floor{display:grid;grid-template-columns:56px minmax(0,1fr);background:white;border:1px solid #e5e7eb;border-radius:18px;overflow:visible;margin-bottom:10px;box-shadow:0 4px 14px rgba(16,24,40,.045)}
.floorLabel{background:#f1f5f9;border-right:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#334155}
.roomRow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:16px 10px 10px 10px}
.roomCardPad{visibility:hidden;pointer-events:none;min-height:1px}
.roomCard{width:auto;min-width:0;border:1px solid #e5e7eb;background:white;text-align:left;padding:9px;cursor:pointer;transition:.12s;border-radius:10px;overflow:visible;display:flex;flex-direction:column}
.roomCard:hover{background:#f8fafc;transform:translateY(-2px)}
.roomCard.selected{background:#eff6ff;outline:3px solid #93c5fd;outline-offset:-3px}
.roomNoLine{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:nowrap;width:100%}
.roomNo{font-size:16px;font-weight:900;flex-shrink:0}
.tenant{font-size:11px;color:#475569;margin-left:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.roomBadges{display:inline-flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0}
.badge{display:inline-block;font-size:9px;font-weight:900;padding:1px 5px;border-radius:999px}
.badge-f{background:#fce7f3;color:#9d174d}
.badge-m{background:#dbeafe;color:#1e40af}
.badge-park{background:#e2e8f0;color:#1e293b;font-size:8px}
.badge-hist{background:#f1f5f9;color:#64748b;font-size:8px}
.amountLine{margin-top:5px;display:flex;justify-content:space-between;gap:3px;font-size:10px;background:#f8fafc;padding:4px 6px;border-radius:6px;font-weight:800;color:#334155}
.amountLine.main{background:#e2e8f0;color:#1e293b;font-size:11px;padding:6px 7px}
.amountLine .amt{color:#0f172a;font-variant-numeric:tabular-nums}
.amountLine.main .amt{color:#78350f;font-size:12px}
.breakdown{font-size:9px;color:#64748b;margin-top:2px;padding:0 1px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recentPay{display:flex;gap:2px;margin-top:4px}
.recentPay .dot{flex:1;height:5px;border-radius:2px;background:#e5e7eb}
.recentPay .dot.paid{background:#22c55e}
.recentPay .dot.unpaid{background:#ef4444}
.recentPay .dot.na{background:#cbd5e1}

/* 전기세 막대: 월별 금액을 막대 높이로, 납부여부를 색으로 표시 */
.barSection{margin-top:6px;padding-top:5px;border-top:1px dashed #e5e7eb}
.barLabel{font-size:8px;font-weight:900;color:#64748b;display:flex;justify-content:space-between;margin-bottom:2px;gap:3px}
.barLabel .barMax{color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elecBars{display:flex;gap:1px;align-items:flex-end;height:26px;background:#f8fafc;padding:2px;border-radius:4px}
.elecBar{flex:1;min-height:3px;border-radius:2px 2px 1px 1px;background:#e5e7eb;position:relative;transition:.12s;cursor:pointer}
.elecBar.paid{background:linear-gradient(to top,#16a34a,#4ade80)}
.elecBar.unpaid{background:linear-gradient(to top,#dc2626,#f87171)}
.elecBar.na{background:#e5e7eb;min-height:2px}
.elecBar:hover{transform:scaleY(1.05);filter:brightness(1.1)}
.elecMonthLabels{display:flex;gap:1px;margin-top:1px}
.elecMonthLabels span{flex:1;font-size:7px;color:#94a3b8;text-align:center}

.detail{position:sticky;top:14px;background:white;border:1px solid #e5e7eb;border-radius:22px;padding:18px;box-shadow:0 4px 14px rgba(16,24,40,.045);min-height:300px;max-height:calc(100vh - 28px);overflow-y:auto}
.detailHead{border-bottom:1px solid #e5e7eb;padding-bottom:10px;margin-bottom:12px}
.detailTitle{font-size:22px;font-weight:900}
.detailSub{color:#667085;font-size:13px;margin-top:4px}
.detailBody{font-size:13px}
.detailBody .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e5e7eb;gap:8px}
.detailBody .row:last-child{border-bottom:none}
.detailBody .k{color:#667085;white-space:nowrap}
.detailBody .v{font-weight:800;text-align:right;word-break:break-all}
.detailBody .v.highlight{color:#78350f;background:#fef3c7;padding:3px 10px;border-radius:6px;font-size:14px}
.tenantBlock{background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:10px}
.tenantBlock.past{background:#f1f5f9;opacity:.8;border:1px dashed #cbd5e1}
.tenantBlock h4{margin:0 0 8px 0;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.historyTitle{font-size:12px;font-weight:900;color:#64748b;margin:14px 0 6px 0;padding-top:10px;border-top:2px dashed #cbd5e1}
.payTable{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
.payTable th,.payTable td{border:1px solid #e5e7eb;padding:4px 6px;text-align:center}
.payTable th{background:#f1f5f9;font-weight:900}
.payTable .paid{background:#dcfce7;color:#166534;font-weight:800}
.payTable .unpaid{background:#fee2e2;color:#1e293b;font-weight:800}
.payTable .none{color:#94a3b8}
.payTable.histTable{font-size:11px}
.payTable.histTable th{text-align:left;padding:5px 7px}
.payTable.histTable td{text-align:left;padding:4px 7px}
.payTable.histTable td.num,.payTable.histTable th.num{text-align:right;font-variant-numeric:tabular-nums}
.detailTabs{display:flex;gap:4px;border-bottom:2px solid #e5e7eb;margin-bottom:12px;margin-top:4px}
.detailTabs button{flex:1;background:transparent;border:none;border-bottom:3px solid transparent;padding:9px 6px;font-size:12px;font-weight:800;color:#64748b;cursor:pointer;border-radius:0;margin-bottom:-2px}
.detailTabs button:hover{color:#0f172a;background:#f8fafc}
.detailTabs button.active{color:#0f172a;border-bottom-color:#2563eb}
.tabPane{display:none}
.tabPane.active{display:block}
.detailSummaryStrip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;font-weight:800}
.detailSummaryStrip .chip{padding:4px 10px;border-radius:999px;background:#f1f5f9;color:#334155}
.detailSummaryStrip .chip.danger{background:#fee2e2;color:#991b1b}
.detailSummaryStrip .chip.ok{background:#dcfce7;color:#166534}

.globalReportPanel,.electricReportPanel,.residentInfoPanel,.moveOutPanel,.dataEntryPanel,.dataEntry2Panel,.elecLedgerPanel,.newResidentPanel{display:none;position:fixed;inset:54px 18px 18px 18px;background:#fff;z-index:100;border:1px solid #cbd5e1;border-radius:18px;box-shadow:0 20px 60px rgba(15,23,42,.28);overflow:auto;padding:20px}
.moveOutSummary{display:flex;gap:10px;margin:10px 0 14px 0;flex-wrap:wrap}
.moveOutSummary .pill{background:#f1f5f9;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;color:#334155}
.moveOutSummary .pill.warn{background:#e2e8f0;color:#1e293b}
.moveOutSummary .pill.info{background:#e2e8f0;color:#1e293b}
.moveOutSummary .pill.danger{background:#cbd5e1;color:#1e293b}
/* ===== 새로운 고급 상단 메뉴 디자인 (gtm- prefix) ===== */
.globalTopMenu{
    position:sticky;top:0;z-index:80;
    display:flex;align-items:center;gap:3px;
    background:linear-gradient(180deg,#0b1220 0%,#1a2336 100%);
    border-bottom:1px solid rgba(255,255,255,0.06);
    padding:0 14px;height:50px;
    box-shadow:0 6px 24px -8px rgba(0,0,0,0.55);
    color:#fff;
    font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    overflow-x:auto;white-space:nowrap;
    backdrop-filter:saturate(140%);
}
.gtm-brand{
    font-size:13.5px;font-weight:800;letter-spacing:0.4px;
    padding:0 14px 0 2px;margin-right:4px;
    border-right:1px solid rgba(255,255,255,0.08);
    color:#fff;flex-shrink:0;
    background:linear-gradient(135deg,#fff 30%,#94a3b8 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.gtm-brand .gtm-brandSub,.gtm-bar .gtm-brandSub,#appVersion{font-size:13px;color:#fbbf24;font-weight:800;margin-left:6px;letter-spacing:0.3px;-webkit-text-fill-color:#fbbf24;font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,monospace;background:linear-gradient(135deg,rgba(251,191,36,0.14),rgba(251,191,36,0.04));border:1.5px solid rgba(251,191,36,0.45);padding:4px 10px;border-radius:7px;cursor:default;box-shadow:0 1px 4px rgba(251,191,36,0.12);flex-shrink:0;white-space:nowrap}
.gtm-brand .gtm-brandSub:hover{background:rgba(251,191,36,0.25);color:#fde68a;-webkit-text-fill-color:#fde68a}
.gtm-divider{width:1px;height:20px;background:rgba(255,255,255,0.08);margin:0 5px;flex-shrink:0}
.gtm-spacer{flex:1 1 auto;min-width:6px}
.gtm-btn{
    background:transparent;border:1px solid transparent;
    color:rgba(255,255,255,0.82);
    padding:6px 11px;border-radius:7px;
    font-size:12.5px;font-weight:600;letter-spacing:0.15px;
    cursor:pointer;transition:all 0.15s ease;
    display:inline-flex;align-items:center;gap:5px;
    flex-shrink:0;white-space:nowrap;
}
.gtm-btn:hover{background:rgba(255,255,255,0.07);color:#fff;transform:translateY(-1px)}
.gtm-btn:active{transform:translateY(0)}
.gtm-btn.gtm-primary{
    background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);
    color:#fff;font-weight:800;
    box-shadow:0 2px 10px -2px rgba(59,130,246,0.55);
}
.gtm-btn.gtm-primary:hover{
    background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);
    box-shadow:0 4px 14px -2px rgba(59,130,246,0.7);
}
.gtm-btn.gtm-warn{color:#fca5a5;background:rgba(239,68,68,0.07);border-color:rgba(239,68,68,0.18)}
.gtm-btn.gtm-warn:hover{background:rgba(239,68,68,0.16);color:#fff;border-color:rgba(239,68,68,0.4)}
.gtm-btn.gtm-action{color:#fbbf24}
.gtm-btn.gtm-action:hover{background:rgba(251,191,36,0.1);color:#fff}
.gtm-btn .gtm-badge{
    display:inline-block;background:#ef4444;color:#fff;
    font-size:9.5px;font-weight:800;
    padding:1px 5px;border-radius:999px;
    margin-left:4px;line-height:1.4;
    box-shadow:0 0 0 1.5px rgba(239,68,68,0.25);
}
.gtm-clock{
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 12px;border-radius:7px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    font-size:11.5px;color:rgba(255,255,255,0.85);
    font-variant-numeric:tabular-nums;font-weight:600;
    letter-spacing:0.3px;flex-shrink:0;
}
.gtm-clock .gtm-clockDate{color:#fff;font-weight:700;font-size:13px;font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,"Courier New",monospace;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.gtm-clock .gtm-clockTime{color:#fff;font-weight:700;font-size:13px;font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,"Courier New",monospace;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.gtm-clock .gtm-clockDot{
    width:6px;height:6px;background:#10b981;border-radius:50%;
    box-shadow:0 0 6px #10b981;
}
.gtm-more{position:relative;flex-shrink:0}
.gtm-moreBtn{
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.85);
    padding:6px 12px;border-radius:7px;
    font-size:14px;font-weight:800;cursor:pointer;
    transition:all 0.15s ease;line-height:1;
}
.gtm-moreBtn:hover{background:rgba(255,255,255,0.1);color:#fff}
.gtm-dropdown{
    position:fixed;top:54px;right:18px;
    background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);
    border:1px solid rgba(255,255,255,0.12);border-radius:10px;
    padding:6px;min-width:220px;
    box-shadow:0 16px 40px -12px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.03);
    display:none;
    z-index:99999;
}
.gtm-dropdown.open{display:block;animation:gtmDdFade 0.15s ease}
@keyframes gtmDdFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.gtm-ddItem{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:6px;
    color:rgba(255,255,255,0.85);
    font-size:12.5px;font-weight:600;letter-spacing:0.15px;
    cursor:pointer;background:transparent;border:none;
    width:100%;text-align:left;transition:all 0.1s ease;
}
.gtm-ddItem:hover{background:rgba(255,255,255,0.08);color:#fff}
.gtm-ddItem .gtm-ddIcon{width:16px;text-align:center;opacity:0.7;flex-shrink:0;font-size:13px}
.gtm-ddDivider{height:1px;background:rgba(255,255,255,0.08);margin:5px 6px}
.gtm-version{
    font-size:10px;color:rgba(255,255,255,0.42);
    padding:7px 12px 4px 12px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    letter-spacing:0.3px;
}
@media (max-width:920px){
    .gtm-brand .gtm-brandSub,#appVersion{font-size:11px;padding:2px 7px}
    .gtm-btn{padding:5px 9px;font-size:12px}
    .gtm-divider{margin:0 3px}
}
/* 도움말 패널 */
.helpPanel{display:none;position:fixed;inset:54px 18px 18px 18px;background:#fff;z-index:120;border:1px solid #cbd5e1;border-radius:18px;box-shadow:0 20px 60px rgba(15,23,42,.28);overflow:auto;padding:0}
.helpPanel.show{display:block}
.helpPanel .hp-head{position:sticky;top:0;z-index:2;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;border-radius:18px 18px 0 0}
.helpPanel .hp-head h2{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.helpPanel .hp-head .hp-kbd{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;margin-left:6px}
.helpPanel .hp-head .hp-spacer{flex:1 1 auto}
.helpPanel .hp-head .hp-close{background:#ef4444;border:none;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:800}
.helpPanel .hp-head .hp-close:hover{background:#dc2626}
.helpPanel .hp-body{padding:18px 24px 40px 24px;max-width:1100px;margin:0 auto}
.helpPanel .hp-toc{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#f1f5f9;border-radius:10px;margin-bottom:18px;position:sticky;top:56px;z-index:1;border:1px solid #e2e8f0}
.helpPanel .hp-toc a{padding:5px 12px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;text-decoration:none;color:#334155;font-size:12px;font-weight:700}
.helpPanel .hp-toc a:hover{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}

/* Messaging (SMS) panel */
.msgPanel{display:none;position:fixed;inset:54px 18px 18px 18px;background:#fff;z-index:100;border:1px solid #cbd5e1;border-radius:18px;box-shadow:0 20px 60px rgba(15,23,42,.28);overflow:auto;padding:20px}
.msgTabs{display:flex;gap:6px;border-bottom:2px solid #e2e8f0;margin:8px 0 14px 0}

.msgVarHint{display:flex;flex-wrap:wrap;gap:5px;font-size:11px}

.msgVarHint code:hover{background:#fde68a}
.msgBtn{padding:9px 14px;border-radius:8px;border:none;font-weight:800;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.msgBtn.primary{background:linear-gradient(135deg,#06b6d4,#0891b2);color:white;box-shadow:0 2px 6px rgba(8,145,178,.25)}
.msgBtn.primary:hover{background:linear-gradient(135deg,#0891b2,#0e7490)}
.msgBtn.outline{background:white;color:#0e7490;border:1.5px solid #06b6d4}
.msgBtn.outline:hover{background:#ecfeff}
.msgBtn.ghost{background:#f1f5f9;color:#475569}
.msgBtn.ghost:hover{background:#e2e8f0}
.msgBtn.danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.msgBtn.danger:hover{background:#fecaca}
.msgInput{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:13px;box-sizing:border-box}
.msgInput:focus{outline:2px solid #06b6d4;border-color:#06b6d4}
.msgTextarea{width:100%;min-height:110px;padding:11px 13px;border:1px solid #cbd5e1;border-radius:8px;font-family:"Malgun Gothic",monospace;font-size:13px;line-height:1.55;box-sizing:border-box;resize:vertical}
.msgTextarea:focus{outline:2px solid #06b6d4;border-color:#06b6d4}
.msgTable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.msgTable th,.msgTable td{border:1px solid #e5e7eb;padding:6px 9px;text-align:left}
.msgTable thead th{background:#f1f5f9;font-weight:800;position:sticky;top:0}
.msgTable tr.disabled td{background:#f8fafc;color:#94a3b8}
.msgTable tr.queued td{background:#ecfeff}
.msgTable tr.sent td{background:#f0fdf4}
.msgTable .num{text-align:right;font-variant-numeric:tabular-nums}
.msgFilter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;margin:6px 0}
.msgFilter label{font-size:12px;color:#475569;font-weight:700;display:flex;align-items:center;gap:5px}
.msgFilter select,.msgFilter input{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;background:white}
.msgChar{font-size:11px;color:#64748b;margin-top:4px;text-align:right}
.msgChar.warn{color:#dc2626;font-weight:700}
.msgRuleCard{background:white;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.msgRuleCard.enabled{border-color:#06b6d4;background:linear-gradient(135deg,#fff 0%,#f0fdfa 100%)}
.msgRuleCard.disabled{opacity:.6}
.msgRuleCard .rname{font-weight:800;color:#0f172a;font-size:14px}
.msgRuleCard .rmeta{font-size:11px;color:#64748b;margin-top:3px;line-height:1.55}
.msgRuleCard .ractions{display:flex;gap:5px;flex-direction:column}
.msgQueueBadge{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#06b6d4,#0891b2);color:white;padding:14px 20px;border-radius:50px;box-shadow:0 8px 24px rgba(6,182,212,.4);font-weight:800;cursor:pointer;display:none;z-index:200;animation:msgPulse 2s ease-in-out infinite;font-size:13px}
.msgQueueBadge.show{display:flex;align-items:center;gap:10px}
.msgQueueBadge .qcount{background:white;color:#0e7490;border-radius:50px;padding:3px 10px;font-size:14px;font-weight:900}

.msgTplCard{background:white;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:6px 0}
.msgTplCard h5{margin:0 0 5px 0;font-size:13px;color:#0f172a;display:flex;align-items:center;gap:8px}
.msgTplCard .tbody{font-family:"Malgun Gothic",monospace;font-size:12px;color:#334155;background:#f8fafc;padding:8px 10px;border-radius:6px;white-space:pre-wrap;line-height:1.55}
.msgTplCard .tactions{display:flex;gap:5px;margin-top:6px;justify-content:flex-end}
.msgEmpty{text-align:center;padding:30px;color:#94a3b8;font-size:13px;background:#f8fafc;border-radius:10px;border:1px dashed #cbd5e1}

.xlUploadBtn{padding:8px 14px;background:linear-gradient(135deg,#10b981,#059669);color:white;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:12px;box-shadow:0 2px 6px rgba(5,150,105,.25)}

.xlModalHead .xlClose{background:#ef4444;border:none;color:white;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:800}

.xlPreview{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}

.xlPreview thead th{background:#f1f5f9;position:sticky;top:0;font-weight:800}
.xlPreview tr.bad td{background:#fee2e2}

.xlPreview tr.warn td{background:#f1f5f9}
.xlSummary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.xlSummary .pill{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid #cbd5e1;background:#f8fafc;color:#334155}

/* ================================================================== */
/* === ✨ 모던 폴리시 (2026-04-29) — UI 전체 시각 개선 (CSS 전용) === */
/* ================================================================== */

/* — 폰트/배경 — */
body{
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif !important;
    background:linear-gradient(135deg,#eef2ff 0%,#f8fafc 30%,#f1f5f9 70%,#fef3c7 100%) !important;
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

/* — 헤더/타이틀 — */
header h1{
    font-size:38px !important;
    font-weight:900 !important;
    letter-spacing:-.045em !important;
    background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 50%,#7c3aed 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    line-height:1.1;
    padding-bottom:2px;
}
header .sub{
    font-size:13px;
    color:#64748b;
    margin-top:8px;
    font-weight:600;
    letter-spacing:.01em;
}
.headerClock{
    background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 50%,#3b82f6 100%) !important;
    box-shadow:0 8px 24px rgba(30,58,138,.28),inset 0 1px 0 rgba(255,255,255,.18) !important;
    border:1px solid rgba(255,255,255,.06) !important;
    border-radius:16px !important;
    transition:transform .25s ease,box-shadow .25s ease;
}
.headerClock:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(30,58,138,.36),inset 0 1px 0 rgba(255,255,255,.2) !important}

/* — baselineCaption — */
.baselineCaption{
    background:linear-gradient(90deg,#dbeafe 0%,#e0e7ff 50%,#ede9fe 100%) !important;
    border:none !important;
    border-left:4px solid #6366f1 !important;
    box-shadow:0 2px 10px rgba(99,102,241,.10);
    padding:10px 16px !important;
    border-radius:10px !important;
}

/* — 통계 카드 (홈 상단 4개) — */
.stat{
    border-radius:18px !important;
    padding:18px 20px !important;
    background:linear-gradient(135deg,#fff 0%,#fafbfc 100%) !important;
    border:1px solid rgba(226,232,240,.7) !important;
    box-shadow:0 1px 3px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05) !important;
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
    position:relative;
    overflow:hidden;
}
.stat::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899);
    opacity:.85;
}
.stat:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(15,23,42,.08),0 12px 32px rgba(15,23,42,.10) !important;
    border-color:rgba(99,102,241,.4) !important;
}
.stat .label{
    font-size:12.5px !important;
    color:#64748b !important;
    font-weight:700 !important;
    letter-spacing:.02em;
    text-transform:uppercase;
}
.stat .value{
    font-size:28px !important;
    font-weight:900 !important;
    margin-top:8px !important;
    letter-spacing:-.025em;
    background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    font-variant-numeric:tabular-nums;
}
.stat.unpaidStat{
    background:linear-gradient(135deg,#fef2f2 0%,#fee2e2 50%,#fecaca 100%) !important;
    border:1px solid #fca5a5 !important;
    box-shadow:0 4px 18px rgba(220,38,38,.18) !important;
}
.stat.unpaidStat::before{
    background:linear-gradient(90deg,#dc2626,#ef4444,#f87171) !important;
}
.stat.unpaidStat .label{color:#991b1b !important}
.stat.unpaidStat .value{
    background:linear-gradient(135deg,#7f1d1d 0%,#dc2626 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* — 호실 카드 hover lift — */
.roomCard{
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease !important;
}
.roomCard:hover:not(.vacant):not(.unpaid-highlight):not(.elec-unpaid-only){
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(15,23,42,.10),0 2px 6px rgba(15,23,42,.05) !important;
    border-color:#3b82f6 !important;
}
.roomCard.unpaid-highlight:hover{
    transform:translateY(-2px);
    box-shadow:0 0 16px rgba(239,68,68,.4),0 8px 24px rgba(239,68,68,.18) !important;
}
.roomCard.selected{
    border-color:#3b82f6 !important;
    box-shadow:0 0 0 3px rgba(59,130,246,.18),0 6px 18px rgba(59,130,246,.18) !important;
}

/* — Floor 그룹 박스 — */
.floor{
    box-shadow:0 1px 3px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05) !important;
    border:1px solid rgba(226,232,240,.7) !important;
    border-radius:20px !important;
}

/* — 검색창 폴리시 — */
.search{
    border:1.5px solid #e2e8f0 !important;
    border-radius:14px !important;
    padding:13px 16px !important;
    background:#fff;
    box-shadow:0 1px 3px rgba(15,23,42,.04);
    transition:border-color .18s ease,box-shadow .18s ease;
}
.search:focus{
    outline:none;
    border-color:#6366f1 !important;
    box-shadow:0 0 0 3px rgba(99,102,241,.12),0 1px 3px rgba(15,23,42,.04) !important;
}

/* — 상단 메뉴 (gtm-bar) 다듬기 — */
.gtm-bar{
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    background:linear-gradient(180deg,rgba(15,23,42,.94) 0%,rgba(30,41,59,.92) 100%) !important;
    border-bottom:1px solid rgba(255,255,255,.06) !important;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
}
.gtm-btn{
    transition:all .14s ease !important;
    background:rgba(100,116,139,.55) !important;
    color:#fff !important;
    border-color:rgba(255,255,255,.10) !important;
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif !important;
    font-size:13px !important;
    font-weight:700 !important;
    letter-spacing:.01em !important;
}
.gtm-btn:hover{
    background:rgba(100,116,139,.85) !important;
    color:#fff !important;
    border-color:rgba(255,255,255,.22) !important;
    transform:translateY(-1px);
}
/* 홈 버튼만 파란색 + 좌우 폭 확장 */
.gtm-btn.gtm-primary{
    background:linear-gradient(135deg,#3b82f6 0%,#1e40af 100%) !important;
    color:#fff !important;
    box-shadow:0 2px 8px rgba(59,130,246,.32);
    border-color:rgba(255,255,255,.15) !important;
    padding-left:24px !important;padding-right:24px !important;
    font-weight:900 !important;
}
.gtm-btn.gtm-primary:hover{
    background:linear-gradient(135deg,#2563eb 0%,#1e3a8a 100%) !important;
    box-shadow:0 4px 14px rgba(59,130,246,.45) !important;
}
/* gtm-action 도 회색으로 통일 (이전 노란색 → 회색) */
.gtm-btn.gtm-action{
    background:rgba(100,116,139,.55) !important;
    color:#fff !important;
    border-color:rgba(255,255,255,.10) !important;
}
.gtm-btn.gtm-action:hover{
    background:rgba(100,116,139,.85) !important;
    color:#fff !important;
    border-color:rgba(255,255,255,.22) !important;
}
.gtm-clock{
    background:linear-gradient(135deg,rgba(59,130,246,.15) 0%,rgba(99,102,241,.12) 100%) !important;
    border:1px solid rgba(59,130,246,.25) !important;
    border-radius:10px !important;
    padding:5px 12px !important;
    min-width:240px !important;justify-content:center;
}

/* — 패널 헤더 (월간보고/입력관리 등) — */
.panelHead{
    background:linear-gradient(90deg,#f8fafc 0%,#fff 100%);
    padding:14px 20px;
    border-radius:14px 14px 0 0;
    border-bottom:1px solid rgba(226,232,240,.7);
    margin:-20px -20px 16px -20px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
}
.panelHead h2{
    font-size:22px !important;
    letter-spacing:-.025em;
    font-weight:900;
    background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 70%,#3b82f6 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* — 일반 버튼 둥글기/그림자 — */
button:not(.gtm-btn):not(.de-saveAll):not(.msgBtn){
    border-radius:10px;
    transition:all .15s ease;
}
button:not(.gtm-btn):not(.de-saveAll):not(.msgBtn):hover{
    transform:translateY(-1px);
    box-shadow:0 2px 6px rgba(15,23,42,.10);
}

/* — 카드 배지 통일 — */
.badge-unpaid{
    background:linear-gradient(135deg,#dc2626,#ef4444) !important;

// === B06 baseNote 잘못 매칭 복원 (이소정 → 심영자로 잘못 들어간 데이터 이동) ===
(function fixB06NoteSwap(){
    var KEY = 'cheonghwa_regent_b06_note_swap_fixed_v1';
    if(localStorage.getItem(KEY)) return;
    try {
        var raw = localStorage.getItem('cheonghwa_regent_tenant_edits_v1');
        if(!raw){ localStorage.setItem(KEY, '1'); return; }
        var all = JSON.parse(raw);
        var moved = false;
        // localStorage 측: 심영자에 있는 항목 중, 이소정에는 없는 항목을 이소정으로 이동
        if(all['B06']){
            // baseNote 이동
            if(all['B06']['심영자'] && all['B06']['심영자'].baseNote &&
               (!all['B06']['이소정'] || !all['B06']['이소정'].baseNote)){
                if(!all['B06']['이소정']) all['B06']['이소정'] = {};
                all['B06']['이소정'].baseNote = all['B06']['심영자'].baseNote;
                delete all['B06']['심영자'].baseNote;
                moved = true;
                console.log('[B06 fix] baseNote 심영자→이소정 이동');
            }
            // 빈 객체 정리
            if(all['B06']['심영자'] && Object.keys(all['B06']['심영자']).length === 0){
                delete all['B06']['심영자'];
            }
        }
        if(moved){
            localStorage.setItem('cheonghwa_regent_tenant_edits_v1', JSON.stringify(all));
        }
        // ROOMS 메모리 측: 심영자.baseNote가 있고 이소정.baseNote가 없으면 이동
        var b06 = ROOMS.find(function(x){ return x.room === 'B06'; });
        if(b06){
            var sim = (b06.tenants||[]).find(function(t){ return t.tenant === '심영자'; });
            var lee = (b06.tenants||[]).find(function(t){ return t.tenant === '이소정'; });
            if(sim && sim.baseNote && lee && !lee.baseNote){
                lee.baseNote = sim.baseNote;
                sim.baseNote = null;
                console.log('[B06 fix] ROOMS 메모리: baseNote 심영자→이소정 이동');
            }
        }
        localStorage.setItem(KEY, '1');
    } catch(e){ console.error('B06 fix error', e); }
})();



// === 퇴실일 ↔ isPast 자동 동기화 1회 patch ===
(function syncMoveOutDateIsPast(){
    var KEY = 'cheonghwa_regent_moveout_ispast_synced_v1';
    if(localStorage.getItem(KEY)) return;
    try {
        var teKey = 'cheonghwa_regent_tenant_edits_v1';
        var te = JSON.parse(localStorage.getItem(teKey) || '{}');
        var fixed = 0;
        Object.keys(te).forEach(function(rm){
            Object.keys(te[rm]).forEach(function(name){
                var ed = te[rm][name];
                if(ed && ed.moveOutDate && !ed.isPast){
                    ed.isPast = true;
                    fixed++;
                    // ROOMS 메모리도 동기화
                    var r = ROOMS.find(function(x){ return x.room === rm; });
                    if(r){
                        var t = (r.tenants||[]).find(function(tt){ return tt.tenant === name; });
                        if(t) t.isPast = true;
                    }
                }
            });
        });
        if(fixed > 0){
            localStorage.setItem(teKey, JSON.stringify(te));
            console.log('[퇴실일 isPast 자동 동기화] ' + fixed + '명 보정');
        }
        localStorage.setItem(KEY, '1');
    } catch(e){ console.error('moveout sync error', e); }
})();

// === ROOMS 부팅 자동 sweep: moveOutDate 과거면 isPast=true 자동 보정 (매번 실행) ===
(function autoSyncIsPastFromMoveOut(){
    try {
        var today = new Date();
        var todayKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0');
        var fixed = 0;
        ROOMS.forEach(function(r){
            (r.tenants||[]).forEach(function(t){
                if(t.moveOutDate && !t.isPast){
                    var moKey = String(t.moveOutDate).replace(/\./g,'-').slice(0,7);
                    if(moKey <= todayKey){
                        t.isPast = true;
                        fixed++;
                    }
                }
            });
        });
        if(fixed > 0) console.log('[부팅 sweep] moveOutDate 과거 → isPast=true 자동 보정: ' + fixed + '명');
    } catch(e){ console.error('autoSyncIsPast error', e); }
})();


// === 7층 공실 호실 런타임 제거 (현재 입주자 없는 호실만 splice) ===
(function remove7fVacant(){
    var removed = [];
    for(var i = ROOMS.length - 1; i >= 0; i--){
        var r = ROOMS[i];
        if(!r.room || !/^7\d/.test(String(r.room))) continue;
        var hasCurrent = (r.tenants||[]).some(function(t){ return !t.isPast && t.tenant; });
        if(!hasCurrent){
            removed.push(r.room);
            ROOMS.splice(i, 1);
        }
    }
    if(removed.length > 0) console.log('[7층 공실 제거] ' + removed.join(', '));
})();

    for(let i = 0; i < count; i++){
        const d = new Date(today.getFullYear(), today.getMonth() + startOffset + i, 1);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        arr.push(yyyy + '-' + mm);
    }
    return arr;
}
const RENT_MONTHS = generateRecentMonths(6);     // 최근 6개월 (현재 포함)
const ELEC_MONTHS = generateRecentMonths(8, 1);  // 최근 7개월 + 다음 1개월

// === 미납 스캔용 확장 월 집합 (롤링 윈도우 밖의 오래된 미납도 놓치지 않음) ===
function extMonthsForTenant(t){
    const s = new Set(RENT_MONTHS);
    Object.keys((t && t.payments) || {}).forEach(m => s.add(m));
    return s;
}
function extMonthsForRoom(room){
    const s = new Set(RENT_MONTHS);
    (room && room.tenants || []).forEach(t => Object.keys(t.payments || {}).forEach(m => s.add(m)));
    if(room && room.elec) Object.keys(room.elec).forEach(m => s.add(m));
    return s;
}
function isOldRentMonth(m){ return !RENT_MONTHS.includes(m); }
function isOldElecMonth(m){ return !RENT_MONTHS.includes(m) && !ELEC_MONTHS.includes(m); }

let selectedRoom = null;

// 조회월 변경 함수 — baselineCaption input 에서 호출
function setQueryMonth(val){
    if(val && /^\d{4}-\d{2}$/.test(val)){
        window._queryMonth = val;
    } else {
        window._queryMonth = null;  // 오늘로 초기화
    }
    if(typeof render === 'function') render();
}

function fmt(n){
    if(n==null||n===''||n==='N/A') return '-';
    if(typeof n==='string' && !/^\d/.test(n)) return n;
    const num = Number(String(n).replace(/,/g,''));
    if(isNaN(num)) return String(n);
    return num.toLocaleString('ko-KR');
}
function monthLabel(m){ return m.replace('-','.'); }

// 각 방의 현재 입주자
function currentTenant(r){
    if(!r || !r.tenants) return null;
    return r.tenants.find(t => t && !t.isPast) || r.tenants[0] || null;
}
// 과거 입주자들
function pastTenants(r){
    if(!r || !r.tenants) return [];
    return r.tenants.filter(t => t && t.isPast);
}

function rentPayStatus(tenant, monthKey){
    // === 선불 자동 미납 로직 (월세·관리비·주차비) ===
    // 룰1: 퇴실자(isPast=true)는 무조건 미납 처리 안 함 (정산 완료 가정)
    if(tenant && tenant.isPast) return {cls:'none', label:'-'};
    // 룰2: moveOutDate가 있고 그 월이 오늘 이전이면 → 이미 퇴실 → 미납 X
    if(tenant && tenant.moveOutDate){
        const _todayD = new Date();
        const _todayKD = _todayD.getFullYear() + '-' + String(_todayD.getMonth()+1).padStart(2,'0');
        const _moKD = String(tenant.moveOutDate).replace(/\./g,'-').slice(0,7);
        if(_moKD <= _todayKD) return {cls:'none', label:'-'};
    }
    // 계약 시작 이전 → none (해당 없음)
    const cs = tenant.contractStart;
    if(cs){
        const csKey = cs.replace(/\./g,'-').slice(0,7);
        if(monthKey < csKey) return {cls:'none', label:'-'};
    }
    // 계약 종료 이후 → none (퇴실자: moveOutDate 또는 contractEnd 이후)
    const ceSrc = tenant.moveOutDate || tenant.contractEnd || '';
    if(ceSrc){
        const ceKey = ceSrc.replace(/\./g,'-').slice(0,7);
        if(monthKey > ceKey) return {cls:'none', label:'-'};
    } else if(tenant.isPast){
        // 퇴실자인데 퇴실일/계약만기 둘 다 없으면 모든 월 미납 처리 안 함 (정산 완료로 간주)
        return {cls:'none', label:'-'};
    }
    // 미래 월 → none (선불이라도 아직 받을 시점 아님)
    const today = new Date();
    const todayKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0');
    if(monthKey > todayKey) return {cls:'none', label:'-'};

    // payments 기록 있으면 기존 로직
    const p = tenant.payments && tenant.payments[monthKey];
    if(p){
        const v = p.rentPaid;
        if(!v) return {cls:'unpaid', label:'미납'};
        if(String(v).includes('미납')) return {cls:'unpaid', label:'미납'};
        return {cls:'paid', label:String(v)};
    }
    // payments 없음 + 계약 진행 중 + 현재월 이하 → 선불 자동 미납 ⭐
    return {cls:'unpaid', label:'미납'};
}

function isRecentlyUnpaid(room){
    const recent = RENT_MONTHS.slice(-4,-1);
    const t = currentTenant(room);
    if(!t) return false;
    // 룰: 퇴실자(isPast OR moveOutDate 과거) → 미납 X
    if(t.isPast) return false;
    if(t.moveOutDate){
        const _today2 = new Date();
        const _todayKey2 = _today2.getFullYear() + '-' + String(_today2.getMonth()+1).padStart(2,'0');
        const _moKey2 = String(t.moveOutDate).replace(/\./g,'-').slice(0,7);
        if(_moKey2 <= _todayKey2) return false;
    }
    for(const m of recent){
        const cs = t.contractStart;
        if(cs){
            const csKey = cs.replace(/\./g,'-').slice(0,7);
            if(m < csKey) continue;
        }
        if(rentPayStatus(t, m).cls==='unpaid') return true;
    }
    return false;
}

// 전기세 미납 여부: 최근 전기세 월 중 금액 청구는 있으나 수납일 없는 경우
function isRecentlyElecUnpaid(room){
    if(!room.elec) return false;
    // 룰: 부과>0 + 입금 정보 명시 입력 + 입금 < 부과 = 미납 (입금 미입력은 미납 X)
    const recent = ELEC_MONTHS.slice(-5,-1);
    for(const m of recent){
        const e = room.elec[m];
        if(!e) continue;
        const bill = Number(e.bill) || 0;
        if(bill <= 0) continue;
        if(!_elecHasPaidInput(e)) continue;
        if(elecPaidOf(e) < bill) return true;
    }
    return false;
}

// 미납 총액 계산: 전체 기간 고정비 + 전체 기간 전기세 미납금액 합산
// (홈 미납 총액 카드 / 호실 상세 미납 박스 통일)
function unpaidTotals(room){
    const t = currentTenant(room);
    if(!t) return {rent:0, elec:0, total:0, rentMonths:[], elecMonths:[]};
    let rentSum = 0, elecSum = 0;
    const rentMonths = [], elecMonths = [];

    // === 전기: 호실 단위, 모든 r.elec 월의 (부과 - 입금) > 0 누적 ===
    if(room.elec){
        Object.entries(room.elec).forEach(([m, e]) => {
            if(!e) return;
            const bill = elecBillOf(e);
            if(bill <= 0) return;
            const paid = elecPaidOf(e);
            const diff = bill - paid;
            if(diff > 0){
                elecSum += diff;
                elecMonths.push(m);
            }
        });
        elecMonths.sort();
    }

    // === 고정비: 현재 입주자(non-past) 의 계약시작 ~ 오늘 사이 모든 미납월 ===
    let _rentBlocked = false;
    if(t.isPast) _rentBlocked = true;
    if(!_rentBlocked && t.moveOutDate){
        const _today = new Date();
        const _todayKey = _today.getFullYear() + '-' + String(_today.getMonth()+1).padStart(2,'0');
        const _moKey = String(t.moveOutDate).replace(/\./g,'-').slice(0,7);
        if(_moKey <= _todayKey) _rentBlocked = true;
    }
    if(_rentBlocked) return {rent:0, elec:elecSum, total:elecSum, rentMonths:[], elecMonths};

    const monthlyTotal = t.monthlyTotal || ((t.rent||0) + (t.mgmtNum||0) + (t.parkingNum||0));
    const cs = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
    const _today2 = new Date();
    const _todayKey2 = _today2.getFullYear() + '-' + String(_today2.getMonth()+1).padStart(2,'0');
    // 검사 범위: payments 에 명시 입력된 월 + RENT_MONTHS(롤링 6개월). 
    // 계약 만료 후 갱신된 장기 거주자(예: 2011년 계약)도 시스템에 데이터 있는 범위만 검사.
    const _monthsToCheck = new Set(RENT_MONTHS);
    Object.keys(t.payments || {}).forEach(m => _monthsToCheck.add(m));
    [..._monthsToCheck].sort().forEach(m => {
        if(cs && m < cs) return;
        if(m > _todayKey2) return;
        if(rentPayStatus(t, m).cls === 'unpaid'){
            rentSum += monthlyTotal;
            rentMonths.push(m);
        }
    });
    return {rent:rentSum, elec:elecSum, total:rentSum+elecSum, rentMonths, elecMonths};
}

// 월별 미납 상세 (현재+퇴실자 통합 + 호실 전기세) — 상세창 월별 미납현황 섹션용
function unpaidByMonth(room){
    const rows = {};
    // 확장 월 집합: 롤링 RENT_MONTHS + 모든 입주자 payments 키 + 호실 elec 키
    // → 롤링 윈도우 밖의 오래된 미납도 놓치지 않음 (옵션 D)
    const extMonths = new Set(RENT_MONTHS);
    (room.tenants || []).forEach(t => {
        Object.keys(t.payments || {}).forEach(m => extMonths.add(m));
    });
    if(room.elec){
        Object.keys(room.elec).forEach(m => extMonths.add(m));
    }
    // 모든 입주자(현재 + 퇴실)의 고정비 미납을 확장 월별로 집계
    (room.tenants || []).forEach(t => {
        const monthlyTotal = t.monthlyTotal || ((Number(t.rent)||0) + (Number(t.mgmtNum)||0) + (Number(t.parkingNum)||0));
        if(!monthlyTotal) return;
        const csKey = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
        const endSrc = t.moveOutDate || t.contractEnd || '';
        const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
        extMonths.forEach(m => {
            if(csKey && m < csKey) return;
            if(ceKey && m > ceKey) return;
            if(rentPayStatus(t, m).cls === 'unpaid'){
                if(!rows[m]) rows[m] = {month:m, rent:0, elec:0, names:new Set(), isOld: !RENT_MONTHS.includes(m)};
                rows[m].rent += monthlyTotal;
                rows[m].names.add(t.tenant);
            }
        });
    });
    // 호실 전기세 (전체 기간 부과-입금 차액)
    // 룰: bill>0 + 입금 미입력 = 미납 (퇴실자 무관, 부과서 이름 무관)
    if(room.elec){
        Object.entries(room.elec).forEach(([m, e]) => {
            if(!e) return;
            const bill = Number(e.bill) || 0;
            if(bill <= 0) return;
            if(!_elecHasPaidInput(e)) return; // 입금 미입력은 미납 X
            const paid = elecPaidOf(e);
            const diff = bill - paid;
            if(diff > 0){
                if(!rows[m]) rows[m] = {month:m, rent:0, elec:0, names:new Set(), isOld: !RENT_MONTHS.includes(m) && !ELEC_MONTHS.includes(m)};
                rows[m].elec += diff;
                if(e.name) rows[m].names.add(e.name);
            }
        });
    }
    return Object.values(rows)
        .map(r => Object.assign(r, {total: r.rent + r.elec, namesArr: Array.from(r.names)}))
        .sort((a,b) => b.month.localeCompare(a.month));
}

// 퇴실자 개인 미납액 계산 (계약기간 내 고정비 미납 + 이 퇴실자 이름으로 부과된 전기 미수)
function pastTenantUnpaid(room, tenant){
    const rentMonths = [];
    let rentSum = 0;
    const monthlyTotal = tenant.monthlyTotal || ((Number(tenant.rent)||0) + (Number(tenant.mgmtNum)||0) + (Number(tenant.parkingNum)||0));
    const csKey = tenant.contractStart ? tenant.contractStart.replace(/\./g,'-').slice(0,7) : null;
    const endSrc = tenant.moveOutDate || tenant.contractEnd || '';
    const ceKey = endSrc ? endSrc.replace(/\./g,'-').slice(0,7) : null;
    // 퇴실자 고정비 미수: payments[m].rentPaid 가 없으면 미납으로 간주.
    // (rentPayStatus 는 isPast=true 면 무조건 'none' 반환하므로 우회하고 직접 검사)
    extMonthsForTenant(tenant).forEach(m => {
        if(csKey && m < csKey) return;
        if(ceKey && m > ceKey) return;
        const p = tenant.payments && tenant.payments[m];
        const rp = p && p.rentPaid;
        if(!rp || String(rp).includes('미납')){
            rentSum += monthlyTotal;
            rentMonths.push(m);
        }
    });
    // 전기세: 이 퇴실자 이름으로 부과된 월 중 미수
    // 룰: bill>0 + 입금 미입력 = 미납 (이름 매칭 시)
    const elecDetails = [];
    let elecSum = 0;
    if(room && room.elec){
        Object.entries(room.elec).forEach(([m, e]) => {
            if(!e) return;
            if(_resolveBillTenant(room, m, e) !== tenant) return;
            const bill = Number(e.bill) || 0;
            if(bill <= 0) return;
            if(!_elecHasPaidInput(e)) return; // 입금 미입력은 미납 X
            const paid = elecPaidOf(e);
            const diff = bill - paid;
            if(diff > 0){
                elecSum += diff;
                elecDetails.push({month:m, bill, paid, diff});
            }
        });
    }
    elecDetails.sort((a,b)=>a.month.localeCompare(b.month));
    return {rent:rentSum, elec:elecSum, total:rentSum+elecSum, rentMonths, elecDetails};
}

// 전기세 부과금/입금액 헬퍼 (paidAmount 필드가 없으면 수납일 유무로 추정)
function elecBillOf(e){ return Number(e && e.bill) || 0; }

// 부과서명 정규화: "푸엉타오(外)" → "푸엉타오"
function _normalizeName(s){ return String(s||'').replace(/\([^)]*\)/g,'').trim(); }
// 부과서 e (room의 elec[mkey])가 어느 tenant에 속하는지 결정
// 우선순위: 정확이름 → 괄호제거이름 → 계약기간 → 현재 tenant fallback (합계 보존)
function _resolveBillTenant(room, mkey, e){
    if(!e || !room || !room.tenants || room.tenants.length === 0) return null;
    const tenants = room.tenants;
    if(e.name){
        // 1. 이름 정확 일치
        const exact = tenants.find(t => t && t.tenant === e.name);
        if(exact) return exact;
        // 2. 괄호 제거 후 일치 (예: "푸엉타오" vs "푸엉타오(外)")
        const nNorm = _normalizeName(e.name);
        if(nNorm){
            const loose = tenants.find(t => t && _normalizeName(t.tenant) === nNorm);
            if(loose) return loose;
        }
    }
    // 3. 계약기간으로 추정 (해당 월에 활성 tenant)
    const inPeriod = tenants.filter(t => {
        if(!t) return false;
        const csKey = t.contractStart ? t.contractStart.replace(/\./g,'-').slice(0,7) : null;
        const ceSrc = t.moveOutDate || t.contractEnd || '';
        const ceKey = ceSrc ? ceSrc.replace(/\./g,'-').slice(0,7) : null;
        if(csKey && mkey < csKey) return false;
        if(ceKey && mkey > ceKey) return false;
        return true;
    });
    if(inPeriod.length === 1) return inPeriod[0];
    if(inPeriod.length > 1){
        // 둘 이상 겹치면 현재 입주자 우선
        const cur = inPeriod.find(t => !t.isPast);
        if(cur) return cur;
        return inPeriod[0];
    }
    // 4. 최후 fallback: 현재 tenant (없으면 첫 tenant) — 합계 일치 보장
    return tenants.find(t => t && !t.isPast) || tenants[0];
}
// 입금 정보(paidAmount 또는 received)가 명시적으로 입력됐는지 확인
// 단순 룰 (2026-04-28 변경): 부과금이 있으면 무조건 미납 판정 대상.
//   수납일이 입력 안 된 경우도 입금 0으로 간주 → 전액 미납.
//   기존 "입금 미입력은 미납 X" 룰은 잘못된 가정이었으므로 폐기.
//   호환성을 위해 함수는 유지하되 항상 true 반환 (호출 부위 7곳에 일관 적용).
function _elecHasPaidInput(e){
    if(!e) return false;
    return true; // 부과금만 있으면 무조건 미납 판정 대상
}
function elecPaidOf(e){
    if(!e) return 0;
    if(e.paidAmount !== undefined && e.paidAmount !== null) return Number(e.paidAmount)||0;
    // 하위호환: received 일자가 있으면 전액 납부한 것으로 간주
    return e.received ? (Number(e.bill)||0) : 0;
}
function elecStatusOf(e){
    const bill = elecBillOf(e);
    if(!bill) return {cls:'none', label:'-', diff:0};
    const paid = elecPaidOf(e);
    const diff = bill - paid; // 양수: 미수, 0: 완납, 음수: 과납
    if(paid <= 0) return {cls:'unpaid', label:'미납', diff};
    if(paid < bill) return {cls:'partial', label:'일부납부', diff};
    if(paid === bill) return {cls:'paid', label:'완납', diff:0};
    return {cls:'paid', label:'과납', diff}; // diff < 0
}

function roomCard(r){
    const t = currentTenant(r);
    const history = pastTenants(r);
    const isVacant = !t || t.isPast; // 모든 입주자가 퇴실 상태면 공실
    if(isVacant){
        const lastOut = history.length ? history.map(h => h.moveOutDate || h.contractEnd || '').sort().reverse()[0] : '';
        const lastName = history.length ? history[history.length-1].tenant : '';
        const cls = [
            'roomCard','vacant',
            String(r.room)===String(selectedRoom) ? 'selected' : '',
            history.length > 0 ? 'has-history' : ''
        ].filter(Boolean).join(' ');
        return `<button class="${cls}" onclick="selectRoom('${r.room}')">
            <div class="roomNoLine">
                <span class="roomNo">${r.room}</span>
